,"就会穿越隧道","回到森林","又一个满月的夜晚","我钻进树洞","发现你留下的两颗","白色石子","百思不解你的选择","心底忽然长出巨大的空洞","生命被抽空了一截","泪水滴落在白色石子上","松鼠吱吱叫个不停","啄木鸟敲醒悲伤","一颗白色石子","在月光下慢慢褪色","露出我从来没有这样喜欢过的","调皮的黑色……"],"d":"output-石","img":["image.jpg"],"aud":["audio.mp3"]},{"i":"025","c":"蜗","t":["我有一个朋友","他是只蜗牛","我们第一次相遇","是在森林里那条小河上","我要去对岸","和好久不见的蘑菇聊天","走上独木桥的时候","前面有只蜗牛","狭窄的桥上","我们互道早安","蜗牛飞奔","努力为我让路","他气喘吁吁地跑了两厘米","停下来回头看着我","满含歉意地说","对不起","没关系的 蜗牛先森","我又没有急事","咱们慢慢走吧","蜗牛先森开始和我聊天","从他的爷爷的爷爷的爷爷的爷爷","一直讲到他的五个弟弟和六个妹妹","太阳从桥的右边","走到桥的左边","没关系的 蜗牛先森","我又没有急事","——要不然","我们做个朋友吧"],"d":"output-蜗","img":["image.jpg"],"aud":["audio.mp3"]},{"i":"026","c":"蜜","t":["森林午后的宁静被小熊的叫声打破吵醒了睡在树上的孩子——唉，贪吃熊又闯祸了远远看见狂奔的小熊还有后面狂追的蜂兵追过三个山坡绕过十棵大树小熊跑过河蜂兵终于不再追小熊得意地舔着手——嗯，好香小熊忽然又惨叫——啊呀，好疼孩子没法再装睡苦笑着滑下树小熊伸出扎了刺的手好吧好吧让我帮你拔出刺你可不许再调皮——可是，唉你怎么还在吃手啊？"],"d":"output-蜜","img":["image.jpg"],"aud":["audio.mp3"]},{"i":"027","c":"星","t":["星星长着透明的羽毛","飞翔在宇宙里","看起来不动","是因为离我们好远","没有月亮的夜晚","一颗被惩罚的星星","没有了翅膀","跌落在森林里","你把星星带到河边去洗澡","用桂树的枝叶编织翅膀","你跳到老树头顶的叶片上","把星星举向夜空","天上的父莞尔一笑","悄悄撤去惩罚的咒语","星星扇动看得见的和看不见的翅膀","回到兄弟中间","从此天上多了一颗","带着桂叶翅膀的星星","你总是很得意地炫耀","——那是我的朋友","聪明的我","只好转过头偷偷地笑","再转过来一脸崇拜地","听你讲述细节……"],"d":"output-星","img":["image.jpg"],"aud":["audio.mp3"]},{"i":"028","c":"月","t":["太阳下山","你留下谜语在叶子上","躲在森林里的某个地方","月亮升起的时候","月光透过叶子的小洞","在地上显出字来——","左手就是右手","右手不是右手","月亮醒着的地方","月亮睡着的地方","你看见的不是你看见的","你看不见的是你看见的","摘了树枝在地上画来画去","爬上山坡又滑下山坡","左手和右手不停扭着","抬头盯着月亮","我的脖子好酸","走到桥上坐下休息","用树枝轻轻划开水面","看月光碎成一片一片","随着涟漪荡漾成夜曲","月亮回到天上","我欣喜地轻轻说出谜底","转头看向河的对岸","看见河边的树丛里","酣睡的你"],"d":"output-月","img":["image.jpg"],"aud":["audio.mp3"]},{"i":"029","c":"心","t":["很久很久以前的一天","有两颗心刻在树上","和树一起慢慢长高","两颗心不停地聊啊聊啊","很久以前的一天","其中的一颗心开始沉默","不是不想再说话","是因为你走了","昨天","那颗沉默多年的心开始歌唱","不是因为别的","是因为藏在树上晃动脚丫的你"],"d":"output-心","img":["image.jpg"],"aud":["audio.mp3"]},{"i":"030","c":"逢","t":["咒语念了九十九遍","老树的门开合了九十九次","幻界里的花开了九十九朵","我用九十九个符号标记走过的角落","再用九十九个符号标记线索的关系","再用九十九片叶子记录下每个念头","时漏颠倒了九十九次","太阳下山的时候","攥紧石子的手心开始出汗的时候","相逢的人","再相逢"],"d":"output-逢","img":["image.jpg"],"aud":["audio.mp3"]},{"i":"031","c":"网","t":["昨天夜里我们去长老那里","和所有的孩子一起狂欢","叶子做成的酒杯","盛满浆果酿成的甜酒","我和松鼠小鸟碰杯","我和小熊蜗牛碰杯","我和老树蘑菇碰杯","我和所有的孩子们碰杯","河对岸的白耳朵","会看病的小个子","收藏花瓣的绿卷发","不爱说话的大脚丫……","醒来时断掉的记忆","停在被你揪疼的耳垂上","身上绑满了树藤和叶子","动弹不得","我被困在你做的网里","看着叶子上的留言","愤愤地宣布禁足一百年的决定","——以及早餐放在右手边的提示","我苦笑着揉揉耳朵","幸福地眯着眼看着树顶的蓝天","其实不用这张网啊","谁愿意离开呢"],"d":"output-网","img":["image.jpg"],"aud":["audio.mp3"]},{"i":"032","c":"诗","t":["黎明的时候","躲在河边的树上","把珍藏好久的叶子","一片片地展平","怕忘记昨夜梦里的诗句","不停地小声念叨","用烧焦的树枝做笔","用文字急匆匆地铺满叶子","在你醒来之前","把这些叶子叠起来","用细藤穿成一本书","悄悄地放到你的枕边","爬回那张网把自己绑起来","假装一直在酣睡","睁开一道缝的眼睛","看见你开心的笑"],"d":"output-诗","img":["image.jpg"],"aud":["audio.mp3"]},{"i":"033","c":"琴","t":["你找过了九十九棵树","选中了九十九根树藤","找到弯的刚好的树枝","找到最细最结实的藤","从小马那里偷了七根尾巴","从小鸟那里偷了七个音符","你把马尾缠在树枝和藤上","你把音符逐个藏进马尾里","在月亮弯起来的时候","你独自坐在独木桥上","把音符从琴弦上唤醒","掉进宁静不动的河水","涟漪从脚趾上划过","桂叶悄悄坠落水面","音符们从水面飞起","舞动着穿过你发梢","睡着的森林在月色里","随着音乐轻轻摇摆……"],"d":"output-琴","img":["image.jpg"],"aud":["audio.mp3"]},{"i":"034","c":"棋","t":["小个子藏了一罐上好的蜂蜜","那是他给小熊看病的回报","我爬过山坡走过小桥","敲开树屋的门向他求些蜂蜜","小个子慢吞吞地带我到树下","走着比蜗牛还慢的小碎步","看到树下的石盘我立刻头大","好吧，好吧，这家伙的棋瘾又来了……","烽烟渐起边声连角","黑白兵士棋道纵横","运筹帷幄决胜围城","快些，快些，太阳要下山了呢","我突然抬头看着天空惊叹","小个子不为所动撇撇小嘴","——又来这一套","——别想再偷我棋子","我咬着手指眉头紧锁","灵光一现怪招出袖","黑子兵团绝地反攻士气大振","白子将士退入死角","小个子捶胸顿足高喊不服","忿忿钻入他的秘密树洞","无比心疼地盛出一杯蜂蜜","我飞奔回家不理他的约战","早上在日出前采集的露水","加一点点的蜂蜜","看着你喝下去时美美的笑","空气在月色里变得好甜"],"d":"output-棋","img":["image.jpg"],"aud":["audio.mp3"]},{"i":"035","c":"波","t":["森林里宁静的夜晚","萤火虫陪着我们","看写在叶子上的书","看长老写的关于森林的故事","小鸟急匆匆地飞过来","叽叽喳喳地说着大事不好","扔下叶子书跟着小鸟飞奔","从独木桥上跳进水里","不停扑腾呛水的小猴","还在河里捞啊捞着什么","只好一把拎起他的尾巴","倒提着让他吐出灌圆了肚子的水","躲在我怀里的小猴不肯上岸","抬头指着夜空里坏笑的月亮","低头看着水面层层叠叠的波纹","小猴挠着脑袋一脸困惑","小鸟笑得歪倒在桥上","小猴脸红起来觉得自己有点傻","我说，小鸟小鸟不许笑","这是月亮和小河的恶作剧","月亮有个双胞胎妹妹","今晚休息来河边洗澡","小猴要捞走她回家做夜灯","急坏了天上值班的哥哥","小猴抱住月亮妹妹的时候","月亮哥哥和小河一起念动咒语","把月亮妹妹藏进了水波里","你看——","那变碎了的月光","正在波心荡漾"],"d":"output-波","img":["image.jpg"],"aud":["audio.mp3"]},{"i":"036","c":"暖","t":["老树茂密的叶子层层叠叠","太阳努力寻找缝隙","把他的光漏到树脚下的草地上","慢慢沸腾起种子的情绪","我从清晨开始攀登老树","路过松鼠的家","路过啄木鸟的窝","在正午时分爬到树顶","种子们打着小伞努力飞过树顶","我吹起被枝叶牵绊住的种子"," const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const idx = id => D.findIndex(x => x.i === id);
const go = id => { location.hash = '#p' + id; };
function pad(n){ return String(n).padStart(3,'0'); }
function applyFilter(kw){
  kw = (kw||'').trim();
  let shown = 0;
  document.querySelectorAll('[data-char]').forEach(el => {
    const hit = !kw || el.dataset.char.includes(kw) || (el.dataset.kw||'').includes(kw);
    el.style.display = hit ? '' : 'none';
    if (hit) shown++;
  });
  const em = $('#empty'); if (em) em.style.display = shown ? 'none' : 'block';
}
function route(){
  const m = location.hash.match(/^#p(\d+)/);
  if (m && idx(m[1]) >= 0) { showDetail(m[1]); }
  else { showList(); }
}
window.addEventListener('hashchange', route);
window.addEventListener('DOMContentLoaded', () => { renderGrid(); route(); });
document.addEventListener('keydown', e => {
  if (!document.body.classList.contains('in-detail')) return;
  const cur = (location.hash.match(/^#p(\d+)/) || [])[1];
  if (!cur) return;
  const k = idx(cur);
  if (e.key === 'ArrowLeft' && k > 0) go(D[k-1].i);
  if (e.key === 'ArrowRight' && k < D.length-1) go(D[k+1].i);
});

function renderGrid(){
  const g = $('#grid');
  g.innerHTML = D.map(x => `
    <a class="tcard" href="#p${x.i}" data-char="${esc(x.c)}">
      <div class="tcard-fig">
        <img loading="lazy" src="${esc(x.d)}/${esc(x.img[0])}" alt="${esc(x.c)}·插图">
        <span class="tcard-no">${x.i}</span>
        <span class="tcard-ply">▶</span>
      </div>
      <div class="tcard-bd">
        <div class="tcard-ch">${esc(x.c)}</div>
        <div class="tcard-tx">
          <span class="tcard-tt">第 ${x.i} 首</span>
          <span class="tcard-st">诗 · 画 · 声</span>
        </div>
      </div>
    </a>`).join('');
  $('#q').addEventListener('input', e => applyFilter(e.target.value));
}
function showList(){
  document.body.classList.remove('in-detail');
  $('#detail').innerHTML = '';
  window.scrollTo({top:0, behavior:'instant'});
  document.title = '童话森林 · 森林的孩子';
}
function showDetail(id){
  const k = idx(id), x = D[k];
  const lines = x.t.map(l => esc(l)).join('<br>');
  const auds = x.aud.map((a, n) => `<audio controls preload="none" src="${esc(x.d)}/${esc(a)}"></audio>`).join('');
  const imgs = x.img.slice(1).map(i => `<img class="d-img2" loading="lazy" src="${esc(x.d)}/${esc(i)}" alt="${esc(x.c)}·插图">`).join('');
  document.body.classList.add('in-detail');
  $('#detail').innerHTML = `
  <div class="d-wrap">
    <a class="d-back" href="#" onclick="history.pushState('','',location.pathname);showList();return false;">← 返回童话森林</a>
    <div class="d-grid">
      <div class="d-fig">
        <img class="d-img" src="${esc(x.d)}/${esc(x.img[0])}" alt="${esc(x.c)}·插图">
        ${imgs}
        <div class="d-audio">
          <div class="d-audio-l">诗 · 声音</div>
          ${auds}
        </div>
      </div>
      <div class="d-main">
        <div class="d-char">${esc(x.c)}</div>
        <div class="d-sub">第 ${x.i} 首 · 森林的孩子</div>
        <div class="d-poem">${lines}</div>

        <div class="d-cross"><a href="shuowen.html#p${x.i}">读这一字的一字一解 →</a></div>
