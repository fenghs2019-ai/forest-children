<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>一字一解 · 说文森林 | 森林的孩子</title>
<link rel="stylesheet" href="forest.css">
<style>
#detail{display:none}
body.in-detail #listView{display:none}
body.in-detail #detail{display:block}
body.in-detail .phead,body.in-detail .tbar{display:none}
.dwrap{max-width:760px;margin:0 auto;padding:0 40px 100px}
.back{display:inline-flex;align-items:center;gap:6px;margin:26px 0 0;font-size:12.5px;color:var(--ink3);text-decoration:none;font-family:var(--sans);letter-spacing:1px;transition:color .2s}
.back:hover{color:var(--forest)}
.dhead{text-align:center;padding:8px 0 34px;border-bottom:1px solid var(--p3);margin-bottom:44px}
.dhead-no{font-size:11px;letter-spacing:4px;color:var(--gold);font-family:Georgia,serif;margin-bottom:10px}
.dhead-ch{font-family:var(--kai);font-size:clamp(84px,13vw,132px);line-height:1.05;color:var(--forest);letter-spacing:4px}
.dhead-date{font-size:11.5px;color:var(--ink3);letter-spacing:1px;font-family:var(--sans);margin-top:14px}
.prose{font-family:var(--song);font-size:16.5px;line-height:2.15;color:var(--ink);letter-spacing:.3px}
.prose p{text-indent:2em;margin-bottom:22px;text-align:justify}
.prose p.lead{text-indent:0;background:var(--p2);border-left:3px solid var(--gold);border-radius:0 12px 12px 0;padding:22px 26px;color:var(--ink2);font-size:15.5px;line-height:2.05;margin-bottom:32px}
.prose p.last{color:var(--forest)}
.dfoot{margin-top:56px;padding-top:30px;border-top:1px solid var(--p3);display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
.dfoot a{font-size:13px;color:var(--ink2);text-decoration:none;font-family:var(--sans);padding:9px 16px;border:1px solid var(--p3);border-radius:10px;transition:all .2s;background:#fff}
.dfoot a:hover{border-color:var(--forest);color:var(--forest)}
.dfoot .mid{color:var(--gold);border-color:transparent;background:transparent}
.dfoot .mid:hover{background:var(--p2);color:var(--gold)}
.dfoot .ghost{opacity:.3;pointer-events:none}
@media(max-width:600px){
  .dwrap{padding:0 22px 76px}
  .prose{font-size:16px;line-height:2.05}
  .prose p.lead{padding:18px 20px;font-size:15px}
  .nav{padding:0 12px}
  .nav-links{gap:0}
  .nav-link{padding:6px 7px;font-size:11.5px}
  .nav-logo-en{display:none}
  .nav-cta{display:none}
  .dfoot{justify-content:center}
}


.scard{background:#fff;border:1px solid var(--p3);border-radius:16px;padding:24px 20px 20px;text-decoration:none;color:inherit;display:block;position:relative;transition:transform .28s,box-shadow .28s,border-color .28s;overflow:hidden}
.scard:hover{transform:translateY(-4px);box-shadow:var(--sh2);border-color:var(--f3)}
.scard-no{position:absolute;top:12px;right:14px;font-size:10px;letter-spacing:1px;color:var(--ink3);font-family:Georgia,serif}
.scard-ch{font-family:var(--kai);font-size:56px;line-height:1;color:var(--forest);text-align:center;margin:6px 0 16px;transition:color .28s}
.scard:hover .scard-ch{color:var(--gold)}
.scard-sum{font-family:var(--song);font-size:12.5px;line-height:1.95;color:var(--ink3);text-align:center;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:48px}
.scard::after{content:'';position:absolute;left:0;bottom:0;width:100%;height:2px;background:linear-gradient(90deg,var(--f3),var(--gold));transform:scaleX(0);transform-origin:center;transition:transform .3s}
.scard:hover::after{transform:scaleX(1)}
@media(max-width:600px){
  .grid.three{grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:11px}
  .scard{padding:15px 6px 12px;border-radius:13px}
  .scard-ch{font-size:36px;margin:2px 0 8px}
  .scard-sum{display:none}
  .scard-no{top:8px;right:9px;font-size:9px}
}
</style>
</head>
