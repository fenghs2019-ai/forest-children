<script>
const D = [{"n":1,"c":"羽","d":"2014.9.25 — 2021.11.15","lead":"《説文解字》曰：羽，鳥長毛也，象形，凡羽之屬皆从羽。白话意为：羽，鸟的长毛，象形字，所有“羽”属、与羽相关的字，都采用“羽”作边旁。造字本义，名词，指鸟的翎毛，为覆盖体表的器官，轻韧防水，有护身保温作用。“羽”字，字形上由两个“习”字组成，不妨再进一步看看。《説文解字》曰：習（今天用的“习”是“習”的简体字），數飛也，从羽，从白，凡習之屬皆从習。白话意为：习，幼鸟一次次尝试起飞。字形采用羽、白会义，所有与习相关的字，都采用“習”作边旁。如今，刚参加工作的人常自谦为“职场小白”，口头语便是“要向各位前辈学习”，恰好暗合此意。在小孩子篇的童话诗《羽》里，调皮的孩子做了翅膀，一次次尝试起飞，也刚好是“习”之本意。","body":["羽，由两个“习”组成，猜测一下，先人给我们的暗示是：思想得以飞翔，靠强壮的翅膀；思想翅膀上的羽毛，来自两方面的“习”，一是学、理解、消化，对前人思想成果的“学习”，将学习结果应用于实践的“练习”；二是思、重构、创新，对前人思考过程的“研习”，将思考方法应用于再创造的“实习”。只有掌握了这两个环节，才能最终实现认识世界、认知世界、改造世界、创造世界。聪明的，让我们一起修炼这思想之羽吧。"],"sum":"《説文解字》曰：羽，鳥長毛也，象形，凡羽之屬皆从羽。白话意为：羽，鸟"},{"n":2,"c":"桥","d":"2014.9.26 — 2021.11.16","lead":"《説文解字》曰：橋，水梁也，从木，喬聲。白话意为：桥，跨河的大梁，字形采用“木”作边旁，“乔”既是声旁也是形旁，“乔”的本意为“高”。“桥”字的造字本义，名词，指用原木高架在沟壑或溪流上的通道。","body":["游者在森林中蜿蜒前行，踏出一条路，行至河边中断了，如何渡河会有很多可能的办法。桥，是数学知识“两点之间直线距离最短”的现实转化，至于怎么造桥，还要综合材料学、物理学、工程学等诸多方面的知识。河水阻路，产生冲突，催生渡河需求，对需求做出分析研判，在知识池塘里选取对应知识点，选择各种组合方案不断尝试，直至最终通过，这是解决与环境冲突的过程。新技术时代，上述过程的底层规律仍然存在。人类文明的每一次突破，都是“选择”的结果。","桥，是连接通道的通道，提供双向连接的可能，桥本身并不代表、也不会给出绝对的方向。所以，走到桥中央的孩子，必须要做出方向的选择。成长的角度看“选择”，悲观看，是无奈的放弃，是被动和消极的；但乐观看，则是圆满的实现，是主动和积极的。成长的路上会面临无数次的方向选择，决定了我们最终成为什么样的人。选择，其实一直是在同时决定，要什么和放弃什么。聪明的，愿你一直知道自己真正想要的是什么，不忘初心，无悔每一次的选择。"],"sum":"《説文解字》曰：橋，水梁也，从木，喬聲。白话意为：桥，跨河的大梁，字"},{"n":3,"c":"秋","d":"2014.9.27 — 2021.11.17","lead":"《説文解字》曰：秋，禾穀（谷）孰（熟）也，从禾，省聲，，籒文（即，籀文，古汉字的一种书体）不省。白话意为：秋，百谷成熟，字形采用“禾”作边旁，用省略了“龟”的作声旁，，籀文则不省略“龟”。造字本义：名词，天气转凉、蟋蟀鸣叫的季节。","body":["汉字在传承过程中，受限于早期“信息存储、传播与共识”的技术系统的不足，受限于“感知认知世界的经验沉淀、标识、调用、复用与反哺优化”的知识系统的粗略、错漏与偏差，在造字者与传字者、用字者之间，在信息传播链条上的各个节点之间，产生主观性交流障碍且被不断放大，导致部分汉字的字形字义发生变化。“秋”字的字形里已看不到蟋蟀的样子，蟋蟀的象形符号已演变成“禾”。秋字最早的含义，是指气温入秋转凉时、藏身于灶台缝隙的蟋蟀，以此指向秋天。今天再看“秋”字，难免以为是“禾苗如火（色）”之意，倒也与真意相符、易懂。","先哲提出天人合一，讲究顺其自然，将其落在四季的养生之道上，春生，夏长，秋收，冬藏。所以，到什么阶段就做好什么阶段的事，顺势而为，总能有所收获。聪明的，愿你终能等到属于自己的美好，即使要从春天等到秋天，相信，美好的总会到来。"],"sum":"《説文解字》曰：秋，禾穀（谷）孰（熟）也，从禾，省聲，，籒文（即，籀"},{"n":4,"c":"念","d":"2014.9.28 — 2021.11.18","lead":"《説文解字》曰：念，常思也，从心，今聲。 白话意为：念，经常惦记，字形采用“心”作边旁，采用“今”作声旁。造字本义：动词，因惦记怀想而自言自语。实际上，今，既是声旁也是形旁，是“吟”的本字（唸，是念的异体字），表示低吟。从字形上看，“念”这个字，是一个人低下头，以口对心，自言自语。","body":["尚书云：念兹在兹、无日或忘，思绪即起，便执着于心，没有一日能忘，你可知我在怎样地念着你；李叔同说：念念不忘、必有回响，世界如谷，心声传千里，相思印映汝心，我在对着心说话，在用我的心和你对话，你的心可会听见？中华文化的内敛含蓄之美，就在这样简洁纯粹的文字之中。","我一直念念的，是未来，你知道，我想的，不只是出版的未来；你知道，我在想的，还是出版的未来。聪明的，可愿和我一起念着，一起去寻找未来。"],"sum":"《説文解字》曰：念，常思也，从心，今聲。白话意为：念，经常惦记，字形"},{"n":5,"c":"鱼","d":"2014.9.29 — 2021.11.19","lead":"《説文解字》曰：魚，水蟲也，象形，魚尾與燕尾相似，凡魚之屬皆从魚。白话意为：鱼，水中生物，象形，鱼尾与燕尾相似，所有与鱼相关的字，都采用“鱼”作边旁。造字本义：名词，有鳍、鳃和流线体型的冷血水生脊椎动物。“鱼”这个字，从甲骨文至今，都是妥妥的象形字的典型。","body":["关于鱼的故事有很多。在飞鸟和鱼的故事里，不会游泳的鸟和不会飞的鱼，分属不同的世界，鸟不能在水里生活，鱼不能离开水生活。又该如何彼此相爱而不相互伤害？爱是如此复杂和艰难。故事里的孩子想把鱼儿带走，最终放弃了，只能留下脸上的水滴和泪珠。而在现实中，又有多少伤害是以爱之名造成的呢？也许，我们一直是走在寻爱路上的孩子。聪明的，祝你早日找到通往真爱的小路。"],"sum":"《説文解字》曰：魚，水蟲也，象形，魚尾與燕尾相似，凡魚之屬皆从魚。白"},{"n":6,"c":"悠","d":"2014.9.30 — 2021.11.20","lead":"《説文解字》曰：悠，憂也，从心，攸聲。白话意为：悠，担忧、小心，字形采用“心”作边旁，采用“攸”作声旁。造字本义：动词，老人拄杖小心缓行。“攸”的字形，是一个弯着腰的人（老人）扶着拐杖，一副小心翼翼的样子。","body":["近日连续作战，赶写几个工作报告，你知道，需要带着思考的那种报告，是无法在白天乱糟糟的办公室里写的，所以，还是要带回家来夜战。辛苦是自然的。可是，其实并没有做的很紧张很烦躁，感觉还是在悠悠地把那些思想的火花慢慢凝练成慢条斯理的文字。也还坚持了每天晚上在小区里遛儿子，也还坚持了每天早上送宝妈上班、和小区门卫乐呵呵地互道早安，也还坚持了每天中午和办公室的同事们一起扯扯闲篇，也还坚持了每天在几个不同的群里和大家插科打诨。生活不易，但是我们依然可以选择以怎样的心情和怎样的姿势去面对。也许我现在趴在被窝里的姿势不太好看，但是心情很好。","嗯哼，聪明的，你选择了怎样的姿势？让我看看？你选择了怎样的心情？说来听听……"],"sum":"《説文解字》曰：悠，憂也，从心，攸聲。白话意为：悠，担忧、小心，字形"},{"n":7,"c":"路","d":"2014.10.8 — 2021.11.22","lead":"《説文解字》曰：路，道也，从足，从各。白话意为：路，大道，字形采用“足”作边旁，采用“各”作声旁。造字本义：动词，大军出征或归邑。","body":["聪明的，你可还记得我们是从哪里出发，你可还记得我们走过了怎样的千山万水？聪明的，一定要记得哦。唯有如此，当有一天，我们在行走的路上看不清远方、找不到方向，只好停下脚步的时候，我们还能回望出发的原点、回首来路，才好想起初心是什么。就像我们要不断回忆，出版是从何而来，出版的前生今世，才能找到出版的真相和本相，才能去创造更好的未来出版。","聪明的，愿你一直不忘来路，一直可以寻到前路。"],"sum":"《説文解字》曰：路，道也，从足，从各。白话意为：路，大道，字形采用“"},{"n":8,"c":"守","d":"2014.10.9 — 2021.11.23","lead":"《説文解字》曰：守，守官也，从宀，寺府之事者，从寸，法度也。白话意为：守，官吏的操行、节操，字形采用“宀、寸”会义，宀，表示官府的事，寸，表示法度。造字本义：动词，持械护卫家园，御寇入侵。《说文解字》对“守”的解读过窄了，“宀”的字源在甲骨文里的含义是泛指的房屋。今天，对“守”字的使用反而更回归本源，并不局限于指向官员的操守。","body":["很多人都会有想要用力去呵护守护的。比如，小王子想要守护的，是他的那朵玫瑰花。很多时候，我们想要守护的，其实是自己；或者更准确地说，我们想要守护的，其实是自己的一个希望。我们从这样看似“自私”的源头出发，渐渐忘掉自己、忘掉自私的念头，从爱自己出发，慢慢学会如何去爱他人、爱这个世界，学会小王子那样简单而单纯的爱，终于，他人和世界也开始爱我们。所以，拥有一个想要守护的对象，本身就是一种圆满。","聪明的，愿你，终能找到值得守护的。"],"sum":"《説文解字》曰：守，守官也，从宀，寺府之事者，从寸，法度也。白话意为"},{"n":9,"c":"寻","d":"2014.10.10 — 2021.11.24","lead":"《説文解字》曰：尋，繹理也，从工，从口，从又，从寸，工口亂也，又寸分理之彡聲，度人之兩臂為尋八尺也。白话意为：寻，抽出乱丝加以整理，字形采用“工、口、又、寸”会义，工、口的边旁，表示丝绪紊乱，又、寸的边旁，表示分别整理，“彡”是声旁，“寻”也作度量单位，两臂张开的总长度为一“寻”，八尺左右。造字本义：动词，张开两臂测量物品长度。","body":["也许，我们一直在寻找的，是关于世界、关于我们自己的真相，而我们所处的世界一直隐藏着他的真相，当然也隐藏着关于我们的真相；八尺一段寻、倍寻是为常、一路寻常量、何时抵穷疆，我们终此一生不断行走，人类从蛮荒走进网络，个体的人和群体的社会，都在不停地探知未知，都在坚持走着自以为是的一条直线，却像极了爱因斯坦说的那只在球面上爬行的甲虫，而藏在某个地方偷笑的真相，会看着我们不断走入一个新的循环。终点即是起点，起点即是终点。但是，如果我们学会思考，学会记录这个世界，在一圈一圈弯曲地爬过世界时得以不断认知他，终有一天当我们爬遍每个角落时，我们会揭开这个世界的全貌。","所以，聪明的，也许，最聪明的办法永远是最笨的方法。祝福所有聪明的笨人们，可以早日找到你想要的。"],"sum":"《説文解字》曰：尋，繹理也，从工，从口，从又，从寸，工口亂也，又寸分"},{"n":10,"c":"蒲","d":"2014.10.11 — 2021.11.25","lead":"《説文解字》曰：蒲，水艸也，可以作席，从艸，浦聲。白话意为：蒲，水草，可以用来编草席，字形采用“艸”作边旁，采用“浦”作声旁。造字本义：名词，生在浅滩或池沼的水草。在2014年的这篇文字里，其实说的是蒲公英。","body":["蒲公英（拉丁学名：Taraxacum mongolicum Hand.-Mazz.）菊科，蒲公英属多年生草本植物。别名黄花地丁、婆婆丁、华花郎等。","四月，谷雨前，天坛公园里有大片大片的蒲公英，众多的老人家去采。 好婆（小宝的外婆，苏南地区方音），用小宝妈妈的话说，这个江苏来的“专业农民”居然也凑热闹去挖。那场面简直了，好婆用迅雷不及掩耳之势，迅速挖回家一大桶。用她的话说就是别人才挖一棵她已挖了一堆，想了想，觉得应该留一些给别人、给公园 ，这才收手——我好担心好婆哪天一个不高兴，天坛公园里就再也看不到蒲公英了……。","好婆说，她这一辈儿的兄弟姐妹们散开的范围小，左右都还在长江边上，远的也就江的对岸——哦，最远的该是到另一个世界了……，所以嘛，最后大家还是应该都在一起的，好婆不避讳这些。可是，再下一代的孩子们就散的特别开，小宝妈妈到了北京算是还好，这是还在国内的，还有到了国外的呢……。小宝小的时候，好婆会带着小宝到公园里吹蒲公英，然后微笑着，看着小宝跟着蒲公英的孩子奔跑，一直跑向远方，再忽然调头跑回自己身边……","聪明的，我们都将成为散落在四方的孩子，愿你，一直记得，童年里的那片开满蒲公英的山坡、田野、草地；聪明的，愿你，一直记得，我们来自哪里；聪明的，愿你，一直有心里满满的幸福。"],"sum":"《説文解字》曰：蒲，水艸也，可以作席，从艸，浦聲。白话意为：蒲，水草"},{"n":11,"c":"怜","d":"2014.10.12 — 2021.11.28","lead":"怜，繁体为“憐”，简化作“怜”。《説文解字》曰：憐，哀也，从心，粦聲。白话意为：怜，哀悯，字形采用“心”作边旁，采用“粦”作声旁。粦，火光闪烁飘忽之意。造字本义：动词，心生隐隐爱惜之情。在《尔雅》中的释义更直接些：憐，爱也。","body":["我们常常会期待，有温暖的环绕，让我们得以心安。期待有另外一颗心，可以随时听见我们心底的呼唤，走到我们的心旁，坐下来，聊聊天，甚至可以不说一句话、不说一个字，只是安静地陪我们发呆，该有多好。","聪明的，愿你们都能找到可以陪伴一生的一颗心，或者，哪怕可以陪伴一会儿的，也好。"],"sum":"怜，繁体为“憐”，简化作“怜”。《説文解字》曰：憐，哀也，从心，粦聲"},{"n":12,"c":"匠","d":"2014.10.13 — 2021.11.29","lead":"《説文解字》曰：匠，木工也，从匚，从斤，斤，所以作器也。白话意为：匠，木工，字形采用“匚、斤”会义，斤，用来制作木器的斧具。造字本义：名词，筐里背着刀斧工具的木工。","body":["这些年，“匠人精神、工匠精神”的提法不绝于耳，反映的，是社会对热爱事物本身、精益求精、不问回报的一种质朴精神的向往。","隐隐深处，还有一些难以言表的更高期待。汉字的演变过程是复杂的，会从最初的含义引申开来。汉时孔鲋所著《小尔雅》中说：匠，治也。这里所说的，大概意思是指，能够让事物回归应有秩序的动作，这是一种能力。今天的人类社会需要有更多的“治”匠。","越来越浮躁的世界里，匠人似乎越来越少了。什么是匠人？是掌握了某种手艺后痴迷于这种手艺，把一件事做得带有神圣仪式感的人，他们甚至会有一些怪癖。比如，做文字编辑的人，就会有些编辑“洁癖”。我虽然不是出版社的编辑，但我也一直有这种编辑洁癖，看见一段话最后只甩出一个孤零零的字另外占一行时，看见一段话最后一句非要挤到下一页时，就会坐立不安抓耳挠腮，直到上天入地、不改原意地增减几字，消除那个碍眼的、孤独的一个字或孤独的一行字。","当然，还有在爱的花园里辛勤耕作的匠人，每天想着的，是如何呵护好那份爱意。","聪明的，你是哪种匠？你又是否找到了肯为你做个花匠的爱人。聪明的，祝你做个幸福的匠人。"],"sum":"《説文解字》曰：匠，木工也，从匚，从斤，斤，所以作器也。白话意为：匠"},{"n":13,"c":"荷","d":"2014.10.14 — 2021.11.30","lead":"“荷”与“莲”两字，同指一物，互为异称。《説文解字》曰：荷，芙蕖葉，从艸，何聲；蓮，芙蕖之實也。从艸，連聲。白话意为：荷，芙蕖叶，字形采用“艸（艹）”作边旁，采用“何”作声旁；莲，芙蕖的种子，字形采用“艸（艹）”作边旁，采用“连”作声旁。造字本义：名词，又作芙蕖、水芙蓉，水上部分的叶子与花称作“荷”；水下泥中的茎称作“藕”；子实称作“莲”。","body":["一花一世界，依佛经言，佛之居所即为莲界。想来，荷莲馨香之中可以领悟世界真谛吧。世间外物纷扰，可以乱视听、可以搅心绪，像是隐藏在流水下面的淤泥，像是跳脱在浮云之间的微风；为荷为莲，可以出淤泥而不染，可以迎风展而不伏，娉婷轻摇随风，却始终向天而立，不见忧喜，不露欢悲，自有其定力。你我皆凡人，身处俗尘，耳边听闻诱音，目前瞥见诱色，如遇淤泥微风，心头暗起杂念，再正常不过。若按佛家讲法，似皆可有解，不外，以金刚力化无穷慧，闭目凝神、正念正本心，而后张目远望，自然得以穿过现世迷雾，看清脚下来路去路，彼时拈花不语，淡然前行。然而，终是说易行难。修行修行，最终要修的不只是心之所思，更是身之所为。","聪明的，愿你，常闻芙蕖香，伴君同修行。"],"sum":"“荷”与“莲”两字，同指一物，互为异称。《説文解字》曰：荷，芙蕖葉，"},{"n":14,"c":"思","d":"2014.10.15 — 2021.12.1","lead":"《説文解字》曰：思，容也，从心，囟聲；凡思之屬皆从思。白话意为：思，把人事放在头脑、心坎，字形采用“心”作边旁，采用“囟”作声旁。所有与思相关的字，都采用“思”作边旁。造字本义：动词，用头脑考虑、用心灵感受。","body":["汉字简化是伟大的工程，为扫除文盲奠定了基础。但不得不承认，有些具体文字的简化，失去了象形会意的原味，难免遗憾。“思”这个字在简化以后，就会容易造成一定困惑，“田”字是指向什么的？其实应该是“囟”字，即，婴儿时期头顶骨未合缝的地方，用来指代头脑。古人认为，除了大脑，心作为血液循环系统的重要器官，也是感知器官，同样具有直觉思维能力。","人类是喜欢思考的芦苇。似乎很可悲？我们一思考点什么，也许，天上的父就会笑个不停吧。可是，谁又能让我们停止思考？！世界对我们是隐藏的，我们也许是被另一个世界里的高级智慧所把玩在手的一个世界。好吧，且用我们的深思，参破这世界的秘密。","聪明的，愿你一直走在思考的路上。"],"sum":"《説文解字》曰：思，容也，从心，囟聲；凡思之屬皆从思。白话意为：思，"},{"n":15,"c":"梦","d":"2014.10.16 — 2021.12.2","lead":"《説文解字》曰：夢，不明也，从夕，瞢省聲。白话意为：梦，不明不白的意识，字形采用“夕”作边旁，用省略了“日”的“瞢”作声旁。造字本义：动词，入眠后眼皮跳动。","body":["最早的甲骨文里，梦字由三部分结构组成，相应的符号指向，包括了一张床、一个躺着的人、以及他的眼睛。象形会意，一个人躺下后闭上眼睛。眼皮的跳动，是人在潜意识里对日常生活刺激的回应。","简化了的“梦”字可拆解为：林、夕。这便是香港词人林夕的艺名由来吧，更多人已经记不得他的原名——梁伟文。而我对“林、夕”这个拆解，更愿意解读为：森林的夜晚。这才会有美丽的老树、叶子的歌唱和树上那个精灵一样的孩子的笛声。我们在梦里游走四方，我们在梦里肆意歌唱。我们在清晨被温柔地唤醒，不得不抛弃梦里的世界和梦里的那些人，总会略带伤感和惆怅。梦是假的？梦是真的；梦是真的？梦是假的……。不管怎样，我一直相信，还是要有些梦，才能让醒着的世界也那么美好。梦，是我们在不断锻炼的想象力，而世界是由想象力推动的。","聪明的，愿你好梦成真。"],"sum":"《説文解字》曰：夢，不明也，从夕，瞢省聲。白话意为：梦，不明不白的意"},{"n":16,"c":"树","d":"2014.10.18 — 2021.12.3","lead":"《説文解字》曰：樹，生植之緫名，从木，尌聲。白话意为：树，播种、培育、种植等农事的总称。字形采用“木”作边旁，采用“尌”作声旁。造字本义：动词，盆栽木本或草本植物的小苗。","body":["树，从字形上看，是一只手（寸）将一棵树苗（木）栽进一个容器或器皿（由“豆”字简化成“又”）里。","每个人都是一棵树，在岁月里写满故事；一群树变成森林，一群人的故事就变成一个民族的历史。每一棵树的故事藏在年轮里，每个人的故事藏心底的纹路里；每片森林的故事散落在每棵树里，每个民族的历史碎片在每个人的故事里。人类的历史充满了故事。但也许，最真实的不是历史书里的故事，而是每个人记忆里的故事。","聪明的，我每天把森林的故事讲给你听，那么，你的故事呢？"],"sum":"《説文解字》曰：樹，生植之緫名，从木，尌聲。白话意为：树，播种、培育"},{"n":17,"c":"萤","d":"2014.10.19 — 2021.12.4","lead":"萤，在《说文解字》中未见。萤是简化字，简化后的“艹”，原本是宝盖上面两个“火”字，是“荧”字的指代，作声旁，也作形旁；虫字，是形旁。造字本义，一种尾部在夜间发出绿色荧光的小型甲虫。简化后的“萤”，只看得出是草里的虫，能够发光的特征不见了。","body":["萤火虫在夜里飞，点点微光，照亮的不只是回家的路，还有可以让你的心回到这片安静的夜森林的路。前行的路上，我们总会有犹疑的时刻，会有疲惫的瞬间，会有想要就此放弃的念头。伴随我们最终走出这样困境的，更多的时候不是灿烂的阳光，而是那萤火虫般的一点微光。","聪明的，愿我们做彼此的萤火虫，为彼此照亮去路。"],"sum":"萤，在《说文解字》中未见。萤是简化字，简化后的“艹”，原本是宝盖上面"},{"n":18,"c":"昙","d":"2014.10.21 — 2021.12.6","lead":"《説文解字》曰：曇，雲布也，从日、雲，會意。","body":["白话意为：昙，雲层散布。字形采用“日、云”会义。造字本义：作名词，阳光照射下蒸腾的云雾；作形容词，易消散的，短暂的，不能持久的。","昙，云上有太阳，所有热情的光亮都在厚厚的云层上；我在云下，在或浓或淡的雾里，仰望天空，惆怅不已。","这世间，总有美丽的巧合每天都在发生。昨晚（","2014.10.20）在读书群里讨论起红楼梦的十二钗，从十二这个数字说到换个时间的角度看十二钗，又自然说到昙花一现的美丽，说到黛玉。今早送给你，恰好是“昙”字。昙花的爱是浓烈的，在午夜绽放的片刻，香溢满庭，刹那穿过千年，大抵上次轮回里，便也是这般美丽；昙花的爱又是脆弱的，不及日出便悄然散去，空气里丝丝柔柔的味道隐约着，近在咫尺却难以把握，像上一次、再上一次、再再上一次，你匆匆的告别。","聪明的，愿你种下的昙花，可以夜夜盛开，你可以不离去，你可以不放弃。"],"sum":"《説文解字》曰：曇，雲布也，从日、雲，會意。"},{"n":19,"c":"风","d":"2014.10.22 — 2021.12.7","lead":"風，凡字旁里面，是虫字上面加一撇，在篆书里则是云字下面有三撇，指代的，就是风这个字的核心所指：气流。《説文解字》曰：風，八風也。東方曰明庶風，東南曰清明風，南方曰景風，西南曰涼風，西方曰閶闔風，西北曰不周風，北方曰廣莫風，東北曰融風。風動蟲生。故蟲八日而化。从虫，凡聲。凡風之屬皆从風。白话意为：风，八方的风。東方的风叫“明庶风”，东南的风叫“清明风”，南方的风叫“景风”，西南的风叫“涼风”，西方的叫“闾阖风”，西北的风叫“周风”，北方的叫“广漠风”，东北的叫“融风”。风动虫生。所以说虫生八日而化。字形采用“虫”作边旁，采用“凡”作声旁。所有与风相关的字，都采用“风”作边旁。造字本义：名词，使鸟类得以飞翔的气流。","body":["风过庭前，花开花落一夜残；风起江河，百尺白浪拍礁岩；风入君心，万千岁月住桑田……。我们看得到的，是风的自由，羡慕他率性游走；我们看不到的，是他的不自由。我们看到他停不下的脚步，我们不知道，他在一路飞奔的路上错过多少想要留下的机会。如果有一天，风想到这样一个办法：用他的手卷着你的腰，把你带向天空，对你说出爱字……。这几天出门风好大，我好担心你会被他带走。如果，如果真是这样，聪明的，你会对风说，其实你也在爱着他吗？"],"sum":"風，凡字旁里面，是虫字上面加一撇，在篆书里则是云字下面有三撇，指代的"},{"n":20,"c":"舞","d":"2014.10.23 — 2021.12.8","lead":"《説文解字》曰：舞，樂也，用足相背，从舛，無聲，古文舞从羽亡。白话意为：舞，快乐地活动手足，“舛”用两足相背的形象，表示众人一起踢踏跳跃。字形采用“舛”作边旁，采用“無”作声旁。古文写法的“舞”字，字形采用“羽、亡”会义，表示头戴羽饰，祭祀舞蹈，悼念亡灵。造字本义：动词，在祭祀仪式上手挥花枝又唱又跳。","body":["说起舞蹈，应该是人类创造的最早的艺术门类之一吧，狩猎归来、酒足饭饱，引声长啸、敲打石块，手执牛尾、两足相背，肆意摇摆、四肢伸展，与音相协、遂成舞也，逐渐进入祭祀，用来与各种天神交流。小时候回乡下过年，看村里人热热闹闹地扭秧歌，再开学碰巧在音乐课欣赏芭蕾舞，二者看起来似乎反差极大却都很喜欢，并不觉所谓下里巴和阳春白雪，在孩童眼里，这都是好玩儿的身体欢跃吧。再后来，年岁渐长，看到林肯光着脚在白宫前的草坪上跳动出人类的生命，看到杨丽萍在光影里跳出自然的生命，会有更多的别样感动。","聪明的，每个生命都值得赞美，每一天有可以找到起舞的理由。聪明的，愿你找到属于你的舞姿，在每个美丽的夜晚，起舞。"],"sum":"《説文解字》曰：舞，樂也，用足相背，从舛，無聲，古文舞从羽亡。白话意"},{"n":21,"c":"叶","d":"2014.10.24 — 2021.12.9","lead":"“叶”字的本源其实与植物无关，字形是“曰”与“十”的组合，意思是“众口一词”，后来造字有了“协、谐”，意思相近，“叶”字的字形逐渐不再常用。在《汉字简化方案》中，将“叶”与“葉”合并简化，读音也变为ye，“葉”字不再使用。《説文解字》曰：葉，艸木之葉也；从艸，枼聲。白话意为：葉，草木的叶子；字形采用“艸”作边旁，采用“枼”作声旁。造字本义：名词，草木薄片状的营养和光合作用器官。","body":["以“葉”的字形看，寓意更深长：草木之间，藏有世界。叶子，是古人经常观察的对象，叶落归根，观一叶而知秋，观一叶知天下。千古以来，叶落叶长，循环往复，生生不息。地球的颜色基调是蓝色与绿色，蓝色的是海洋和天空，绿色的是草原和森林。海洋和天空的蓝，来自每一滴海中水、每一滴云中水，是水珠对蓝色光线的折射；草原和森林的绿，来自每一片草叶、每一片树叶，是叶绿素不断吸收阳光时放过了绿色光线，到了叶绿素不那么充盈的时节，叶黄素、胡萝卜素就会让叶子变黄变红。","日照渐长，街道两旁的绿色渐深，层层叠叠的叶子在阳光下闪亮，转眼夏浓。傍晚，信手摘下一片叶子，也许就是千年之前，曾被另外一只手摘下的，辗转红尘、历经沧桑、落土化泥、入根逆流、重归枝头而后相遇千百年后的你——殊不知，你也是从彼岸而来，手上纹路与千年之前的你并无二致。也许，这才是世界的真相，也许，所有关于这个世界的密码早就写进了叶子的脉络。","聪明的，去摘一片叶子，看看是不是曾在前世被你信手涂鸦的那一片？"],"sum":"“叶”字的本源其实与植物无关，字形是“曰”与“十”的组合，意思是“众"},{"n":22,"c":"洞","d":"2014.10.25 — 2021.12.10","lead":"《説文解字》曰：洞，疾流也；从水，同聲。白话意为：洞，迅疾的流水；字形采用“水”作边旁，采用“同”作声旁。造字本义：名词，有水流、会发出回音的巨大岩穴。","body":["我们终此一生寻找的，也许不过是一双带着爱意的耳朵，可以倾听我们絮絮叨叨地诉说小欣喜、小烦恼、小心事、小梦想。我们要找的那颗心，是可以彼此倾倒那些外人听不懂的言语的树洞。所以，坚持吧，继续走在寻找树洞的路上。聪明的，愿你可以早点找到这样的树洞，愿你早点找到，愿意为他/她做个树洞的爱人。","从今天开始，画风会相对更加固定，人物慢慢集中在几个形象上，更多的成熟文字会在引子的诗歌里，正文里尽量是给孩子们。关于字的解读，会和我正在尝试的出版数字化有关——当然，有时候会比较隐晦，你要猜猜看咯。——比如，在今天的正文的诗歌里，你可以看到，在寻找那些美好的路上，我们要有一些科学的技巧与方法，比如做好标准化的沿途路线标引，做好风景影像的资源库并且做好管理，做好数据分析的模型……；当然，还要有一个特别好的团队，可以相互配合分工负责。聪明的，你知道的，我说的不只是数字出版，我说的，还是数字出版……"],"sum":"《説文解字》曰：洞，疾流也；从水，同聲。白话意为：洞，迅疾的流水；字"},{"n":23,"c":"雨","d":"2014.10.26 — 2021.12.11","lead":"《説文解字》曰：雨，水从雲下也；一象天，冂象雲，水霝其閒也；凡雨之屬皆从雨。白话意为：雨，水从雲层降下地面；字形顶部的“一”，像天穹，“冂”像低垂的雲团，水零落其间；所有与雨相关的字，都采用“雨字头”。造字本义：动词，天空降水。","body":["我在艳阳高照的午后，如此自私地盼望，可以来一场雨，洗净城市天空，洗掉心底疲惫，洗走人间烦尘。在繁忙的工作中间，在上一个段落结束、下一个段落即将开始的时候，像是在起伏的旋律中，前后两个小节之间的短暂过门，让我们偷偷换口气，和所爱在一起，听雨落庭前，渐起闲心，放下手机电脑，让书架上被冷落了许久的书籍重回眼前，让手指不再与键盘鼠标屏幕亲热，让手指可以重新回到纸墨文丛。我想你们，在书架上哀怨地默默陪着我工作的书们。","聪明的，再忙，也不要冷落爱人啊，你知道，我说的不只是书，我说的，还是书。"],"sum":"《説文解字》曰：雨，水从雲下也；一象天，冂象雲，水霝其閒也；凡雨之屬"},{"n":24,"c":"石","d":"2014.10.27 — 2021.12.13","lead":"《説文解字》曰：石，山石也，在厂之下；囗，象形；凡石之屬皆从石。白话意为：石，山上的石头，好像石头在山崖之下；囗，是石块的象形，所有与石相关的字，都采用“石”作边旁。造字本义：名词，坚硬的矿物质，山岩，岩块。","body":["石头的历史总是很长，所以石头隐藏的秘密也会很多。今天童话故事里的男孩找不到女孩，握着难以发挥功效的同色魔法石，该是怎样的惊慌失措，也许他就要绝望地放弃，选择故作坚强地离去——像是斯斯昨夜提及的那首歌，唱着怀念的歌谣，you are beautiful，然后转身走进人潮人海。但是，聪明的，别轻言放弃啊，你看，故事里的那个男孩，是在泪水滴落的瞬间，找回了美丽的结尾。聪明的，我想把每个故事的结局都讲成喜剧，来填满荒芜的星球。一些小理想和小心愿，是选择坚持还是放弃，决定了几年后我们是否还能再见。","聪明的，你知道，我说的是关于未来的出版，我说的又不只是关于出版的未来。","* 距离写下这些文字的那个早晨，已经过去了七年。离开出版行业和数字出版工作也已经三年多。但……其实，又并没离开过吧。"],"sum":"《説文解字》曰：石，山石也，在厂之下；囗，象形；凡石之屬皆从石。白话"},{"n":25,"c":"蜗","d":"2014.10.28 — 2021.12.14","lead":"《説文解字》曰：蝸，蝸蠃也；从虫，咼聲。白话意为：蝸，蝸蠃；字形采用“虫”作边旁，采用“咼”作声旁。造字本义：名词，头部有两对触角的软体动物，蜷栖锅状硬壳里，活动时背壳而行。","body":["蜗牛的世界里，时间的行走是缓慢的，风景的流动也是缓慢的。为了仔细观察风景的细微变化，蜗牛只好放慢脚步，不停变换触角的位置，小心翼翼地探索每个角落。你看不见那些风景，是因为你走的太快，很多风景在你眼里都只是一闪而过，匆匆行色，没了颜色，你误以为世界是纯粹的黑白两色——直到有一天你停了脚步，才发现世界的颜色是如此丰富。","聪明的，慢一点，再慢一点，不要让那些风景错过在你匆匆的身影里。"],"sum":"《説文解字》曰：蝸，蝸蠃也；从虫，咼聲。白话意为：蝸，蝸蠃；字形采用"},{"n":26,"c":"蜜","d":"2014.10.29 — 2021.12.23","lead":"《説文解字》曰：蜜，蠭甘飴也；一曰螟子；从䖵，鼏聲；蜜，从宓。白话意为：蜜，蜂虫酿造的甘甜糖浆；另一种说法是，蜜是螟虫的卵；古时篆字的“蜜”较为复杂，“鼏”在上、下面并列两个“虫”字，以“䖵”作边旁，“鼏”作声旁；今“蜜”，采用“宓（必）”既做声旁也做形旁，是“泌”的省略，表示分泌。造字本义：名词，采集花露、在蜂巢中酿泌糖浆的蜂虫；或指其酿造的糖浆。","body":["生活充满了各种变化，五味杂陈才是真谛。甜美的表面会有暗暗的风险，像玫瑰花瓣下面的刺，像“蜜”字下面躲着的那个尾巴上带刺的小虫子。所以，美好的事物总是不会被轻易得到。然而我们就是在这样的追求过程中，在被花刺蜂刺以及各种生活的刺伤到痛时，在唏嘘着伤口的同时，捧起那美好。","聪明的，你早知道这个道理的啊，然而你我都没有放弃，对吧？","* 注，每一篇说文解字的第一段，均来自象形字典网站。","https://www.vividict.com/Public/index/page/index/index.html"],"sum":"《説文解字》曰：蜜，蠭甘飴也；一曰螟子；从䖵，鼏聲；蜜，从宓。白话意"},{"n":27,"c":"星","d":"2014.10.30 — 2022.1.8","lead":"《説文解字》曰：曐，万物之精，上为列星；从晶，生聲；一曰象形，从口，古口復注中，故与日同；曐，古文星；星，曐或省。白话意为：星，是宇宙万物的精华，字形上部是星群呈列的样子；字形采用“晶”作边旁，采用“生”作声旁；有一种说法，“星”是象形字，采用“口”（圆圈）作“星”的形象；古文写法的“星”又在“口”（圆圈）中加一点指事符号，导致“星”的字形与“日”相混同；曐，是古文写法的“星”字；星，是“曐”的异体字，省略了两个“日”。造字本义：名词，从空寂的夜幕中凭空出现的众多发光天体。","body":["每颗星星都是一个世界。","在宇宙深处的某个地方，会有另外一个世界的生命如你我一般，在深夜仰望星空，用不同的语言定义我们也能看到的每颗星星。地球在他们的世界里会被叫做什么样的名字呢？已经被我们命名的他们的星球，在他们的语言里又该被怎样称呼？","人和人、人群和人群的交流，乃至智慧与智慧之间的交流，是思想和思想之间的交流，是语言和语言之间的转换，是表达和表达之间的互通，是理解和被理解之间的交互。","我们总会找到心意相通的办法来解决交流的障碍。所以我相信，每个世界都会有思想者、思想的表达者、对表达后形成的信息内容进行加工的生产者、信息内容的传播者，当然，还会有阅读者。","智慧之间，交流的稳定性，要靠各种复杂的工具、标准和规则。","要靠符号：音频（动态语音化语言及音乐）、文字（抽象静态可视化语言）、图片（具象静态可视化语言）、视频（具象化影像）等，封装起思想表达使其具备稳定性；要靠信号：光信号、声信号、电信号和网络信号等，基于确定的、标准化的符号传输规则，运送符号及其包含的信息内容（思想的表达）的载体；要靠介质：龟甲、岩壁、狼烟、竹简、绢帛、纸张、书籍、报刊、电报机、收音机、电视机、电脑、各种终端等，在有形或无形的信息内容传播链上的各个节点，接收、反馈和再转发信号。","看透这些，才会还原出版业的本相，才能理解出版业乃至更多内容行业的价值，就会知道如何继承出版业的历史财富，创造更美好的新出版。聪明的，你知道，我说的不只是未来的出版、未来的内容，我说的还是出版的未来、内容的未来。"],"sum":"《説文解字》曰：曐，万物之精，上为列星；从晶，生聲；一曰象形，从口，"},{"n":28,"c":"月","d":"2014.10.31","lead":"-","body":["2022.1.15","《説文解字》曰：月，闕也；太陰之精；象形；凡月之屬皆从月。白话意为：月，有如太空阙门，富于阴晴圆缺变化；月是宇宙间太阴的精魂；象形，如月缺之形；所有与月相关的字，都采用“月”作边旁。造字本义：名词，绕地球运转、反射日光而在地球的夜空发亮、周期性圆缺变化的星球，即地球的卫星。“月”字的字形并非完整的圆，是因为古人观月，残缺常见、圆满偶得。由此也悟出“人生不如意十之八九”，不如意，才是常态。","小时候不会感时伤秋，只是一直很好奇，满月时的那些山与海，在月亮变成一道月牙时，去了哪里？在月亮上住着的人，是要不停地搬家吗？他们会不会在月亮变小的那个夜晚，像草原上的游牧民族收起蒙古包一样，把各自的家打个包，飞离月亮，暂时在浩瀚的太空里转悠转悠，喝着茶聊着天，不时扭头看看月亮是不是恢复了、不时看看表是不是到了预计的时间。直到月牙开始慢慢恢复，变得丰满，他们会立刻放下茶杯付清账单、匆匆地互相道别相约下次再见，然后赶回月亮，找到属于他们的某个位置，把已经打包压缩的房子充气一样拼接起来，钻进房门开始一段新的日子。","聪明的，告诉我，你的房子在哪座山里、在哪片海边？我去月亮上找你啊。"],"sum":"-"},{"n":29,"c":"心","d":"2014.11.1","lead":"心和脑，在汉语言体系里是很奇妙的两个字。说思想的时候，会习惯于把这件任务部署给脑；说思念的时候，总是愿意把这个词放在心上。所以，我们的祖先用这样的方式做出了理性与感性的区分:理性的思想，是放在大脑、靠脑电波在回形的沟壑里起起伏伏左冲右突撞击出来的；感性的思念，是源自心脏、靠血液在遍布身体各个角落不断流动偶尔加速传递到的——当然，我们现在都知道，其实这些任务都是在大脑这儿完成的，可是毫不影响我们继续沿用传统的用法，这是语言的魅力，我们可以说着大脑并不这样认为的话，继续心有念起，脑有所思。","body":["聪明的，你在哪儿呢，你在思考什么呢？你又在思念着谁？"],"sum":"心和脑，在汉语言体系里是很奇妙的两个字。说思想的时候，会习惯于把这件"},{"n":30,"c":"逢","d":"2014.11.2","lead":"你我相逢在黑夜的海上，你有你的，我有我的，方向……。诗人如是说。那么又是为什么，你我会有这样一次相逢？我们像两个在森林里漫无目地行走的孩子，各自走在各自的小路上，对早已注定的命运轨迹毫不知情，认为已经将命运掌握在自己手里，认为每次岔路后的抉择都是临时起意，却在兜兜绕绕后，在天父早就选好的某棵树下相遇。相视而笑的瞬间明白，原来，你我的方向，是彼此啊……。","body":["聪明的，继续前行吧，我等着与你相逢。"],"sum":"你我相逢在黑夜的海上，你有你的，我有我的，方向……。诗人如是说。那么"},{"n":31,"c":"网","d":"2014.11.4","lead":"生活就是一张网，时间盘踞在网上，随时准备发动一场针对我们的狩猎。我们看得见的不自由，通常是作茧自缚的不自由，我们发明了若干新鲜玩意儿，想要获得自由却最终发现原来还是一种新的束缚，变成对自己的新的捆绑；我们看不见的真正的不自由，是无法逃脱的那张真正的网——由时间做主的那张网。时间，也许才是连接一切、让宇宙每个元素之间相互关联的真正密码吧。四维空间到五维空间的突破，是时间之外、主观意识的纬度介入，应该是宇宙低级生命和中级生命的分水岭，这才算得上是宇宙里真正智慧的入口吧。","body":["聪明的，在还未参透时间的秘密之前，在获得真正自由之前，不要浪费生命在无谓的事情上，要继续阅读与思考，站在前人栽下的树上去参悟，没准哪一天，我们可以破解时间这张网的秘密呢，到那时，我们可以进入追求下一个自由的阶段……。"],"sum":"生活就是一张网，时间盘踞在网上，随时准备发动一场针对我们的狩猎。我们"},{"n":32,"c":"诗","d":"2014.11.5","lead":"诗，是言语世界里用悠远钟声衬出无比安静的寺庙，是蕴含哲理的理性文字，可以直达宇宙的每个角落；诗，是言语世界里深深插入地下的一把匕首，是有力的感性文字，可以穿透肉体直达心底。卡尔维诺说: 我对于文学的前途是有信心的，因为我知道世界上存在着只有文学才能以其特殊的手段给予我们的感受。","body":["人性中的动物性是贪婪懒惰自私，但是，人性中还有理性和灵性。灵性的起点是对美好的追求。不管世界在科技的推动下如何变化，人们的基本需求中对美的欲望总还要存在。出版业的起点恰恰是对人性中光明一面的记录、传播与传承。马丁路德的九十五条论纲打开信仰的门，却不是靠着大门上的大字报就可以实现思想的传播的，正是刚刚起步的出版业给思想插上翅膀。在那个时候，印刷技术行业就是出版业，出版业就是印刷业，信息传播技术与出版业从一开始就是双生关系，各自的角色就已经十分清楚。所以，在数字技术网络技术时代，我们要期盼的不是数字出版或网络出版，而是把技术融入内容、将思想融入内容的未来出版。变化的是外在的形态与商业模式。穿越历史，出版的内涵与功能，其实一直没变。","聪明的，让我们一起躺在诗歌里，找回属于文学的宁静。"],"sum":"诗，是言语世界里用悠远钟声衬出无比安静的寺庙，是蕴含哲理的理性文字，"},{"n":33,"c":"琴","d":"2014.11.6","lead":"音乐是人类共通的语言，不分种族不分地域不分古今；甚至，音乐是世界万物的语言，所有地球生物都听得懂、感受得到的语言；甚至我还经常遐想，也许音乐还会是宇宙共通的语言吧。说到底，音乐是声波，是不同波段的声波以不同的时长出现后的各种排列组合，——音乐是可以计算的，这才有作曲系学生的各种痛苦算法。音乐的语言要靠各种载体呈现出来，琴，无疑是其中最为经典的工具。“琴”字是形声字，“今”字的音通“金”，同时也是象形，琴的古体字看上去就是一把挂着弦的金木结构的竖琴，那些美妙的旋律便是自弦上开始飞升的。聪明的，愿你一直可以有属于自己的一段段旋律，来记录生命的美好。","body":["这一篇文字的引子里，提到了东西方乐器源起的传说，从墨丘利说到伶伦和伏羲，说到五十弦与二十五弦的古琴，说到五弦琴到七弦琴的演变。但还是漏掉了很多有意思的传说，比如《山海经》里的太子琴，那可是五帝之一颛顼的孙子，传说中能使五色鸟舞于庭中的乐神级的人物，同时又是战力超群的武将大神，最擅长的便是那五十弦的古琴。音乐是人类共通的语言，所有的故事和情绪都可以用音乐表达。高山流水，弦动知音，我们要找的是那双肯静下心聆听的耳朵。","聪明的，愿你能找到那双耳朵。"],"sum":"音乐是人类共通的语言，不分种族不分地域不分古今；甚至，音乐是世界万物"},{"n":34,"c":"棋","d":"2014.11.7","lead":"世事如棋，棋如世事。天龙八部里的玲珑，棋盘如镜，照出世人心。结果是虚竹和尚的看似错手得胜局。金庸先生的笔法自是妙不可言，这段文字背后的深意更是无穷。棋手讲究打谱做根基，套路很重要。但是真正成为圣手的却是可以突破常规自创棋路的智者。世界规律亦如此。不跳出窠臼，便难以进入新的知识境界。","body":["聪明的，别让经验蒙住双眼，别让经验捆住手脚，愿你用想象的力量冲破看不见的封印，抵达新世界的彼岸。"],"sum":"世事如棋，棋如世事。天龙八部里的玲珑，棋盘如镜，照出世人心。结果是虚"},{"n":35,"c":"波","d":"2014.11.8","lead":"波，是水的皮肤。安静的水，是透明的，只有因了搅动才能看到他的皮肤。说起搅动水面，就会想起猴子捞月的故事。每次看到认认真真做着准备，周密部署计划，然后坚定地实施捞月计划的猴子，都心生佩服与怜爱，不忍心看他们面对一场空的结果，就想让他们在童话里找到一个美好的籍口。然而，童话终归是童话，现实的残酷是来不得柔情的。在走向未来出版的路上，大胆探索的其实只该是思路，真正迈出步子时，一定要小心再小心地、先确定路线的基本条件是否真实是否足够，要看清我们的目标到底是天空里的真实、还是在水里的虚像。捞月亮和登上月球，其实都是看似不可能的任务目标，我们要选择的，是踩到月球地面的实实在在的那一脚，而不是奔着水中的那个幻象。","body":["聪明的，如果你在数字出版这座江湖里，你就会懂得这些话和这些话背后的意思。"],"sum":"波，是水的皮肤。安静的水，是透明的，只有因了搅动才能看到他的皮肤。说"},{"n":36,"c":"暖","d":"2014.11.9","lead":"暖字原本是“火”字旁，意指篝火、火盆一类的人造温暖；逐渐演变成“日”字旁以后，意指太阳般的温暖，便多了明亮的意境，兼有四季与昼夜的意象。 很多时候我们都知道，温暖是一种感受、一种情绪，甚至根本和温度无关。穿过城市的河在夏天奔流不息，你我站在两岸晒在同一个太阳下面，伸出的手握不到彼此，离歌响起的瞬间，冰入心底；河水在冬天结冰，你我走在冰上相视而笑 ，直到拥抱彼此，寒冷在我们身后融化成羽翼，飞往云端的路上，心底暖如盛夏。为什么你的一个微笑就可以温暖我——因为爱。","body":["聪明的，在这样的夏天清晨，听着露珠从叶子上滑落掉在地上的声音，你可曾温暖地想起谁？"],"sum":"暖字原本是“火”字旁，意指篝火、火盆一类的人造温暖；逐渐演变成“日”"},{"n":37,"c":"忆","d":"2014.11.10","lead":"“憶”，心底记住的意象。个体的记忆和一个民族的记忆，都一样需要不断被书写下来，才好不被遗忘——就像今天森林故事里的长老，趁记忆还新鲜，把曾经的星球曾经的家园记录下来，让曾经的画面固定在书上，让我们记住我们是从哪里出发的。出版，正是记录、传播、传承人类文明的承载方式。 所以，最早刻画在岩壁上的狩猎场景，也可以视为与出版活动在本质上一致的对文明记录的起点。那么，我们是否可以不再纠结于出版这个词，而去追寻这种行为的本质意义？","body":["聪明的，时光是弯不回原点的美丽线条，你我在那条线上走过，随手记下所有的意象。"],"sum":"“憶”，心底记住的意象。个体的记忆和一个民族的记忆，都一样需要不断被"},{"n":38,"c":"静","d":"2014.11.11","lead":"静，是一种力量。 “静”字，一清一争。造此字的原意，是要我们先入心内清澈境而后争得身入无上境界；还是须先争得身入无上境界而后得入心内清澈境？是要以主观的安忍不动消灭外在噪动，以不动降动，最终抵达纯净无噪；还是要先以金刚力灭十方躁动，以动灭动，而复归万物安宁心内纯净？是先清而争，还是先争而清呢？","body":["聪明的，你告诉我。"],"sum":"静，是一种力量。“静”字，一清一争。造此字的原意，是要我们先入心内清"},{"n":39,"c":"夜","d":"2014.11.11 — 2022.08.20","lead":"《説文解字》曰：夜，舍也，天下休舍也；从夕，亦省聲。白话意为：夜，放下劳作，天下万众都放下劳作，安歇休养，字形采用“夕”作边旁，采用有所省略的“亦”作声旁。","body":["同处一个地球，万物繁衍生息都仰赖同一个太阳。因此，古今中外的文明也是暗合相通的。中华先民讲究“日出而作、日入而息”，与此对应，西方世界也有近似的说法。“你们来，同我暗暗地到旷野地方去歇一歇”——这是《圣经.新约.马可福音》38章里的句子，是耶稣对忙于四处布道的弟子们说的，是怜惜他们奔波之苦，也是向门徒们说明，不要工作过度，要找到可以安静的地方，学会休息。这和汉字“夜”的本意竟如此契合。","有趣的是，《夜》的插画创意并非源自汉字解读，而是来自《圣经》的这句话。第一次看到这句话，是2007年12月去新加坡参加WIPO亚太地区会议期间。那次是很匆忙的出差，第一天深夜抵达，连续高密度会议议程，第四天中午结束会议即匆匆奔机场回国。那时，这种出差状态是很常见的。会议到了第三天，我早早起来散步，走出酒店大门，街道对面是一个很精致的小教堂，教堂外面低矮的白色栅栏上挂着一个狭长的牌子，上面所写正是这一句。","着魔一般，这句话便开始萦绕心头。那天听会的间隙，在会议资料空白处信手涂鸦，便有了这样一幅插画。再后来，从这句话延展出一篇短小的童话文字，用以配上插画。这也是很少的先有画、后有文的作品。这一篇是《森林的孩子》系列中我特别喜欢的一篇，图文都很自然，很多朋友也各自喜欢着各自所好的某一句话、某个细节。","故事里说的，是在夜里迷失方向的可怜的一个小鬼。而所谓的鬼，也许不过是我们心底的影子，是太阳落山后、在寂静的夜里褪去面具的你我。一念起、一念灭，我们是我们自己的选择。通往光明的小路总是不那么好走，甚至会藏在很容易被我们忽视的角落。看似坦途的去向，终点却可能抵达的是沉沦。人生注定是苦旅，而所有的辛苦、所有的欢喜悲伤、喜怒哀乐也都只是过程罢了。脚步匆匆的我们，时不时，还是要停一下，休息一下，也是让自己找回自己。","聪明的，夏末秋意渐起，夜色如水。如果愿意，咱们一起暗暗地、到那旷野地方吧。"],"sum":"《説文解字》曰：夜，舍也，天下休舍也；从夕，亦省聲。白话意为：夜，放"},{"n":40,"c":"钓","d":"2014.11.13","lead":"“钓”字意指金属的勺子，用来一次获取一样东西——大抵该是鱼吧。钓，是纯粹的手工作业，和用网捕捞的规模化作业不同，带有一种独特韵律的慢节奏。因此，在中文语境里便有了诸多“钓”的场景，当然，已经不是在单纯地钓鱼了。青杆三尺银丝垂，钓的是天子知遇，钓的是江雪寂寞，钓的是志满天下，钓的是沧海逍遥！当时写完引子的诗句，有朋友问我，怎么有怀才不遇之意？我挠头一笑，老兄你恰好理解错了，我是在笑那些其实“意难平”的假钓者，凡不得志者多要去假模假式地钓一把，等到一日登天后又有几人会稳钓世情？大抵会让钓鱼竿就此蒙尘不见天日吧。","body":["所以，聪明的，感慨怀才不遇是无意义的，有那个自怜自艾的功夫，不如放下钓机会的钓鱼竿，踏踏实实去做好每一件小事。"],"sum":"“钓”字意指金属的勺子，用来一次获取一样东西——大抵该是鱼吧。钓，是"},{"n":41,"c":"术","d":"2014.11.14","lead":"术，意指技艺、方法。术与道不同，一个关注实际操作的实践层面，一个关注抽象提炼的规律层面，一为实践一为理论。二者并无孰轻孰重的区别。掌握具体的操作而不总结规律，空谈抽象的理论而不实际执行，都不可取。关于道理和理论，我们纠结了太久，中国人太喜欢讲究个师出有名，害掉了诸多脑细胞。然而在实践的术上却经常浮皮潦草。譬如当下的互联网时代，我们喊的互联网思维太多，真正肯俯下身子做基础工作，把每一件事情做好的，太少。","body":["聪明的，我说的不只是数字出版，我说的是出版的未来，我说的更是我们的未来。"],"sum":"术，意指技艺、方法。术与道不同，一个关注实际操作的实践层面，一个关注"},{"n":42,"c":"螺","d":"2014.11.15","lead":"宇宙里的歌者，会幻化成各种形态，藏在各个角落，不停地哼唱直刺心底的歌，用遥远的远方的未来，催我们起航。很多时候我们不清楚地知道未来究竟会是什么样子，但是我们应该知道的是，必须坚持走下去，活着看到未来。不走，再近的远方的到不了。","body":["聪明的，你知道，我说的不只是数字出版，我说的还是数字出版。"],"sum":"宇宙里的歌者，会幻化成各种形态，藏在各个角落，不停地哼唱直刺心底的歌"},{"n":43,"c":"铃","d":"2014.11.16","lead":"风起，铃动，音响。铃是什么？说文解字的解释，大概是说，用金属响器发出信息、指令。但是我更喜欢佛家的说法，铃，是在采集自然的信息，是人们与自然对话的媒介。寺庙屋檐下挂着的铃，单铃、两叠、三叠、六叠……都是在把风想说的话、无声的话“翻译”成音乐的语言，让我们通过对音乐的感悟、去破解自然的密码。夏天的清晨，坐在阳台上，听着风铃翻译着穿过窗子的风的话语，在叮叮当当的旋律起伏中，安静地读本书，看着难得的蓝天……。","body":["聪明的，祝你周末愉快！"],"sum":"风起，铃动，音响。铃是什么？说文解字的解释，大概是说，用金属响器发出"},{"n":44,"c":"果","d":"2014.11.17","lead":"在去年的初冬，这幅画刚刚完成的时候，宝宝妈和小宝凑过来看，宝宝妈没看懂女孩儿手里拿的是什么，说是葡萄，小宝倒是看了一眼就说，明明是浆果嘛，我那个百科书里有的。宝宝妈说画的太大了比例不对。好吧，看来孩子们的视角还是不一样的哈。嗯哼，很多事情是这样，我们辛苦种下前因，却很难预料后果，我们有自己初衷之因，却很难控制他人评价之果，特别是当我们在做一件创新的事情时。这几年一路走来，在探索出版的未来的过程中，午夜梦回，夜观天象，掐指算来，冷汗一背，居然……居然不再有“出版”一词，我辈忝列读书人群，该如何面对先人前辈？然而又一想，出版的“因”是什么？出版，是从哪里来？我们初心为何呢？无外乎，是人类对思想的“表达+表现+传播”，如此，何必纠结于这个本质的内核装入怎样的技术外壳呢？有因有果，说的是本质的因与本质的果，世人偶有怨气，怨老天不公说因果不应，但其实还是没看透没看到位吧。因此，我们把“出版业”参透了、参没了也无妨，该是剥开迷雾还其原形的时候了，这是“内容业”，由此才说得通未来，不再关注内容的呈现方式和承载介质，一切归结为内容本身。","body":["聪明的，你觉得呢？咱们一起继续探求吧？！"],"sum":"在去年的初冬，这幅画刚刚完成的时候，宝宝妈和小宝凑过来看，宝宝妈没看"},{"n":45,"c":"歌","d":"2014.11.18","lead":"“歌”的缘起是文，思如泉涌而文成，吟诵则为诗，入曲即为歌。歌，一定是人声的。歌字从甲骨文即有，彼时意指服役者传唱、吟诵的民谣。可见，歌者原是下里巴人；然而，后世几经变迁，包括了歌在内的音乐，已成为人类的共通语言，不再分贵贱高低，歌者可以是任何人，任何人都可以成为歌者。","body":["聪明的，每天都可以在这里听到各种美妙的歌声，是多么幸福的一件事。愿歌者可以在深夜以歌声催你入眠，愿歌者可以在清晨以歌声叫醒你的耳朵，愿歌者永远陪伴你我！愿你找到属于你的那首歌。"],"sum":"“歌”的缘起是文，思如泉涌而文成，吟诵则为诗，入曲即为歌。歌，一定是"},{"n":46,"c":"境","d":"2014.11.19","lead":"境，最终是要划出边界，才分出不同境。人类的伟大与渺小都体现在探寻边界的步履中。人类一直就是没有长大的孩子，翻箱倒柜地寻找被大人藏在角落里的答案。渺小，是因为我们始终被困在三维世界里，按照也许早就被设定好的路线前行。而我们的伟大，恰恰是在这前行中，我们的执着，与试图用特有的智慧方式打破定局的顽强态度。我们最强大的武器，其实一直在我们自己手里，这就是，各种艰难一直无法磨灭的、属于人类的、伟大的想象力。什么是想象力，就是虽然睁开眼看不到——我却可以闭上眼看到！！虽然我们的现实科技还难以让肉身突破时空的限制，但是谁能限制我们的思维？所以，只有想象力，才是人类的终极武器。聪明的，还记得你小时候仰望星空时的遐想吗？别让那个瞬间消散，让我们一起保持足够的想象力，去找到未来！","body":["同样，在探索出版的未来的路上，那些幻境掩盖了真相，我们要执着地走下去，并且，用有根据的科学的想象力穿透幻境，让那条秘径显现出来，一起到达未来。","P.S.记录一下：昨天有人提醒我，急脾气要改，平心静气琢磨了一分钟，想通了。嗯，我才不改呢。"],"sum":"境，最终是要划出边界，才分出不同境。人类的伟大与渺小都体现在探寻边界"},{"n":47,"c":"云","d":"2014.11.20","lead":"云，山川气也。云，是大地之水蒸腾至空中的凝结，天上地下，本无上下、本无不同，万事万物皆有循环轮回。宿命？规律？佛家讲的云，和科学家讲的云，其实都是一个对象。 宗教与科学，本就是双生子吧，都是人类的文明成果。矛盾吗？对立吗？跳出束缚去看，有何不一样呢？浮云遮蔽日，何处是长安，若要见长安，终须风吹浮云散。由此，你我，且以金刚力悟，散去满天浮云吧。聪明的，昨天的我们在今天做什么？今天的我们在明天做什么？云上的日子，不是虚幻无根的，那终将是属于我们的美好未来。","body":["聪明的，让我们一起飞向云端吧。"],"sum":"云，山川气也。云，是大地之水蒸腾至空中的凝结，天上地下，本无上下、本"},{"n":48,"c":"蝶","d":"2014.11.24","lead":"蝶的一生，从卵到幼虫，从蛹到破茧而出，到羽化成蝶！漫长的等待后，最终成为那飞翔着的美丽生命时，岁月却又那么短暂。你看这个“蝶”字，明明就是一只小虫子，停在她爱着的“木”上，便是她的整个“世”界，便是她的前“世”今生。——然而，并不是所有的蝶都满足于安处原地！关于蝴蝶的故事好多，我一直想知道，是谁最早发现了蝴蝶要飞过沧海的愿望？那弱小的生命面对浩瀚的沧海时，其实，何尝不是我们人类面对永恒时的场景？！在真实的世界里，倒是的确存在一种独特的蝶族，会选择在入秋后飞过海洋去寻找温暖的彼岸。那一族的蝶群，在飞越的过程中会有大批的蝶在中途坠落、永远留在海洋的怀抱里。而每一只坠落的蝶，都是在为那个庞大的蝶群可以坚持飞抵光明。","body":["聪明的，我愿努力扇动起脆弱的翅膀，和族群一起飞翔，不管我自己能否抵达彼岸。因为我知道，总会有蝴蝶可以飞抵未来！"],"sum":"蝶的一生，从卵到幼虫，从蛹到破茧而出，到羽化成蝶！漫长的等待后，最终"},{"n":49,"c":"露","d":"2014.11.25","lead":"北京今夏的雨水似乎不算少，雨水冲刷过的天空显得更加湛蓝清澈。自古至今，人类对天上之水有着无比尊崇。“露”字所指，天上之水，入夜降世，途经人间径，藏于草木，待天明日升，化雾腾空，复归天上。该是怎样的神秘？菩提树下参悟宇宙，观三界，眼见露成，眼见露散，忽得心得，曰：一切有为法如露。聪明的，佛法如露，并不是说佛法是幻影，更不是说，万物之规律是幻影。也许，等到晨光这个大“道”降临，露珠会形散，看似虚幻，但其实，恰恰是剩下的才是你我肉眼凡胎所难见的本来。","body":["聪明的，我们不怕露珠散去，我们更不怕世界的真相被继续隐藏。在露珠未来得及全散去时，捕捉一些美丽，留住一些希望。相信，我们已经接近真相。"],"sum":"北京今夏的雨水似乎不算少，雨水冲刷过的天空显得更加湛蓝清澈。自古至今"},{"n":50,"c":"虹","d":"2014.11.26","lead":"虹，挂在天上，连接的是人世与天堂。双头的虫，吮吸着雨后的湿漉，阳光被折射成七色的桥……。 看见虹的时候，也是告别阴雨的时刻。可是，在雨停之前，又怎能看到彩虹？！所以，聪明的，如果你正在经历风雨，那就想想雨后吧，等到一切艰苦都过去的时候再回头看，所有的过往，都只是过往，抬头看到的，便只有纯净的天空和七彩的虹。","body":["聪明的，祝彩虹相伴，好运一路。"],"sum":"虹，挂在天上，连接的是人世与天堂。双头的虫，吮吸着雨后的湿漉，阳光被"},{"n":51,"c":"凤","d":"2014.12.8","lead":"鳳，是传说中的圣灵，羽毛老化以后会根根褪去，再浴火重生。那火里烧掉的是自己外在的过去，留下来的是脱离外形的自我。我一直想知道，在这样的重生与轮回里，凤，该如何保持记忆，如何记得自己的使命，在每一世，雏凤清音鸣九霄，展羽舞天辖万鸟。想来，在那痛苦的燃烧的过程中，一定会有生命的密码传递。而不断从战争疾病天灾等等各种苦难中重生的人类，又何尝不是一代一代地传递着文明的密码。","body":["聪明的，在深夜里闭上眼，仔细倾听来自身体里的声音，和那些音乐背后隐藏在身体里的密码吧，如此，我们终将找到前世今生的价值与目标。"],"sum":"鳳，是传说中的圣灵，羽毛老化以后会根根褪去，再浴火重生。那火里烧掉的"},{"n":52,"c":"画","d":"2014.12.9","lead":"画，是人类对世界所做的最早的记录与模仿。绘画是这样的一个复杂过程，几乎调动了人类各种感官，也几乎最全面地调用了人类的创造力。一个客观的事物或场景，呈现在人类的面前，映射在人脑里，在人的思想里产生一种主观的形象，然后，人有了表达的欲望，从下意识的涂鸦到慢慢找到各种规律，对线条和面的控制力在不断增强，终于，客观的事物或场景、经过人绘画活动形成的线条、面与颜色的结合，这两者在人脑中的映射结果所指向的，成为同一个对象，人的绘画活动结果成为一种符号，用来标识某个客观世界的对象。然而，人类远未止步于此，主观的想法在客观的绘画结果上体现的越来越多。于是，追求的不再是所描绘的要像对象，而是更能体现人对世界的主观感悟。","body":["大体而言，各种文化领域的活动都是这个路数，出版业也一样。 抓住稍瞬即逝的灵感，用娴熟的技巧把她表达出来，这是出版业。出版，走到今天肯定离不开技术，但是千万别忘了，我们是如何走到今天的，所谓，现在特别泛滥的那句不忘初心，是要我们记住，我们因何而来。内容产品，再炫的技术，如果没有思想内核，注定走不远的。","聪明的，你懂的。"],"sum":"画，是人类对世界所做的最早的记录与模仿。绘画是这样的一个复杂过程，几"},{"n":53,"c":"舟","d":"2014.12.10","lead":"我们一直在寻找那条船，可以穿过思想的谜河。然而思想的世界里，四季从来不那么分明，冬天总是说来就来，不由分说，冻住我们思考的船。思想世界里的冬天是什么？当然不是寒冷，而是思维惯性带给我们的束缚。所以，当遇到思想上的重重障碍难以参透时，要以金刚力破去万千束缚，这其中最重要的，是破掉昨日之我，重新审视自己是最难的，寻找的过程也注定是极为拧巴的。破冰的方法很多，跳出思维惯性束缚的方法也很多。","body":["聪明的，只要你肯和自己过不去，就能让思考的船一直前行。嘿嘿，你懂的。"],"sum":"我们一直在寻找那条船，可以穿过思想的谜河。然而思想的世界里，四季从来"},{"n":54,"c":"狐","d":"2014.12.12","lead":"“狐”与“孤”，两个字如此相像。狐，千辛万苦地将那个犬旁修炼成子旁，以人形入世，却自此注定一世孤独——她怎能理解人世的险恶与人心的复杂！人类天生的劣根性很多，其中之一便是推卸责任。从封神演义的故事开始，狐便成了常见的转嫁人性罪恶、承担人类过错的载体与化身。于是，本是圣灵的狐，逐渐变味成邪恶的符号，何谈公平？今天送给大家的文字，引子部分是在反思我们的罪，故事诗是想还原山海经里那个荣耀于世的圣灵，让我们记起，狐在面对危机时的责任与担当——这两个词，在现在这个社会是多么的奢侈。说易行难，难，不难在一时的决定，难在一直的坚持。诚然，我们不会每天有机会为责任与担当去面临生死抉择，那么，让美好一直存在，也算是一种小小的坚持吧。","body":["聪明的，谢谢你！谢谢你每天来看我的絮絮叨叨，来看这些随性的涂鸦。祝你一切安好，相信我，你不会孤独，不信？你回头看，好多群友正在你身后微笑……。"],"sum":"“狐”与“孤”，两个字如此相像。狐，千辛万苦地将那个犬旁修炼成子旁，"},{"n":55,"c":"蜓","d":"2014.12.12","lead":"世界在不断变化，总有些人和事会渐行渐远，比如已经离开我们的MSN。那些年我们在MSN上聊过的话题，我们在MSN上打过的字都沉没在网络里，沉寂在不知道哪个地方的服务器里。今天的引子是当年在MSN上给一位朋友（廖老师）写着玩的文字。在开始画蜻蜓的时候，那些文字还浮在空中不肯落回我的脑海，但是，当线条堆积成形的时候，关于这篇文字的记忆在瞬间找回。虽然，有很多东西会离去，但是会有更多的东西留下来。","body":["聪明的，是谁，会一直留在你身边？","P.S.在这个群里总有冥冥之中的巧合不断发生。昨天欢迎了一位新群友“飞龙”，而蜻蜓的英文恰巧就是 dragonfly，好吧，兄弟，你知道的，英语和中文总是倒装的，所以蜻蜓（龙飞），就是飞龙。","* 群，指的是“晓一.大书”悦读群。"],"sum":"世界在不断变化，总有些人和事会渐行渐远，比如已经离开我们的MSN。那"},{"n":56,"c":"龟","d":"2014.12.13","lead":"龟本是古代四灵（龙凤麟龟）之一，且是唯一有真形对应的灵物。岁月划过，古时的故事终于成为逝去的传说，慢慢铺满细尘。龟的圣灵之性被岁月慢慢磨灭，人们开始习惯于拿龟开笑——可是，曾经的圣族从不追究这些。龟，以安稳如大地、静如山不动的境界等待和观察着。偶尔，龟会和孩子们在一起玩耍，因为他知道，只有孩子的心底才会有纯粹的善良，才会有真正解开咒语、识别前途的机会。","body":[],"sum":"龟本是古代四灵（龙凤麟龟）之一，且是唯一有真形对应的灵物。岁月划过，"},{"n":57,"c":"枭","d":"2014.12.19","lead":"枭，鸟栖于木，回望天涯路……。有些声音是不那么动听的，但是，可以叫醒我们的心，让我们清醒。所以，聪明的，我们得学会，不时地去倾听那些来自不同方面的声音，用不断的怀疑打破自己固化僵化的思想。","body":[],"sum":"枭，鸟栖于木，回望天涯路……。有些声音是不那么动听的，但是，可以叫醒"},{"n":58,"c":"鹿","d":"2014.12.22 — 2021.12.25","lead":"《説文解字》曰：鹿，獸也；象頭角四足之形；鳥鹿足相似，从匕；凡鹿之屬皆从鹿。白话意为：鹿，一种野兽；字形像鹿的头、角、四足形状；鸟和鹿的足相似，字形采用“匕”作边旁；所有与鹿相关的字，都采用“鹿”作边旁。造字本义：名词，栖息于苔原、林区、荒漠、灌丛和沼泽的食草动物，四肢细长尾巴短，一般雄兽头上有角。","body":["鹿的甲骨字形异常美丽，也更形象，以雄鹿的大眼有角成字头，以四足纤细并列成“比”，完全是象形字。在《说文》中说到鹿，释义为“山中仙兽”。汉字，是我们的先人对世界的描述符号，走过时间的河，每个字都慢慢变了模样，人们也在不断赋予这些符号新含义。中文的语境里，鹿还隐含着各种寓意：美丽与爱情、长寿与健康，权力与江山……。在西方的语境里，有一种鹿叫驯鹿，是和那个胖老头一起住在长了三只耳朵的拉普兰野兔耳山的山顶上的十二只精灵。","今天的童话诗里，试试看，当文字在东西方的不同语境相遇时，当西方圣诞老人的麋鹿掉入东方的森林里，会发生什么故事？","聪明的，愿我们始终保有想象力和童心。"],"sum":"《説文解字》曰：鹿，獸也；象頭角四足之形；鳥鹿足相似，从匕；凡鹿之屬"},{"n":59,"c":"冰","d":"2014.12.23","lead":"炎热的夏天，最喜欢的是冰。 冰镇酸梅汤、老北京冰棍、北冰洋汽水……，当然还有冰镇啤酒。我们所处的世界，季节是循环的。有冬天也会有夏天，谁让我们住的这个星球一直在没出息地绕着太阳转个不停呢——当然，就是在这样的不停转中，才会有包括我们在内的各种美好。冬天河水结冰，春风吹过，冰再化成流动的水。所以该相信的是什么？是冰一定会化，还是水一定会结冰？这是乐观与悲观的区别？但其实都是愚蠢的判断。有人会透过冰化水、水结冰的纠结现象，看懂冰与水互相转化的规律。聪明的，看到这里，你忽然叫出声，说自己醒悟了。你说对了，世界本无悲无喜。非要说悲喜，探究规律的过程很悲催，解开绑着规律的绳索时很欢喜。","body":["聪明的，被我绕迷糊了没？有点晕？嗯嗯，恭喜你！祝你每天都可以这样迷迷糊糊地开心！"],"sum":"炎热的夏天，最喜欢的是冰。冰镇酸梅汤、老北京冰棍、北冰洋汽水……，当"},{"n":60,"c":"芽","d":"2014.12.24","lead":"“芽”，一颗牙种在地里，长出草、开出花，有一天会结出果，那就是希望啊！从小宝第一次换牙开始，宝宝妈就给小宝讲关于“牙仙”的故事，她每次都会把小宝掉下来的小牙精心地洗好、包好，放在小宝的枕头下，然后第二天一早，那颗牙就会变成一份小礼物，有时是一辆乐高小汽车，有时是一枚国外的硬币，有时是一本书……。小宝总会在睡前很紧张地不停翻看枕头下面，用手摸摸藏起来的牙，按按好，无比期待自己的小牙可以换到的礼物。其实，我们都是像小宝一样的孩子，怀揣着各种希望，枯燥的日子便不再那么难熬。走过岁月，我们已经种了很多很多的希望下去，他们都会慢慢发芽，抽枝散叶，并终将长成参天大树。","body":["聪明的，愿你心里的希望，早日发芽。"],"sum":"“芽”，一颗牙种在地里，长出草、开出花，有一天会结出果，那就是希望啊"},{"n":61,"c":"醒","d":"2014.12.28","lead":"“醒”，“酉”时畅饮而醉，呢喃乱语入眠，梦至深夜，神游四海，忽而坐起，脑海清明，举目窗外，“星”光衬银河……。这是我常见的与友饮酒之态。乱花迷眼的世界里，我们偶尔会不知道自己是醒着还是睡着。如果尼奥永远不怀疑自己的世界，如果他选择了遗忘的药丸，就会一直在营养液里做那美丽而平淡的梦。然而，一切都变得不一样，是因为对真实、对答案的追求，也许这是人类的致命弱点，但恰恰因了这种执拗的坚持，才有存在的意义和价值。所以，虽然表象永远会迷惑我们，但是没关系。","body":["聪明的，让我们一起深呼吸吹口气，让迷雾散去。一起寻找那条通往真实的小路——即使这一路会荆棘密布，会让挥舞的手臂鲜血淋漓，但我们终将走出黑暗找到光明。"],"sum":"“醒”，“酉”时畅饮而醉，呢喃乱语入眠，梦至深夜，神游四海，忽而坐起"},{"n":62,"c":"游","d":"2014.12.31","lead":"字的演变恰如世事变迁，总有些字，在时空穿越的途中颠沛流离，前世今生如此不同。“游”，本字是“斿”，是古代举着族旗行走四方的学子，看来古人很早就讲究读书万卷、行路万里。后来在这个“斿 ”字旁边加上水，代表学子举着族旗渡水，加上走之，代表陆路行走，再后来逐渐合并成一个“游”字。中国文化的浪漫是在骨子里的，并且会有一点狂傲不羁。我一直猜想，庄子一定是在狂醉后一挥而就的《逍遥游》吧，那恣意汪洋的文思，天地俯仰，想象无穷，却又富含哲理。所以，人的心胸是最宽广的，人的想象力是最无边界的。闭目神游，魂行万里，冥思一瞬，光年之外……。","body":[],"sum":"字的演变恰如世事变迁，总有些字，在时空穿越的途中颠沛流离，前世今生如"},{"n":63,"c":"聚","d":"2015.1.1 — 2021.12.31","lead":"《説文解字》曰：聚，會也；从乑，取聲；邑落云聚。白话意为：聚，人口会集；字形采用“乑”作边旁，采用“取”作声旁；人口会集的乡邑、村落叫“聚”。造字本义：动词，强取之于民众，即强权向百姓征敛财物。从字形上看，聚，为取之于众。随历史演变，本义已弱，改为单纯的汇集之意，不仅指人。","body":["年轻时也曾贪念一干人等夜夜笙歌，年纪大了以后，却越来越不愿意和太多人共处一堂漫无边际地胡扯。更愿意仅仅三五知交，可茶可酒，这才真真品味到\"聚\"字之本意。\"聚\"需有“众”，则，三人即可成聚，寻兴味相投者，相邀四海，会于一处，数目相对，几手相握，我自静静听，你可絮絮说，会唏嘘不已，会击节浮一大白，会慨而当歌，更会于会心处长啸长笑。临别，则拱手相谢，兴尽归去，各取所想取，快哉！转眼一年过半，新年时画过的这幅\"聚\"，在上半年实现了几次，着实欣喜。","聪明的，未来的路上我们还要继续在一起。","愿你我，心常系，人常聚。"],"sum":"《説文解字》曰：聚，會也；从乑，取聲；邑落云聚。白话意为：聚，人口会"},{"n":64,"c":"雪","d":"2015.2.3","lead":"-","body":["2022.1.22","《説文解字》曰：雪，凝雨說物者；从雨，彗聲；","白话意为：雪，凝结雨水而成、从天上飘落并带给天下万物喜悦的美丽冰晶；字形采用“雨字头”作边旁，采用“彗”作声旁。造字本义：名词，零度以下的低温状态，空气中的部分水汽凝结成的、从天空飘落的羽绒状冰晶。“雪”字在甲骨文里的样子本来是羽毛加雨点，“白色的羽毛像雨点一样落下”，这是古人最早对雪的观察。","古人在《诗经.小雅.采薇》里说：“昔我往矣，杨柳依依。今我来思，雨雪霏霏。”在春天离开，在冬天归来。愿所有人的归乡路，都能平安坦荡。每当雪至京华，总不由让人怀念故乡旧时雪。记忆里，小时候经常可见的鹅毛大雪，在几十年以后的今天已经很难再现。偶尔下一场可以积过脚面的雪，就能让儿子和邻居的孩子们开怀嬉戏。但是，我一直不认为地球变暖完全是人类发展的恶果，人类于这世界来说，还是太过渺小。我想，地球也在按照他自身的规律在慢慢成长和变化吧。雪，也许不过是他为自己创造的玩具，顺便让地球上的各种生灵一起享受罢了。","聪明的，借着下雪，温壶老酒，为记忆森林里的故乡，为曾经的冬雪写首怀念的诗。"],"sum":"-"},{"n":65,"c":"蛇","d":"2015.2.4","lead":"《説文解字》曰：蛇，它或从虫（邵瑛群經正字：“今經典凡它蟲字从或體作蛇”）。白话意为：蛇，“它”字有时采用“虫”作边旁，写作“蛇”（邵瑛群经正字：“现在的经史典籍，凡遇到‘它’、‘蟲’字时采用异体字形写作‘蛇’”）。","body":["可见，古代文字中，“虫”即为“蛇”，专指有鳞无爪、贴地而行的蛇。后来，当“虫”字的含义越来越广以后，便再造了“蛇”字来专指。在中国流传至今的各种故事里，动物在具有人性的同时，总会更具灵性，蛇亦如此。在诸多宗教故事里，有道教的与龟相合、化二为一的玄武灵兽，还有佛教里天龙八部之一的地龙；近世情的传说，是与许仙故意断桥偶遇的白素贞和小青。在白蛇传里，小青似乎一直是个模糊的影子，甚至连完整的名字都没有——直到李碧华重构了这个故事，直到徐克翻拍了这个故事，直到黄霑用音乐重新诠释了这个故事，直到张曼玉用精湛的演技更加立体地诠释了这个角色。新的故事里，只因滑落的那滴泪水，小青最终修炼成神……。影片结尾，小青与法海隔水而立，说出最后的台词：都说人间有情，但是情为何物？真是可笑，连你们人都不明白。等你们弄明白了，也许我会再来。","聪明的，你，最近遇到小青了吗？"],"sum":"《説文解字》曰：蛇，它或从虫（邵瑛群經正字：“今經典凡它蟲字从或體作"},{"n":66,"c":"眠","d":"2015.2.5","lead":"最近几年，经常处于睡眠较差的状态，即使早早睡下去也是半夜醒来，满脑袋想法乱撞，似老僧参禅，想破头只求顿悟那一刹。跨行上岗，积累太少，底气不足，面前一摊事情，家底薄的不行，前行，便如履薄冰。偶尔一晚能够无梦到天亮，便是极大的幸福。分裂的思想状态，不断自我否定、再否定、再再否定……，翻来覆去。理想与现实，在各种迂回中努力找到路径，在苦乐喜悲中任年华老去……无怨是做不到的，偶尔也会退意萌生；无悔倒是真的，因为，好在还有那些一直坚持的师友，一班不断努力的兄弟姐妹们，便没有了懈怠的籍口。坐等春光到吧，只希望，未来可以不负那些夜不成眠的时光。","body":["到那时，聪明的，咱们一起大醉而睡，好不好？"],"sum":"最近几年，经常处于睡眠较差的状态，即使早早睡下去也是半夜醒来，满脑袋"},{"n":67,"c":"醉","d":"2015.2.10","lead":"\"醉\"的本义，到底是说饮酒到量而不乱，还是说饮酒过量而溃散，历来难考。若以金文看，右边的部分明明是舌头伸开、且口中漏出酒来，还是当指过量而乱吧。人类发明——或者说发现了酒以后，从此百般千般纠葛，恩恩怨怨却难以割舍。悲欢离合、喜怒哀乐，豪情万丈、柔情似水，婚丧嫁娶、登科升迁，各种情绪、各种人生路上的大事、各种际遇巧合，都离不开这一句\"当浮一大白呀！\"听闻此言，但见推杯换盏，觥筹交错，一时多少豪杰横卧。","body":["聪明的，来来来，你我且举杯一碰，邀明月江山，填春秋千古，混陈酿予旧岁，添新酒予明天！且醉且行，一路平安！"],"sum":"\"醉\"的本义，到底是说饮酒到量而不乱，还是说饮酒过量而溃散，历来难考"},{"n":68,"c":"藏","d":"2015.2.10","lead":"有很多东西，都被天上的父藏起来，让我们不得见，我们这一世，注定要去慢慢寻找；还有很多东西，是被我们自己藏起来的，我们想要用尽半生力气，去忘记。人生就是这样，不断地忘记不断地寻找，不断地寻找不断地忘记。网络诞生以来，我们的手指下面、各种键盘上面有多少文字留在了网络里，却从此不知去向，像是想不起来怎么会从生命里消失不见的老朋友，偶尔会忽然想起，但是，却无法准确地想起。","body":["聪明的，你在找的，是谁藏起来的文字?是谁藏起来的声音？是谁藏起来的影像?是谁藏起来的过去? 又会是谁，可以找回被你和我不经意间藏起来的记忆宝藏?"],"sum":"有很多东西，都被天上的父藏起来，让我们不得见，我们这一世，注定要去慢"},{"n":69,"c":"妖","d":"2015.2.14","lead":"“妖”，在古字中可以被拆字为“女”与“芺”（ao，三声）。芺字原意，指异草，亦称钩芺。山海经里，妖，多是鸟兽修炼上百年，苦炼成人形，这种故事的脉络，一直延续到聊斋。小时候，父母在同一所学校任教，家，就安在学校音乐教室后面的杂物间。那时候，父母忙着出门去辅导学生，搞些兼职。所以我经常是一个人在家，看各种书，听各种音乐。偶然看到聊斋，看那些妖与人的纠结缠绵，一直难以理解，好好的自由的鸟兽，为什么一定要做人呢？经过这么多年的慢慢理解，再读聊斋，看来看去满纸哭笑泪欢，无外乎“情”字啊……。","body":["聪明的，情不知所起，缘不知所终，但有心意，但有爱念，何惧天老！若注定成仙不了，那便做一个快乐的妖呗！"],"sum":"“妖”，在古字中可以被拆字为“女”与“芺”（ao，三声）。芺字原意，"},{"n":70,"c":"愿","d":"2015.2.16","lead":"愿字，繁体也会写做“願”。其实，“心”和“頁”，一为心，一为头，代表了先人对自身思想从何而来的朴素认知，自心而生，抑或自脑而生，两种偏旁写法不同，但字的含义却是一样的。愿——原本的思想、心愿，我们常说不忘初心，便该指此意。走过千山万水、沧桑岁月，直到一路走成世故俗人，层层厚重的外壳包裹下，似乎很难找到本来的面目。但是我知道，寒蛩夜鸣惊回千里梦时，你披衣起身，独绕阶行，看明月满庭池水平静，以水为鉴，低头看见的，还是当年的自己。","body":["聪明的，愿你在深夜清晨的宁静里，找回你的初心，我相信，那个美好，一直都在。"],"sum":"愿字，繁体也会写做“願”。其实，“心”和“頁”，一为心，一为头，代表"},{"n":71,"c":"年","d":"2015.2.18","lead":"-","body":["2022.2.2","“年”和“䄭”，都是“秊”的异体字，《説文解字》曰：秊，穀孰也；从禾，千聲。白话意为：秊，禾谷成熟；字形采用“禾”作边旁，采用“千”作声旁。“千”即“迁”之本字。造字本义：动词，将收割好的谷物搬运回家。古籍多用“年”，弃本字不用。秋冬谷物有收为“年”；秋冬谷物欠收为“歉”。年兽传说的最后，人们用炮竹赶走了他。小时候总隐隐觉得年兽可怜，一直怀疑我们会不会误解了年？这才有了这篇《年》。","前晚和一个老朋友见面聊天，说起来竟已三四年未见，好在，再见依然如故，默契依旧。些许老酒作引，勾起回忆。于是，说起时间的话题。感慨：时间，是有力量的，山可平之、水可填之。然而，比时间更有力量的又该是什么? 是人的思想和人的故事吗？可是，上下五千年、抑或五万年，很长吗？在更长的时间纬度上，人类又是否留下过痕迹？寻找答案的路径，是该穿越回过去、还是观察当下，抑或奔向未来? 我一直认为彻底的悲观主义者，才会表现的更加乐观——如我们。夜半月升，在午门前席地而坐。忽然想，也许，我们在时间面前的无奈，同样是时间在我们面前的无奈吧；或者说，时间有着和我们一样的心思——都在寻找美好，想把美好留在最后。","聪明的，继续一起寻找吧。愿我们一路上，开心、安宁。"],"sum":"-"},{"n":72,"c":"光","d":"2015.2.19","lead":"光，是举着火炬的人。人类和其他多数动物的一个区别，是人不怕火并且学会了用火，从此，人类世界拥有了持续的光明，所以，我们不怕在黑夜里前行，因为我们可以在黑暗里一样找到光明，哪怕是一丝丝微光，都可以照亮我们心底藏着的、那随时可以长出来的希望。我们一路同行在奔向光明的路上，再浓的黑暗里，行走时也不会怕孤独，即使我们看不见彼此，也不会担心，伸出手，就可以握到彼此的温暖。","body":["聪明的，相信每一天都是光明的。"],"sum":"光，是举着火炬的人。人类和其他多数动物的一个区别，是人不怕火并且学会"},{"n":73,"c":"诱","d":"2015.3.2","lead":"诱，言语秀美，美丽言语。用说的漂亮美好去引导人，本意是引人向美向善。和很多字一样，“诱”字也没能躲过岁月的尘埃，变得暧昧、沾染邪气，变成诱惑——像那串挂在大象面前的香蕉——变得不再是纯粹的美！说到诱惑，什么是最难以抗拒的诱惑呢？也许，最难以抵抗的诱惑不是金钱权利美色，最难以抵抗的诱惑应该是理想吧——我们很多时候会分不清，那是理想，还是欲望。我们是要真的追求理想，还是追求那个追求理想的欲望? 佛陀讲放下，最难放下的是执念，最难放下的执念也许不是恶念，也许是善念，更也许是所谓理想。毕业十八年后在网上和宿舍二哥谈及共读路遥的那些年轻日子，说到理想，二哥感慨，别跟哥提理想，我已经戒了……。那么，理想都去哪儿了？等不到我们去实现就溜走了吗？ 我知道，二哥说的，是在现实面前的无奈，其实，那些年轻时说过的理想何曾真的离开过他的心底……。在当下这个自然的雾霾和心灵的雾霾同样严重的时代，我们不仅需要改变外在的环境，更需要改变我们内心的环境。","body":["聪明的，别再自以为孤独地行走在那条前进的路上，去寻找到那些还同样藏着理想的人，如果可以，让我们一起陷落在理想的诱惑里吧……"],"sum":"诱，言语秀美，美丽言语。用说的漂亮美好去引导人，本意是引人向美向善。"},{"n":74,"c":"冬","d":"2015.3.9","lead":"周末，开车疾驰在高速上，开着车窗，风从耳边吹过，是热的。高温一直持续，于是，忽然对冬有一丝怀念，想念那场可以让北京变回北平的雪。人类在冬天盼着春天，望着夏天，念着秋天。但是，等到真的迎来，又会觉得春天风沙大夏天太酷热秋天太萧索……。天上的听到这些抱怨，只能哭笑不得地继续按部就班地转动地球。在地球不停转动的过程中，人类似乎正无比接近时间的真相——但其实，我们永远无法抵达。","body":["聪明的，索性，不去想那么多，打开空调，盖上冬天用的被子，想起一首歌的歌词——在夏天冬眠……"],"sum":"周末，开车疾驰在高速上，开着车窗，风从耳边吹过，是热的。高温一直持续"},{"n":75,"c":"春","d":"2015.3.19 — 2022.2.4","lead":"《説文解字》曰：萅，推也；从艸屯，从日，艸春时生也；会意，屯亦声；今隶作春字，亦作芚。白话意为：春，催生；字形由“艸、屯、日”构成，表示草在春天生发；“萅”是会义字，同时“屯”也是声旁；现在隶书写作“春”，也写作“芚”。造字本义：动词，严冬之后，风和日暖，使草木的种子生根发芽。古人根据四季的特征与节奏，总结出天人合一、顺其自然的养生之道：春生，夏长，秋收，冬藏。","body":["曾经奇怪古体的春字，“日”为什么会在草的下面，难道不应该是在草的上面吗？历经几多寒暑，某一年的春天，陪着小宝在公园里疯跑累了，躺在草地上时，忽然明白，“春”，万物奉命于冬藏之日，在三月，将隐藏起来的温暖唤醒，催生出“草色烟光”。冬日终尽，冰河渐融，草长莺飞，绿柳黄花……。希望，总在春天里。","聪明的，在冬天继续行走吧，直到走进春天。"],"sum":"《説文解字》曰：萅，推也；从艸屯，从日，艸春时生也；会意，屯亦声；今"},{"n":76,"c":"融","d":"2015.3.29","lead":"在演变的起点，甲骨文“融”字的字形更简单、却更形象地表达了本义：三只小虫从土丘的洞里爬出来。后来进入小篆的“融”字， 可拆为鬲与虫。春天的大地，像正在烹饪美食的鼎器，热气上升，冬眠的虫蛇被这温暖唤醒……。春天来的时候，冰融，是挡也挡不住的——就像希望一样。聪明的，不管你有什么梦想，一定要坚持住，坚持熬过冬天，就能等到春天。——任何伟大，都是熬出来的。","body":["聪明的，愿你心底的冰早早融化，愿你，心得安详。"],"sum":"在演变的起点，甲骨文“融”字的字形更简单、却更形象地表达了本义：三只"},{"n":77,"c":"明","d":"2015.4.6","lead":"日月成“明”，日升月落，月升日落，在交错的某个瞬间，日月齐放争辉，光芒遍布，世界通透无比，似乎一切可察，恍惚间，苦虑者顿悟，释道相通、与儒相融，遂得大智慧。这一条从外物至内心的推动脉络，每个节点都可以解释出“明”字的一种新意。未来充满无限可能，不同的人做不同的理解；看到不同的远景，有人看到黯淡，有人看到光明。——而奔跑的人们，总会看到光明，哪怕会一路跌跌撞撞、兜兜绕绕。坚持，是我们通往光明的忠实伙伴，也只有坚持，才会对你不离不弃，带你回家。","body":["聪明的，愿你好运。"],"sum":"日月成“明”，日升月落，月升日落，在交错的某个瞬间，日月齐放争辉，光"},{"n":78,"c":"雀","d":"2015.4.7","lead":"“雀”， 小隹，短尾鸟里最小的鸟。雀，喜与人居，或许，说到雀族的骄傲，当属上古传说里四神兽之一的“朱雀”，朱雀主南，赤红色，代表夏季，意属五行之火。千古之下，雀族的一切骄傲都已成了传说，看着在地上蹦跳着觅食、忽而受惊扑腾飞起的身影，探究他们的祖先是否曾经辉煌，似已不再那么重要。历史当然不能忘记，不能用历史虚无主义彻底否定和摆脱过去，回望历史，才能看见未来。但是，我们更不该睡在历史上，不能被历史束缚和牵绊，而是把历史融入前行的脚步，才能更稳健地迈进未来。聪明的，试着做一只敢在风雨中起飞的麻雀，飞到云层上面，寻找艳阳，重新找回骄傲吧。","body":[],"sum":"“雀”，小隹，短尾鸟里最小的鸟。雀，喜与人居，或许，说到雀族的骄傲，"},{"n":79,"c":"跑","d":"2015.4.27","lead":"2015年4月26日，是画这幅图的日期。那天，朋友圈被汪国真先生去世的消息刷屏，满屏的各种评议……。那几天，同时有一条微信也在被热转：窦唯在台上打鼓，还不是歌后的稍显青涩的王菲，用还没那么梦幻的嗓音唱着那句歌词——“也许不必再说”。被遗忘着的，被记住了的，被怀念着的，被议论了的，终究不必再说。谁会活在谁的嘴里，谁会活在自己的世界里。谁会感恩，谁会醒来咬伤农夫，谁会不得不分离，谁会错过便成路人……。还是要感谢现在这个年代，起码，一位诗人的去世让很多人有了瞬间的伤心、有了一段时间对他的怀念以及对诗歌的怀念。想来想去，对一位诗人的最好的纪念，就是继续码字，努力把字码成诗。如果可以侥幸写成了，就不要去管别人怎样议论，文字是流淌的河，无人能够阻挡他的奔腾——只要明天还在，就不会悲哀。从年初开始慢慢恢复跑步，已经成了习惯。","body":["聪明的，让我们一路奔跑吧，一起跑向那看似未知的、但其实我们早已知道的未来……。"],"sum":"2015年4月26日，是画这幅图的日期。那天，朋友圈被汪国真先生去世"},{"n":80,"c":"马","d":"2015.5.26","lead":"日子在一段忙碌接着一段忙碌中度过，白马过隙的匆匆，来不及把每个美好的镜头刻录下来。多想可以有那样一匹飞马，载你我，逆时间的河水而上，捡起每段旧时光装进口袋，像小时候在河边收集美丽的鹅卵石。","body":["聪明的，愿你一直记得，我们举起石子冲着太阳时，半透明的石子里那隐约的纹路，是我们归家的航线——或者，是我们一直寻找的通往未来的征途。"],"sum":"日子在一段忙碌接着一段忙碌中度过，白马过隙的匆匆，来不及把每个美好的"},{"n":81,"c":"夏","d":"2015.6.2","lead":"夏天总是很长，是因为黑夜很短我们醒着的时候多吗？那正好，年华易老，大好时光一定要好好把握、好好利用起来，做些有价值有意义的事情，比如——让我们一起睡觉吧？——嗯哼，好吧，我开玩笑的。我没有什么可以给你，只有手指下不停流出的文字和那些简单朴素的黑白色线条，做夏夜里微亮的星星，为你标引归家的航线。——你好知道，自己一直不孤单。","body":[],"sum":"夏天总是很长，是因为黑夜很短我们醒着的时候多吗？那正好，年华易老，大"},{"n":82,"c":"门","d":"2015.6.13","lead":"门，从相对的两个角度理解，是一种保护的屏障，也是一个进入的通道。秘密会被被门关起来，也会被门放出来。推开一扇门，就会进入一个机会。门的背后是什么？是你想要的，还是你想要逃避的。多数时候我们对门后的事物是笃定的，自以为自己知道门后的答案。可是，我们真的知道？真的可以预见？——然而，我们终归要不断地推开一扇扇的门，去进入一个个新的未知世界。","body":["聪明的，有没有勇气，和我一起去推开那些互联网时代藏起秘密的门，去探究门后的美丽新世界？！你知道，我说的不只是数字出版，我说的是出版的未来；我说的，是人类的未来。"],"sum":"门，从相对的两个角度理解，是一种保护的屏障，也是一个进入的通道。秘密"},{"n":83,"c":"镜","d":"2015.7.21","lead":"镜，金遇光成“景”，先人最早以铜制镜，映出人影，以之为奇。后来虽然材质有了变化，铜镜改为玻璃镜，“镜”字的组成却已不再进化。从照出影像的技术来看，人类所掌握的技术已经进化了很多轮，谁说电影不是一种更复杂的镜子呢？谁说在太空孤独遨游了25年的哈勃望远镜不是照的最远的镜子呢？但是，再复杂再精密的镜子也照不出隐藏在皮囊之下的人性，而能够照出人性的最好的镜子，其实是人啊。","body":["聪明的，你有没有过这种时刻，当我们遇到某个人时，忽然在这个人那里发现自己，像一面魔法镜子照出掩藏在皮囊之下的你，于是，孤独的生命有了期待。而这面镜子是多么难找啊……。"],"sum":"镜，金遇光成“景”，先人最早以铜制镜，映出人影，以之为奇。后来虽然材"},{"n":84,"c":"湖","d":"2015.7.28","lead":"水面上倒映着古老的月亮，这片水，就是“湖”吧。从春天的日内瓦湖，走到夏天的西湖，从匆匆的忙碌走到难得的休假，从战斗状态走到闲散状态，在炎热的夏天找到一丝凉爽的平静。关于湖的音乐，记起刘星的专辑《湖：无知境界》，那旋律，在毕业那年听到，便一直未曾忘记过。包括那些文字：“她从不涌动也绝不流露，无论是在阳光下还是在月光下，我望着她，她平静的不行。”生命中总有很多的放不下，但是一路走过去，总有那么多无奈的离开，很多人和事被迫放在在记忆的角落里，虽然会在某个时刻涌动，但人生的湖面上却始终平静，平静得像似那些故事从未发生过……","body":[],"sum":"水面上倒映着古老的月亮，这片水，就是“湖”吧。从春天的日内瓦湖，走到"},{"n":85,"c":"伤","d":"2015.7.30","lead":"伤，山海经里说，木朿为伤。后来进化到箭矢所伤，再后来便泛指一切创伤。简化字虽然看不出更多的原意，却可以有新的解读：用手握住一个利器，太用力，就会有伤，或者伤了别人，或者伤了自己——而通常我们会两败俱伤，这似乎是个规律吧。从执一器到执一念，执念者也许更容易伤人，也更加容易自伤，皆因太过用力。身处此世，怕的不是受伤，怕的是伤口难以愈合，怕的是伤愈过程的撕扯的痛。然而，人生如此，终归要经历那些无法回避的痛苦，终归要面对那些无法避免的伤口，才能渐渐长大，才能渐渐成熟。直到修炼得内心变得皮糙肉厚，百毒不侵。","body":["聪明的，愿你我都能少受些伤，愿你我早日找到彼岸光。"],"sum":"伤，山海经里说，木朿为伤。后来进化到箭矢所伤，再后来便泛指一切创伤。"},{"n":86,"c":"默","d":"2015.8.1","lead":"默，夜色如墨、犬黑不吠、无声无形、天地静寂。先人造字，蕴藏了独特的哲思与智慧。犬是很早就被驯化做了家畜的，主要的职责就是保家护院，善吠，遇生人狂吠不止，是其拿手一招。偏在“默”字里，使黑犬入夜不吠，全然是一种真空似的安静。当然，世界注定是喧嚣的，找不到这种现实版的绝对的“默”。更多时候，沉默的是人，不是世界。选择沉默的缘由，有心存恐惧惊吓失语的残酷，有互不理解言语无谓的无奈，有哀至心死泪眼无语的悲伤……，当然，一定还有心意相通无需多言的美好！比如现在，我已不想再多说，因我已看见你在对面微笑。","body":[],"sum":"默，夜色如墨、犬黑不吠、无声无形、天地静寂。先人造字，蕴藏了独特的哲"},{"n":87,"c":"香","d":"2015.8.2","lead":"香，本来是“黍”与“甘”的组合。最早的表达，其实说的是米饭香甜。当吃饱了饭的人们发现更多诱人气味时，便用“香”字来泛指这些美好的气味；再后来，人们开始利用各种材料制作“香”，从香料香精，到檀香香水。香，成为一种美好状态的描述，宝马香车佳酿醉，知交美人漫卷诗……。很多时候，香的其实是心境，你若有心，世界之大，随处有香。昨夜电闪雷鸣，暴雨狂风，但风卷西窗时自有雨香入书屋，及至今晨雨停，泥土翻起之香更是沁入心脾。","body":["聪明的，你可曾如我一样欣喜？"],"sum":"香，本来是“黍”与“甘”的组合。最早的表达，其实说的是米饭香甜。当吃"},{"n":88,"c":"恕","d":"2015.8.3","lead":"恕，如心。如者，顺也，如心即顺从心也，当顺何心呢？当顺仁慈心吧。如何解仁慈心，孔子用“己所不欲勿施于人”来说明，这是最早的、朴素的“同理心”吧。子贡的人物设定像是一个调皮的问题儿童，但又是不可或缺的，孔子很多的智慧都是通过解答这学生的问题而表达出来的，正如最近在读的《与神对话》，问答中深藏智慧。恕，仁慈对世界、仁慈对世人。然而人类困惑的是，或许最难的部分，是仁慈对自己。我们如何放下自己的过错过失、不再背负懊恼悔恨、进而宽恕自己？这比宽恕他人，也许更难。当到了终于宽恕自己的时候，一定是找到了救赎。让我们一起寻找救赎之路吧。如此，即使在末日来临时，仍能找到重生的希望。","body":[],"sum":"恕，如心。如者，顺也，如心即顺从心也，当顺何心呢？当顺仁慈心吧。如何"},{"n":89,"c":"悲","d":"2015.8.4","lead":"悲，非心。事与愿违，一颗心至伤至痛，像有人射出一支箭，直没入心，只留箭尾的羽翎。为何而悲？小时候，可能会很简单地是因为吃不到爱吃的那颗糖，长大以后慢慢明白，很多东西不是想要就能得到，道理都懂，事到临头却仍然免不了心痛，和小时候不同的，只是学会了各种掩饰，学会了各种宣泄。“想得却不可得、你奈人生何”，在歌声里的感慨，不过是消减悲伤的一种出口。在生之苦修中，该如何学会慢慢放下，起步向更高的地方去走？愿，不再悲秋扇、悲别离，不再被自我的小悲伤缠绕，努力让心无所羁，以悲生慈，以悲生爱，以慈悲心观世界、观万物，让吾心终得宁静。","body":[],"sum":"悲，非心。事与愿违，一颗心至伤至痛，像有人射出一支箭，直没入心，只留"},{"n":90,"c":"怒","d":"2015.8.5","lead":"怒，本意是长期受压迫的奴隶发火了，不干了。渐渐演变为七情之一。修行者，要直面七情、求彻悟。该如何拆解，是心之奴，还是以心为奴？意即，是该做内心的奴隶，还是该去奴役内心？说到底，在于我们的本心是什么，本心是否强大。怒是种情绪，本无关善恶，但若放任怒的情绪，人便极易入恶道。所以，制怒、止怒一直是修行者努力修炼的。","body":["聪明的，近来天气热，就更要制怒止怒了。"],"sum":"怒，本意是长期受压迫的奴隶发火了，不干了。渐渐演变为七情之一。修行者"},{"n":91,"c":"悦","d":"2015.8.6","lead":"“悦”是心的兑换。我们用心兑换的是什么？兑换也是一种交换，我们用心彼此交换的又是什么？在这个群里，朋友们每天都在交换彼此的思想与爱意，兑换彼此的承诺和自己对自己的承诺，兑换的是一种坚持。“悦”，也是无以言表妙不可说的、一种高兴的情绪状态，是每天中午的“欣然一笑”段子时光，也是看到某段话忽然顿悟得以解脱、听到某段音乐忽然觉出天地静寂得以安宁，生出发自内心深处的喜悦。","body":["聪明的，祝我们的“晓一·大书悦读会”微信群百天快乐。喜悦常伴阅读者，悦与读同在！"],"sum":"“悦”是心的兑换。我们用心兑换的是什么？兑换也是一种交换，我们用心彼"},{"n":92,"c":"悟","d":"2015.8.7","lead":"“悟”是用心找到自己，找到自己的本心。三藏初见石猴，送给他的名字是佛门最难的作业，悟空，四大皆空、五蕴皆空，哪里那么好参透？！一路向西，斩妖除魔，悟空却越来越世故，我总怀疑这猴子其实看透了很多事情，故意不出够力——特别是在打死白骨精反遭遣之后，看着远不如大闹天宫的大圣来得恣意，小时候看西游至此总觉不爽。直至长大，工作诸多碰壁，明明可以简单直走却非要绕行甚至退两步进三步。慢慢才知道，原来入世修是最难。也许三藏才是最用心良苦的那个师父，以他金蝉子转世之身，未见得就是表面那么迂腐，洞察世故而后不落入世故窠臼，才是真正的悟空吧。所以，最终封了他个斗战胜佛也好什么其他名头也好，猴子已经不在乎了，以本心找到本心的过程中，他已真正成佛。","body":[],"sum":"“悟”是用心找到自己，找到自己的本心。三藏初见石猴，送给他的名字是佛"},{"n":93,"c":"困","d":"2015.8.9","lead":"原谅我昨天没有更新，什么？为什么？连续出差连续熬夜，实在是困呐。好吧，今天说“困”字。“困”字本意，是荒废的屋子，都长出树来了，屋子显然是荒废了——当然，造字的先人肯定没想过后世的张大民同学会那么智慧地让一棵原生的树真正长在屋子里。于是，没有被生活的各种艰难困住的大民，就这样愉快地和妻子云芳儿子小树一起在这样特别的长着树的床上每天幸福地“困觉”。生活总是愿意跟我们开玩笑——他以为那些都是玩笑——他像个不涉世的孩子，把我们当做他的玩具，给我们设置各种关卡和障碍，还逼着我们前进通过。我们不小心就会陷入生活设计好的困境，在无谓的抵抗后困意萌生，索性放弃，沉入长眠。然而，诸多的作家用他们的文字传递着一种力量，面对困境，我们总该有所抗争，再不济也应该有我们的想法、有我们的姿态。然后，人类在这样的拧巴的过程中，找到自己、找回自己，重新生长、继续生长。","body":["聪明的，愿你可以不被那些困苦困在原地从此不前，愿你，早日找到、随时可以找到脱离困苦的那条小路，去发现真正的幸福光明。"],"sum":"原谅我昨天没有更新，什么？为什么？连续出差连续熬夜，实在是困呐。好吧"},{"n":94,"c":"丝","d":"2015.8.13","lead":"丝，源义为蚕丝，后来引用到各种细长的、但是形状各异的不同材质上，也包括用在“丝竹之音”的丝竹上；“丝”的纤细赛毫，又被当做度量，一毫米可以再分出十“丝米”，所以才有了“一丝一毫”、“细若游丝”的说法。蜘蛛在角落里忙碌，吐出的蛛丝虽然纤细柔软，却韧性十足，一旦被蛛丝缠绕困住，便难以脱离。小时候的我是不喜欢蜘蛛的，不小心被缠上的时候就更不喜欢了；后来，看过《夏洛的网》，对蜘蛛有了不同的感觉，再看见蛛网便总要仔细看看，试图在层层叠叠的网中找出密码；再后来，大学里有个女孩告诉我，在她们老家，人们认为身上掉个蜘蛛、抬头撞上蛛网，都是代表好运要来；再后来，这女孩做了我的妻；再后来，我们把夏洛的故事和江南乡下的传说都讲给了小宝……。","body":[],"sum":"丝，源义为蚕丝，后来引用到各种细长的、但是形状各异的不同材质上，也包"},{"n":95,"c":"远","d":"2015.8.29","lead":"昨晚是中元节，是佛道俗三界共同认定的鬼节。想到“遠”字，再远的距离怕是也比不过阴阳相隔的无奈。走过这么多年才知道，原来最遥远的，不是距离，不是时间，是“无奈”两个字……。远字，在甲骨文里很复杂，字形字义大概分做三部分，抓+衣服/包裹+行，想象一下，匆忙抓起几件衣服出门去，像不像现代的我们，不停地出差，行李箱打包技巧越来越高越来越熟练，我们不停地飞来飞去，去到各个小时候只能在地图上找到的远方，回望故乡和家，是无奈的回不去的远方……。","body":["聪明的，不管你现在身在何方，愿你和你的家、你和你的爱，无间。"],"sum":"昨晚是中元节，是佛道俗三界共同认定的鬼节。想到“遠”字，再远的距离怕"},{"n":96,"c":"战","d":"2015.8.30","lead":"《説文解字》曰：戰，鬬也。从戈，單聲。白话意为：战，战斗。字形采用“戈”作边旁，采用“单”作声旁。","body":["戰的字形，大抵代表了古代士兵战斗装备的标配，持弹（弹弓）持戈而立，随时准备拼杀。后以“佔”替“弹”，表意更进一步，多了占领之意。所有的战争，无外乎是对资源的争夺、抢占。针对的资源既包括物质资源，也包括信息资源。能够被认定为值得争夺的、有价值的资源，都是能够产生能量的资源。","对个体而言，一生之中，总要面对各种挑战。我们从来都是在拧巴的过程中，经历过痛苦、撕裂、重塑，完成一次次的成长。每一次迈过人生的沟沟坎坎，不亚于一场战斗。而我们正是在这样一次一次的战斗中，不断突破自我，获取新的能量。","聪明的，愿你一直有勇气和智慧，面对所有的挑战；祝你能够走出困住前行的一座座围城，赢得每一场战斗。"],"sum":"《説文解字》曰：戰，鬬也。从戈，單聲。白话意为：战，战斗。字形采用“"},{"n":97,"c":"和","d":"2015.9.4","lead":"“和”字，原意是吹响禾管（早期的乐器中，禾管即是后来排笛的雏形），不同长短的禾管吹出来的声音虽高低不同，但依然会形成美丽的和声。“和谐”二字中，“和”字更注重不同声音的协调，不同观点的融合共鸣；“谐”字则更强调同声同意的统一。“和”字，或可拆为“千人口”，千人之口千人意，想想就觉得嘈杂，像极了现实世界，但是这“千人口”却最终装在一个字里，彼此相安无事，体现出中国人的智慧。和而不同，是“行君子之道而成大同世界”之本意。和平的基础，不是所有人在所有问题上观点一致，而是只在一个问题上观点一致：我们注定会不同，但世界恰因这种差异性而存在且存在得十分美好；我们彼此无法绝对征服和改变对方，但我们仍然彼此相爱且因彼此的不可改变而爱得幸福。","body":["聪明的，让我们学会尊重彼此、珍爱彼此，永处“和”之界。"],"sum":"“和”字，原意是吹响禾管（早期的乐器中，禾管即是后来排笛的雏形），不"},{"n":98,"c":"智","d":"2015.9.13","lead":"在造字之初，人类还处于必须靠真正的战斗能力才可以存活的年代，“智”字本身就是对战斗很熟悉的人，是最早期可以把战斗经验提炼到理论高度的人：一只箭（矢）如何准确射中目标（日），可以准确说出来（口）。在漫长的岁月里，“智”，渐渐成为超级厉害的一个字，代表着最高修炼层级的“智仁勇”三个方向之一，后世解字，也多从新意去解这个“智”。所以，如果我们回到原始的意思去理解，“智”其实是“经验的有效总结与归纳”，将具体的、具象的、无序性的“经验”总结为抽象的、符合一定逻辑的、可以复用于新领域的、规律性的“知识”，这是人类之所以成为高等动物的根本能力，也是我们进入宇宙智慧形态的起点。","body":["但是，长期以来，人类的视野仍然不足，活动空间有限，经验采集样本量仍然极低，而且对样本的收集汇总水平过低，大量样本流失损耗在经验总结过程中。因此，人类空具备较高的知识转化能力，却缺少足够的经验支撑——我们的知识转化能力一直高于经验汇总能力。","好在，我们发展出数字技术和互联网这种东西，有了对世界产生新的认知方式的可能。人类整体的经验汇集能力在加速度提升，对于知识转化必将有所质的飞跃。能够达到我们当下智力水平——知识转化水平的人工智能肯定会出现。我并不担心AI造反这种好莱坞大片里的场景，因为到那时，人类必将进入到新的、更高的“智”的层级了。"],"sum":"在造字之初，人类还处于必须靠真正的战斗能力才可以存活的年代，“智”字"},{"n":99,"c":"晴","d":"2015.9.19","lead":"今天是晴天吗？“晴”，丽日青天相映衬，云少风和。“空山新雨后，天气晚来秋。明月松间照，清泉石上流”。王维的素描手法要在繁华市井转上一圈后才能体味出好来，不着一晴字却分明是晴。 世间晴好，人便情好，古人没有那么多外物干扰，更注重与天地感应，晴自与情相通。“道是无晴却有晴”字字说天，却分明在说两情。","body":["聪明的，愿你，岁月晴好。"],"sum":"今天是晴天吗？“晴”，丽日青天相映衬，云少风和。“空山新雨后，天气晚"},{"n":100,"c":"爱","d":"2015.9.25","lead":"“爱”是无以言表、妙不可言的。看字的演变，一直觉得最早的“爱”字字形，是对着耳朵轻轻呵气、轻声呢喃。后来慢慢变成“愛”，是彼此同心的两个人，十指相扣、绥绥而行。在漫长的演变历程中，“爱”的意思也越来越广泛。包括了对自然的爱、对爱人的爱、对文字的爱……、对一切美好的爱。“爱”，是早晨醒来看见枕边正在做鬼脸的我、你忍不住上扬的嘴角；是中午走过草坪看见一只不怕人的晒太阳的懒猫、你冲着猫的微笑；是女孩走出地铁口发现下雨、旁边害羞的大男孩递过来的雨伞；是让你忽然心生安宁与欢喜的一句话、一段旋律……。","body":["聪明的，愿你，可以一直保持对这世界充满有温度的爱；愿你，可以一直有爱相随。"],"sum":"“爱”是无以言表、妙不可言的。看字的演变，一直觉得最早的“爱”字字形"},{"n":101,"c":"晓","d":"2015.10.8","lead":"“曉”，日上中天天始明，天亮了。堯（yao）字，头顶“垚”（三个、很多的陶器，古字土与陶器是近义）的人，指向的是头顶这个“高”处。太阳升起来可以照到头顶了，此时，天应该刚刚亮透，但是月亮还看得见，所谓晓风残月，是为“晓”。假期，基本宅家，中间进山休了两天，几乎天天懒到“晓”。虽然早早醒了却不用急着起来，拉开窗帘看着窗外发呆、胡思乱想。一年之中，难得有这样的时光，可以暂时放下工作。反而，得以跳出来去回顾平日里陷入的细节，再以跨界、关联的方式，试图将诸多领域知识贯通一处，重新审视，竟豁然开朗，原来一直忽略了很多暗藏的可能。几日下来，自觉又多了一些洞晓，遂觉意满。聪明的，我们都该学会休息，偶尔放任，让时光貌似随意地流逝，去洗掉蒙尘，让心自在行走，方能通晓万物。而这休息，终是为了可以走的更远。","body":["聪明的，愿你我早日参悟、破晓。"],"sum":"“曉”，日上中天天始明，天亮了。堯（yao）字，头顶“垚”（三个、很"},{"n":102,"c":"怕","d":"2015.10.12","lead":"“怕”，是心底发白，心底慌慌的，不知道该怎么做，而最终无为。我们从小到大，其实一直都伴随着“怕”字，而多数的怕，是因为无知而产生的恐惧，我们很少怕有形的东西，更多时候怕的是无形的不可知。但是，我一直觉得，“怕”并不是负面的词，知道害怕，是要比不知道害怕好得多。无知者无畏，当下这个时代，不缺这种“傻大胆”式的人物，甚至还被当做有勇气的象征。但事实上，承认自己的无知、承认自己因无知会产生恐惧，需要更多的勇气。","body":["聪明的，我愿意和你，一起在知识面前做“胆小鬼”，我更愿意陪你，一起去探索无知地带，虽然我们总还是有些害怕，但并不妨碍我们成为英雄。"],"sum":"“怕”，是心底发白，心底慌慌的，不知道该怎么做，而最终无为。我们从小"},{"n":103,"c":"想","d":"2015.10.17","lead":"想，相入心。那么，是因为你想念一个人，她的样子就会进入你的心底；还是因为她本来就在你的心底，所以你会不停地想到她的样子? 安静地想念一个人，甚至不告诉被你想念的这个人你正在想着她，那该是怎样安静却又美好的一种情愫。在这个交通和信息通讯技术发达到已经没了距离和隐私的年代，我们几乎丧失了“安安静静想念一个人”的美好。但是，不管怎么说，那些爱并不会变，那些想念仍然是那么真实。","body":["聪明的，现在的你在想着谁？聪明的，愿你可以一直享受“安静地想念一个人”的美好。"],"sum":"想，相入心。那么，是因为你想念一个人，她的样子就会进入你的心底；还是"},{"n":104,"c":"赢","d":"2015.10.19","lead":"关于“赢”字的解读很多，拆成五个字去分别组成一些说法，直指所谓人生目标等等。而“赢”字最早，或该是指：乘舟拾贝、满载而归，是一种简单知足的乐享状态。中国古代轻商不愿言利，“赢”字更多用在非经济贸易领域，用于攻城掠地的天下输赢。至现代特别是当代，在经济社会一片“大发展与繁荣”形势之下，成功学当道，重新解读的“赢”开始成为人生目标。可是，人生的真正输赢、以致人类的输赢，谁来判定呢？聪明的，愿你在那些嘈杂声里还能及时醒来，不要入了小输小赢之道。","body":["聪明的，愿你真正成为可以掌握自己的赢家。"],"sum":"关于“赢”字的解读很多，拆成五个字去分别组成一些说法，直指所谓人生目"},{"n":105,"c":"累","d":"2015.10.31","lead":"说到“累”字，很多人看到的是上有老下有小的中年人的惨淡现状，被房子孩子上下所累（四声）。但“累”字的源义，是对堆积结果的统计，是对劳动付出成果、事物发展结果的统计：“田”由“垒”演变而成，“系”是记事统计用的绳结。所以，“累”本来是说取得的成绩。好在我们现在还有“硕果累累”（三声）这个词，提醒我们，只要有辛苦劳累的付出，一定会有累累硕果；反之，若要有累累硕果，必须不怕劳累！当然，我们还要学会淡然对待“累累”硕果，不要被其所“累”，要学会宠辱不惊，随时可以放下那些身外之物及其带来的新名头。聪明的，希望咱们都能在岁月里有所积累（三声），但又都不会被“所求、所得”牵累，不会被“欲望和害怕失去”所牵累。","body":["聪明的，周末好好休息一下吧。"],"sum":"说到“累”字，很多人看到的是上有老下有小的中年人的惨淡现状，被房子孩"},{"n":106,"c":"睡","d":"2015.11.27","lead":"原谅我这一个月的懒惰。十一月，意料之中的忙碌，所以，睡一场好觉已经有点奢侈了，更别提坐下来安心画幅小画。好在，所有的思考与忙碌已渐渐有了成果、有所收获。“睡”字，双目下垂，打盹休息。“睡”与“眠”都是闭目休息，但是细分起来，睡是浅层的打盹休息，眠是倒下去、横卧着闭目、不再思虑的彻底休息。古人以睡梦入词抒意的不在少数，李太白梦游天姥山留言，“且放白鹿青崖间，须行即骑访名山。安能摧眉折腰事权贵，使我不得开心颜！”之后，陆放翁说，“不如睡乡去，万事风马牛”，宁可“不博万户侯”，也要“是时一枕睡”。你看，都是典型的好睡觉的大懒虫，睡觉比天大，开心比天大。聪明的，看来忙碌的我们还要再修炼，不如先从放下一切好好睡一觉开始试试看？只怕，一梦春秋过，再醒已他乡。","body":["聪明的，愿你每天睡得好，每天开心。"],"sum":"原谅我这一个月的懒惰。十一月，意料之中的忙碌，所以，睡一场好觉已经有"},{"n":107,"c":"错","d":"2015.12.31","lead":"“错”，本义是用金粉涂抹器物，原义更接近于“镀”。岁尾年根，我们用各种总结来回顾一年的得失错漏，为那些小成就沾沾自喜，也为那些小错误懊恼不已。然而，等一下，到底什么才是“错”？行走的路上，我们习惯对每一次的选择做出对错判断，却不知道，很多对错本就难以界定。也许，不去犯错的错，才是更大的错；也许，错过的错，才是最遗憾的错。所以，聪明的，不必纠结在对选择的计算结果上，唤醒初心，大胆行走，不再错过机会，勇敢试错。聪明的，愿我们在未来的某一天回忆起今天时，所有的往“昔”都闪耀着骄傲的“金”色。","body":["聪明的，新年快乐。"],"sum":"“错”，本义是用金粉涂抹器物，原义更接近于“镀”。岁尾年根，我们用各"},{"n":108,"c":"病","d":"2016.2.5","lead":"公众号停更、消失了一个月，主要是因为忙碌以及顺便生病去了。病字本义，内患外显，致人卧床休养。须知，内患显露也是好事，若久患不发，日积月累，积重难返则更加致命。病字引申义，指渐无生机。沉舟侧畔千帆过，病树前头万木春。万物生、万物灭，历史更替，谁也逃不过自然规律。无常为常，变恒不变。一年又一年，旧岁去、新年至，似鱼衔尾、循环往复，却又每每都有新气象。病，是人身体的自我修复，强迫你休息，换换新的细胞。恰似出版业，显露出的是种种病症，而需要处理的，其实是内患。变的是形式层面的技术与模式，不变的是本质层面的原理与价值。聪明的，生病不可怕，怕的是不知病理、不知如何对症治疗。新的一年，咱们一起医治这个古老的行业吧，咱们中西医结合、用药外敷内服，以通气血、以活经脉。","body":["聪明的，愿你今年不生病，愿出版业早日焕发新生。"],"sum":"公众号停更、消失了一个月，主要是因为忙碌以及顺便生病去了。病字本义，"},{"n":109,"c":"归","d":"2016.2.6 — 2022.1.30","lead":"《説文解字》曰：歸，女嫁也；从止，从婦省，“追字去掉走之底（Duī）”聲。白话意为：归，女子出嫁；字形采用“止”和“帚”作边旁，采用“追字去掉走之底（Duī）”作声旁。造字本义：动词，边境方国顺服中央朝廷，获得军政授权。“归”的繁体字为“歸”，写法比较接近篆书字形，承接了金文。左边的字形，上面是兵符之意，下面是“止战”之意，字义为，异域边疆顺服中央。后世衍生出多层意思，最常用的多是取其“回归、回转”之意。","body":["时下，似乎最难的就是思想与文化上的“归”。我们从何而来、归向何处？我们要在怎样的时间起点和历史的纬度上去确定“归”的方向与终点？中华文化在历史上的几次断层，该如何修补，才能铺就归家的路，回到真正属于我们的故园，得以安放四处寻找却一直漂泊不定的精神之魂。中国梦，不该是虚幻的，一定是对安详、美好与辉煌的真实回归。愿我们在寻回精神家园的归乡路上，一路好运。让中华文明焕发新生，以中国人独有的天人合一、水融万物的智慧，止战，顺和天下。","聪明的，更愿你心内平静，一路平安喜乐，所行前方，桥都坚固，隧道都光明。新春快乐，幸福安康。"],"sum":"《説文解字》曰：歸，女嫁也；从止，从婦省，“追字去掉走之底（Duī）"},{"n":110,"c":"缘","d":"2016.2.7","lead":"“缘”字，按照《说文解字》，接近“边缘”的意思，解释为“衣纯也”，即装饰的衣边。之后延伸，有了“沿着、顺沿”的动词义，也有了表明“关系密切至天意所属”的名词义。向前追溯，“缘”的甲骨字形是很形象的，可以看出是在用绳子捆住动物的嘴，以驯服。缘，其实说的是关系问题，姻缘、缘由，缘木求鱼、缘愁似个长、绿萝缘玉树，其实都是在讲事物之间的关联关系。互联网发展到今天，更加注重的，是如何在万物之间建立联系，此“物”，既包括实体物，也包括虚拟物（信息）。所以，互联网、特别是移动互联网，最终是要实现人与世界的紧密相连，让人类的每个个体都在一个广义的“缘分”范围内彼此依存、彼此相爱。聪明的，既然我们有缘相识，就结伴而行，如何？新春吉祥。","body":["那么，我们该如何管理“缘”、即如何管理关联关系呢？标识，是基础，赋予一种特定关系一个编码，这就是对关联关系进行标识的编码。嗯哼，聪明的，你已经猜到了，我说的是，由中国人提出并且被ISO发布为国际标准的ISLI国际标准，全称是国际标准关联标识符（International Standard Link Identifier ）。","聪明的，2016年，我们会全面开展ISLI标准的推广工作。希望你来支持哦！"],"sum":"“缘”字，按照《说文解字》，接近“边缘”的意思，解释为“衣纯也”，即"},{"n":111,"c":"生","d":"2016.2.16","lead":"“生”，字形非常简单明了的一个字。春至，草从地上探出头，一时，草色烟光，春意渐浓，万物恣意生长。先人对于世界如何而“生”的认知很透彻。周易讲“易有太极，是生两仪，两仪生四象，四象生八卦。”老子说：“道生一，一生二，二生三，三生万物。”道德经中还提及，“道生之，德畜之，物形之，势成之”，建立了一种循环模型的世界生成论。西方文化与科学好假外物，善用工具，是“向外”的。中国传统文化与科学则认为，宇宙进化的高级产物是人，遂以人为隐喻，将人的生命作为理解世界的模型，以人比万物，是“向内”的。世界一直在发展，人类也在不断变化。文明，是在进步还是在倒退？人对世界的感知能力是在提高还是在减弱？如果离开工具，我们与世界对话的本能、我们对世界的感悟力还剩多少？刻在石头上的字可以存续千年，存在电脑硬盘里的字可能倏忽不见。人类制造出的强大核能却可能瞬间摧毁人类。现代科学让人类“越发达越脆弱”的悖论如何破解？世界会走向何方？未知生、焉知死，溯源而上，也许我们出发去寻找未来的地方，就一直藏着终点的答案。","body":["聪明的，让我们一起，在春天里寻找思想的新“生”。"],"sum":"“生”，字形非常简单明了的一个字。春至，草从地上探出头，一时，草色烟"},{"n":112,"c":"种","d":"2016.3.17","lead":"“种”，最早的金文写作“穜”，“童”（男子）在田地里劳作，而后背负一捆“禾”归来，是漫长的培植并期待收获的过程。后来从小篆到楷书的进化中，演化为“種”。简体字用了同音的“中”字。今天推送的内容中有一张照片，是小宝和宝宝妈、外婆一起种“庄稼”的场面。小宝的学校给孩子们发了很多种子，鼓励大家种起来，大抵是希望孩子们切身感受一下“春种秋收”吧，想来很多家长会很无措。幸亏我们家有好婆这个专业农民在，简直是牛刀小试，三下五除二，齐活。然后呢？各位，咱们一起等到收获吧，据说种下的是油菜籽哦。春天，的确是播种的好时候，王维有句“条桑腊月下，种杏春风前”，你在春天种下什么就会在秋天收获什么。你种下浮躁，就会收获肤浅；你种下懒惰，就会收获贫瘠；你种下无知，就会收获无措；你种下自大，就会收获摔跤……。如果，我们种下沉静，就会收获安宁；我们种下辛勤，就会收获回报；我们种下虚心，就会收获知识；我们种下谦卑，就会收获高贵……。小宝和他妈妈打算今天再埋一些蔬菜种子下去，我则打算种些希望在工作里、种些美好在生活里。","body":["聪明的，你呢，你打算种些什么呢？"],"sum":"“种”，最早的金文写作“穜”，“童”（男子）在田地里劳作，而后背负一"},{"n":113,"c":"惑","d":"2016.3.23","lead":"“惑”，乱也，心乱，心的意念不明确。中国人喜欢说四十不惑，其实，当初孔子说“四十不惑”时，是在讲自己在四十岁前后达到的一种境界，可以不被外界事物所迷惑，不会被内心各种不确定的念头所困惑。圣人所谓，并不是一个硬性要求，后人却多会被这个词困扰，努力想要在四十岁前证明自己已不再困惑，方才能够安心步入中年。但是最近，根据人类生命延长的总体趋势，教科文组织已经确定“四十五岁”才开始进入中年，那么以后我们是不是该说“四十五不惑”了？《庄子.天地》篇中有云：“知其愚者，非大愚也；知其惑者，非大惑也。大惑者终身不解……”。知道自己愚昧无知的，不是最愚昧的；知道自己有所迷惑的，不是最迷惑的。真正迷惑的人，一辈子不知道自己是迷惑的。所以，聪明的，不用担心你一直觉得自己有些迷惑，这也许是一种更聪明的自我认知态度。惑与不惑，关键还是在内心。","body":["聪明的，愿你能够找到属于自己的某种特定方法，可以和自己对话，让内心找回初心，不被外物所扰，真正做到知惑、知不惑；然后，自今日起，不惑。"],"sum":"“惑”，乱也，心乱，心的意念不明确。中国人喜欢说四十不惑，其实，当初"},{"n":114,"c":"变","d":"2016.4.6","lead":"“变（變）”的繁体字很复杂，上半部取音取形，是“恋（戀）”的本字，下半部取形，表示打破的意思。本义是相恋双方违背誓言，结果长期进化后成为“更改、演化”之意，这也是“变”这个字的宿命吧。年轻时学哲学，讲到世界规律，变是绝对的、守恒的，不变是相对的、短暂的。认识到这一规律后会有很大的疑问，以人生之短，该如何认知变、应对变呢？《荀子·儒效》言：“千举万变，其道，一也。”《庄子·天下》说：“不离于宗，谓之天人。”由此，我们祖先的大智慧，可见一斑。面对日新月异的世界，我们如此渺小，不得不承认，“个体的认知是有局限性的”，我们总要不断怀疑自己、打破自己，用不断地学习改变内在的自己，才能坦然迎接外部变化、拥抱变化。然而，大道至简，总有些规律是不变的，我们也要在变的同时保持一些不变。聪明的，让我们一起踏进奔流不息的时间之河，以不断的变化去顺应世界之变，随波逐流；一起沉入时间之河的河底，寻找千变万化的表象之下、暗暗涌动的规律潜流，定心定思。","body":["聪明的，我们都会变，我们又始终不会变。","P.S.一个具体的个体人，每天都在变，物理上与生理上的，思想上与精神上的。但当要指认一个个体的时候，始终都是这个人自己。"],"sum":"“变（變）”的繁体字很复杂，上半部取音取形，是“恋（戀）”的本字，下"},{"n":115,"c":"洲","d":"2016.4.30","lead":"“洲”的本字是没有三点水的“州”。世事变迁，川流不息，泥沙俱下，在河“川”中央冲积而成一片土地，对人类这种陆生物种而言，便是绝佳的栖身之所。人是陆生动物，所以，长年航海的水手，看到哪怕是一小片陆地时都会激动不已，那是骨子里的本能。《说文》释义：昔，尧遭洪水，民居水中高土，故曰九州。看来，关于史前曾有大洪水的说法，怕不只是传说，古今中外都是趋于一致的。经历了大洪水的诺亚，用方舟拯救了地球物种，最终也是靠鸽子衔来橄榄枝，判断出陆地将近。","body":["地球是个水球，陆地面积不足30%，所以如此看来，所谓“九州”，不过是在广阔的海洋中互相独立却又互相纠结的九块小小陆地。人类穷其全力，对地球而言，也不过是“偏安一隅”的生命，哪是什么世界的主宰呢？认识我们的渺小，才会有对地球、对宇宙、对整个世界的敬畏，才会清醒地认识自己。","聪明的，我们经常会茫然地行驶在四顾苍茫的人生大海上，那么，请别放弃，相信，前方总会有绿洲等着我们，哪怕是很小的一片。聪明的，愿你能早日找到属于自己的那片绿洲，栖身休养，快乐无比。聪明的，好运。","P.S.","这个春天，要参加好几个婚礼。","有兄弟的，有业内朋友的，还有小宝妈同事的。","家是什么？该是我们栖身的绿洲吧。","祝愿所有已经成家、即将成家的孩子们，幸福。","愿你们：春风满汀洲，双影云上飞。拥眠不觉晓，情中日月长。","百年好合，千秋万代啊！哈哈哈哈……"],"sum":"“洲”的本字是没有三点水的“州”。世事变迁，川流不息，泥沙俱下，在河"},{"n":116,"c":"诺","d":"2016.5.3","lead":"诺，本字为“若”，为象形字，从甲骨文的字形看，是高举双臂理顺长发的女子；字入小篆时，将长发女子改成了举着新鲜的草（菜）的女子，其“顺从、答应”的意味少了，便再加“口”字成“喏”，加“言”字为“诺”。一诺千金的古风，随着世风日下而渐渐成了传说。原本我们已经到了以德修身治国的境界，却跌落到需要重新捡回基本规则、重构社会基础架构的现世。承诺，看似说给别人，其实是给自己的。坚持，的确很难；可是，放弃就很容易吗？从一件小事开始放弃，很容易，直到每一件事都放弃，最后会有很疼的那一天，再去重头捡起，该会更难吧？所以，今天所有的坚持，都是在为将来。","body":["聪明的，可愿与我一起，承诺给我们自己，一个美丽的未来。","中国古人讲究“一诺千金”，多是从侠义、道义层面，小时候学语文课文，那个没有得到撤退命令就一直不肯离开放哨岗位的傻孩子，也还是仅仅停留在遵守诺言的层面。我们的“诺”多是为道德所诺，很难见到因“规则”所诺，为“契约”所诺。但是，只靠道德约束实在是适用于社会治理高级阶段的，用规则约束、法律约束来治理社会的阶段，是无法绕过去的。规则视同无形，契约避而不讲，社会上上下下，庙堂江湖，全凭信义人情，全靠道德约束，久而久之，一旦掌权者德不配位、百业者唯利是图，即便位至长老、富至富榜十甲者，仍蝇营狗苟，难免江河日下，一盘散沙。强调规则的重要性，不是说不讲信义道德。回到“诺”字，不如我们先从小“诺”做起，从一件一件小事做起，从对职业的敬重做起，按照规则做事。如果没有规则，我们先确定一个如何确定规则的规则，再去逐一落实各种规则，以此为诺。","聪明的，可愿与我一道承诺，守则，守信，守道，守义。"],"sum":"诺，本字为“若”，为象形字，从甲骨文的字形看，是高举双臂理顺长发的女"},{"n":117,"c":"信","d":"2016.5.16","lead":"信，原义为“人言”，表示开口说话，引申为许诺。随着人类对语言表达的记录能力的不断增强，“信”的字义增加了，用一定的语言表述后、按标准的符号书写下来（字）、固定在一定的载体上（从龟壳到纸）、装入特定的封装（信筒信封）封起来只有收件人可看的，一种点对点的内容传递方式。随着信息技术的发展，我们已经很少再用手写信，甚至连电子邮件（电子信）都很少写；然后，更年轻的孩子们，连需要打字的短信都很少用，而是直接抓起手机发一段语音微信。这世界上的人与人之间的联系，似乎越来越方便，人与人之间的信息距离越来越近；但又似乎，我们在越来越远。手机似乎绑架了我们，面对面坐着，却也要发信息聊天。聪明的，可不可以试着，每天回到家里放下手机，去和家人面对面地聊聊天？让我们互相看着彼此的眼睛，感受通过屏幕看不到的、只有在目光里才能看见的，那如水般流动的爱意。","body":["P.S.在引入“information”这个外来语时，最初的翻译者，便想到了“信息”这个词。信字与息字连用，大约是在南北朝之前，含义本为“消息、征兆、心思意念”，后来引申为对事物的描述。"],"sum":"信，原义为“人言”，表示开口说话，引申为许诺。随着人类对语言表达的记"},{"n":118,"c":"义","d":"2016.6.5","lead":"義，本义是一种占卜仪式的结果，古人的战争讲究是否符合天道，義字以“羊”象形会意为美好、为祥和，以“我”象形会意为大戌、为出战。巫师把几根羊拐骨抛向空中，念念有词，羊拐骨滴溜溜旋转站住，巫师双眼发光，回禀大王，此战为天意所属、正义之战。武王披甲登车，大军伐纣，气吞万里。后世起事者，多举“义”旗，都是在表明自己的行动是在“替天行道”、“奉天之命”。在演变之后，被引申为公认的道德、真理、行为，强调“公认”的文字内涵，强调普遍性和客观性。然而，千万别简单地把“義”理解为是客观存在，在人类社会中，所有的客观真理最终要靠人的主观认同的一致性来确定。所以说，“義”字好写“義”旗好举，真正的“義”却总是藏在表象之下。人类脱不开动物性，当人类的理性特征形成的最高秩序规则出现群体性失控时，每个人的动物性都会被激发出来，个体的主观认知会被裹挟在群体的混乱中，“公认”的“義”也会有不符合客观规律的时候，所以孟子才会有“舍生取义”的讲法。如果大家都认知一致了，干嘛还非要用献身去求呢？聪明的，愿我们每个人都能够尽力保持清醒，在每一次发起争战之前，不管是多大规模的争战甚至是一次小的争论争吵，都能真正问问，是否合“義”。","body":["聪明的，愿我们的每次出征，都是吉兆之战。"],"sum":"義，本义是一种占卜仪式的结果，古人的战争讲究是否符合天道，義字以“羊"},{"n":119,"c":"颜","d":"2016.6.15","lead":"颜，从字形拆开看：彦，是指古人刻画在崖岩上记录战争或狩猎活动的、带色彩的符号；页，是人的头部，可以延伸为脸的意思。颜，是刻在崖岩上的人脸，后来逐渐演变为专指“眉目之间”的含义。一种有趣的理解是，很久以前，人类就有想要将自己的容颜刻画下来、亘古不变老的愿望。然而我们都知道，哪有不老容颜呢？千年以降，众多奢望容颜不老追求生命不朽的都失败了，而真正在奔流不息的历史长河里存留下来的，从来不是人类的肉体，而是人类的文明，人类的精神。那些刻在崖岩上的符号，是对人类最早的文明萌芽的记录，那些在族群里负责刻画的人，可以理解为是最早的出版人吧！出版业，是记录人类容颜变迁的行业，是对人类文明进行描述、记录、沉淀的行业，是人类文明的积累入口；出版业，更是启发后来者创造新的文明、激发智慧创新的出口。在新的技术时代，出版人，要用更多的智慧，去记载下我们这个时代的人类容颜……。","body":["聪明的出版人们，加油哦！","P.S.今天这篇公众号文章，已经被施了魔法，转发吧，可以增加颜值，","谁转谁漂亮。"],"sum":"颜，从字形拆开看：彦，是指古人刻画在崖岩上记录战争或狩猎活动的、带色"},{"n":120,"c":"葵","d":"2016.6.23","lead":"甲骨文的“癸”字甚是好看，是四角对称的图案，许慎解“癸”，水从四方流入地中之形，指事表意为方位。而癸字被假借、入十天干后，又因其形态似雪花瓣，有冬日之意，冬至，春近，癸后复为甲，天道循环，四季往返。可见，无论是空间，还是时间，“癸”都是终点与新起点的衔接。后世解释，癸，是用仪器测量方位，是以符号指示时间轴的节点。癸字长草，便是“葵”，葵者，自然界的时空测量指示者，向日葵，是植物界中的天文工作者，他努力盯住太阳来标识方向和时间。当然，我们现在都知道，其实向日葵并不会转动花盘，她是在年轻时选择了朝向太阳的方向后，一个角度保持终生，直至年老，烈士暮年，方才垂下沉沉的头。葵花，始终是光明的追求者。聪明的，在这熙来攘往纷纷扰扰的尘世，总有些时候，会忽然找不到光明所在，然而，我们该坚信，光明总会回来。","body":["聪明的，可愿做一株向日葵，一起寻找光明一起追赶光明。"],"sum":"甲骨文的“癸”字甚是好看，是四角对称的图案，许慎解“癸”，水从四方流"},{"n":121,"c":"法","d":"2016.7.4","lead":"法的繁体为“灋”，改为简体字时，丢掉的恰恰是这个字中的灵魂——那头叫做“廌”的上古神兽。在今天的童话诗里，孩子们和小廌一起，在水边修炼感悟，一起去迎战黑暗，小廌也终于成长为明辨是非、公正的法兽。“法”是什么？法，是宇宙万物的本质所在，是天人合一、顺应自然的最高准则。法律是什么？作为人类行为的规范，是社会秩序的依据。法所代表的，是自然世界的秩序；法律最终追求的，是社会秩序。今天的大孩子部分讨论的，有法律的“法”，也有方法的“法”。","body":["聪明的，愿我们，早日找到彼此沟通的最好方法，才好一起出发，去探寻世界的奥秘。"],"sum":"法的繁体为“灋”，改为简体字时，丢掉的恰恰是这个字中的灵魂——那头叫"},{"n":122,"c":"尘","d":"2016.7.26","lead":"尘字繁体为“塵”。会意，从鹿，从土，指鹿行扬土。金文、小篆的尘字有三“鹿”，指代鹿群，鹿之奔跑轻快敏捷，所扬灰土自是细小。人，生长于土地，世间无处无尘，故而佛家道家均称人间为“尘”。同样说细小的土，还有“埃”字，土飞为尘、土落为埃。尘埃，便是飘来荡去的细小土粒。诸多先人，感悟宇宙，总会深感人之渺小，多会以尘埃形容。","body":["人心之大与人心之小，全赖自己。即使是一粒微尘，也仍然有自己的价值。佛教称世间的色、声、香、味、触、法为“六尘”，与眼、耳、鼻、舌、身、意六根相对应。修行者如果能够达到真性清净，不被六尘所染，就达到了“一尘不染”的境界。","那么，聪明的，让我们做一粒独立的微尘吧。","以人类今天的智慧，世界的真相仍然难以窥探，世界之大与世界之小，我们都是在以人之视角来做相对判定。先贤语：一沙一世界。谁会知道，我们身处的世界，会不会是藏在另一个巨大世界的一粒尘里呢？同样的道理，我们身边的微尘里是否也会藏有我们无法探求的世界呢？聪明的，在这样不停跳转的思维里，我们该如何自处？别忘了，先人还有一句“聚沙成塔”，如果每一粒飞舞的尘，都可以朝向同一方向有序落下，最终，会得到一座壮美的塔，而组成这塔的每一粒微尘，都有自己的价值。","所以，聪明的，让我们这些微尘追着光一路前行，愿你我共建一塔、共成一塔。"],"sum":"尘字繁体为“塵”。会意，从鹿，从土，指鹿行扬土。金文、小篆的尘字有三"},{"n":123,"c":"落","d":"2016.8.18","lead":"草木凋谢，草叶枯黄，是为零；树木凋谢，树叶离枝，是为落。落字，草木生息，残页枯草越过界河，转入轮回，为此暗藏洛水于其间。洛水，古时以之为界河，既有人间界河划分疆土之用，更有阴阳之界的深意。中国古人还是偏感性，且更多是去感悟宇宙与心境的对应。历代诗词中，“无边落木萧萧下”这一类吟诵落叶触景伤情、见景生情的文字颇多。但是却没能从看见苹果“落”地进而理性地提炼出物理定律。太多似是而非、不求甚解、懒于计量的态度，让我们一直处在浪漫主义的生产与生活状态。在工业化之前的手工制造、手工生产时代，规模化生产未成形前，我们是先进的；但是工业化及其带来的标准化，使得生产效率提高时，我们却“落伍”了。工业化时代起步的“落”后，总让人觉得心里“空落落”的。转眼到了网络时代，必须找到立足之“落脚点”，不能再“落下”课程，该补课就得补课才是。只有这样，我们才能真正“落实”自己提出的规划，让我们成为以创新驱动的“部落”！","body":["聪明的，一起创造新的部落吧。"],"sum":"草木凋谢，草叶枯黄，是为零；树木凋谢，树叶离枝，是为落。落字，草木生"},{"n":124,"c":"时","d":"2016.9.18","lead":"时，繁体作“時”。此字来自先人对太阳的观察，甲骨文的“时”字是上下结构，上面为“止”代表行进，下面为“日”指太阳，时，即为先人对太阳行走的记录，记下的是太阳运行的节奏，说文解字讲，时即四时，即为四季。至篆文，改为左右结构，左为“日”，右边在“止”下加“寸”表示抓取，彼时，先人已对时间有所感知，彼时，子已经在川上曰过了“逝者如斯夫”，说的不只是河水，感慨的其实是时间之河啊！也许，大秦国首席造字师傅李斯的心理潜意识层面，总还是受了孔丘影响，还是想要抓住光阴吧。隶书将“止”篡为“土”，遂成“時”。由繁入简，“時”字去土成“时”。好在，代表抓取意思的“寸”还在；先人造此字所期冀的“跟随光阴脚步、抓住光阴有所为”，这层古训之意，还在；“时不我待”这个词，也还在。时间是消耗型资源，消耗过的时间再也无法找回。那么，聪明的，让我们一起，紧紧跟上时间的脚步，莫负时光吧。","body":["聪明的，你知道，我说的不只是数字出版；我说的，还是数字出版。"],"sum":"时，繁体作“時”。此字来自先人对太阳的观察，甲骨文的“时”字是上下结"},{"n":125,"c":"城","d":"2016.10.24","lead":"-","body":["2022.5.15","成，甲骨文里是戌（刀）在邑（城墙垭口）上，是以武力征服领土。霸业完成，打江山者改坐江山，以土围“成”，遂成一“城”。《説文解字》曰：城，以盛民也。从土，从成，成亦聲。白话意为：城，用来容纳万民的系列建筑群。字形采用“土、成”会义，“成”也作声旁。城，造字本意，名词，是指配备武装、用以围护都邑的郭墙，墙内自是盛民之所。","我们今天说到城时，不但指那一圈围墙，通常连墙内的建筑和人以及人的活动都囊括其中了。历经千载，城之为城，有大小之分有风貌之别，然其本意，总绕不过“安民之所”这一曾经的愿望。今天的城市承载了太多功能，盛下太多人口。城市生态遭到的破坏，已然不再是“安民之所”，城市的意义，开始被不断怀疑。","人是群居动物，从最早的山洞到粗陋的土城，到如今的各种大大小小的城市；从早期互联网的论坛，到社交社区，再到移动互联网生态下的各种社群，我们总要让自己处在某个群里，有一道有形或无形的墙，将我们围进一座有形或无形的城里，如此方得安心。但每个人的心里又有一层层的围墙，把自己保护起来。每个人都住在自己的孤城里，——直到遇见另一个自己，住进彼此的心城，于是，来往双城间，直至并为一城。聪明的，愿你早日住进另外一座城，愿你的城里早日住进另外一个人。愿有一天，我们每个人的城，都能彼此相连。"],"sum":"-"},{"n":126,"c":"雾","d":"2016.10.31","lead":"霧，字形上看，上面是代表水汽的“雨”字头，下面的“務”字，一说是“瞀”的略字，（因水汽遮目）看不清事物；一说是“務”的原义，拦着地气（使其不成雨）。《说文解字》偏向后一理解，释义为：地气发，天不应。水汽自地上蒸腾起来，兴致勃勃想要成云化雨，却被拦在半空上不去，遂成雾。","body":["时至今日，世界进入互联网时代，云里雾里的这些字开始被用来冠名新的技术。云计算的概念刚刚被普及，又开始有雾计算的新名词被炒作。雾比云低，所以，雾计算是为缓解云计算压力而提出的解决方案，本质是在云与本地之间搭建一个中转站，这个中转站依靠的是以传感器为主的数据中转中心，倒是可以纳入物联网的建设体系。云也好、雾也罢，别忘记，这些底层技术仍然是为信息的生产、采集、挖掘、存储、管理、传播、消费而服务的。真正有价值的，是蕴含了思想的那些“信息”的水滴。聪明的，还是要最终回归到信息社会、回到出版的本质与本义上来。","聪明的，我说的不只是数字出版，我说的还是数字出版。"],"sum":"霧，字形上看，上面是代表水汽的“雨”字头，下面的“務”字，一说是“瞀"},{"n":127,"c":"别","d":"2017.1.1","lead":"我们惯在岁末年初，与旧岁话别。别，甲骨字形为以刀剔骨，应该是作为高级吃货的古人所熟练掌握的刀法技巧。而后世演变，当人们经历各种离别之心痛时，直觉如刀割心碎，这才有了引申义。说不定一次再见便再也不见，别离不断，人生如此。再进一步，子立川上曰，逝者如斯，别离的已不只是人，更有事物。然而中国古人的胸怀仍然达观，沉舟侧畔千帆过，病树前头万木春。有别离辞旧，才有相逢迎新。","body":["所以，聪明的，一起来迎接今天的太阳吧，继续奔跑。2017，一起前行！"],"sum":"我们惯在岁末年初，与旧岁话别。别，甲骨字形为以刀剔骨，应该是作为高级"},{"n":128,"c":"启","d":"2017.1.2","lead":"启，繁体为“啓”，开也，从户、从口。以“口”开“户”，造字本义，比喻开口训导，使脑袋开门、开窍。后世演变，字义一方面指向具象的生活场景，作为打开之意；一方面，逐渐成为“开始、起初、第一个动作”的指向，如，出自《诗 • 小雅 • 六月》的“元戎十乘，以先启行”，即是大军开拔之意，由此，“启”，逐渐成为展开一段新历程的动作。聪明的，很多的启程，我们都难以预料未来的结果，然而，正是这种不可预测与不可预见，才让人生充满寻找答案的乐趣。","body":["聪明的，2017，让我们开启一段新的旅程，直抵仍未可知的未来。你知道，我说的不只是数字出版，我说的，还是数字出版。"],"sum":"启，繁体为“啓”，开也，从户、从口。以“口”开“户”，造字本义，比喻"},{"n":129,"c":"解","d":"2017.1.3","lead":"解，说文云：判也，从刀，判牛角。取牛角，想来一定是古人剖牛过程中技术最复杂、也是最难以处理的步骤，绝对的技术活儿。那时候还没有区分医师和屠夫的职业工种，无论谁能做好这件工作，都会是地位很高的“专业人士”，就会被称为庖丁。时至今日，各行各业对掌握专业领域知识技能的“庖丁”，需求越来越旺盛。然而，只有洞察秋毫、可以掌握食客心理，且又熟知“牛”的间架结构、与“牛”相关的知识体系，更可以看透表象、看穿历史，闭目也能找准脉络，善解各个时代各个品种的问题之“牛”，才是新时代庖丁的生存之道。","body":["聪明的，愿你我都能做个快乐的庖丁。我说的不只是数字出版，我说的还是数字出版。","P.S.题外话：假期已过完，老老实实陪了家人三天，更新了三篇公众号，几乎未言工作未思工作，——几乎，几乎而已，有些东西似已深入骨髓，怕是要伴随余生，难以割弃。接下来，还是会更多精力回到工作上吧。毕竟，这一年将启动很多新征程。聪明的，一起出发。"],"sum":"解，说文云：判也，从刀，判牛角。取牛角，想来一定是古人剖牛过程中技术"},{"n":130,"c":"补","d":"2017.1.16","lead":"补，繁体做“補”，篆字是左为衣、右为布料，意即，用布料缝织衣服，以覆破洞。补衣是个技术活，补衣高手会让人看不出补丁，补旧如新。","body":["小时候，在外面疯玩不小心刮破衣服，回到家，母亲便会开玩笑地跟父亲抱怨，跟了你们家这个姓，就一辈子躲不过缝缝补补。母亲当年没认识到，缝补衣服还只是小打小闹。真被她说中的，其实是我。也许，此生注定要不停地做各种补台、补位、拼缝的工作。也好，渐已学会随遇而安、甘心为之。唯愿，寻得长缨做针线，不必缚苍龙，但能补九州，即可。","聪明的，你需要缝补些什么？来来来，我帮你。","P.S.出版业行至今日，上，难接作者，创源不足；下，难接读者，市场不足。原本近乎垄断的贯通作者与读者的通道忽然被互联网挖了传播漏洞，同时，还有更多的洞是文化欠缺的生产漏洞，还有懒惰造成的营销漏洞。那么，出版人就该尽快补上各种漏洞，加快与技术融合，才能回到内容、回到文化的根本，重拾文化传承的担当。","聪明的，让我们做好缝缝补补的修补匠，任一路风雨，一起前行。"],"sum":"补，繁体做“補”，篆字是左为衣、右为布料，意即，用布料缝织衣服，以覆"},{"n":131,"c":"息","d":"2017.2.9","lead":"息，喘也。从心，从自，自亦聲。在老子和庄子那里，息，是自然万物所蕴含的生命力，是一股看不见的气息。那么，休息，也许是该写作“修息”吧，意思是让我们可以修理一下自己，恢复生命力。另一个角度看，自心成息，休息，也是找回“自”己的“心”的过程。聪明的，你在休息的时候，可有静静思考，可有找回自己的初心？","body":["聪明的，愿你我都能找到自己的心。","P.S. 难得休了个长假，几乎——能用上“几乎”就已经算很不错了对不对——没有工作，陪小宝到处疯玩。玩大了，把宝宝妈的生日错过了，赶紧赔罪（真的是赔啊，聪明的，你懂的），所以今天的情话落款是2月7日。今日开始，恢复工作状态，聪明的，一起上路吧，可好？"],"sum":"息，喘也。从心，从自，自亦聲。在老子和庄子那里，息，是自然万物所蕴含"},{"n":132,"c":"榛","d":"2017.2.11","lead":"榛，形声字，从木，秦声。古字为上“辛”下“木”，又写作“蓁”。本义为植物名，原为泛指落叶灌木或小乔木，《广雅》记：木丛生曰榛。后，演变为专指生榛果之树。而蓁蓁一词，则保留了丛木繁茂的意思。依宋时刘翰、马志等编著的《开宝本草》中所记，榛之功效：益气力，实肠胃，令人不饥、健行。其实，就是绝对管饱啊！这就是榛子实在的地方，小时候吃榛子，真是连着吃上几颗就会觉得饱。所以，我一到冬天就会想念榛子的味道。","body":["聪明的，你爱吃榛子吗？愿你冬日周末愉快。"],"sum":"榛，形声字，从木，秦声。古字为上“辛”下“木”，又写作“蓁”。本义为"},{"n":133,"c":"知","d":"2017.3.6","lead":"知，《说文解字》曰：詞也。从口，从矢。用白话说，就是表达意思的措辞。从字形上看，左“矢”右“口”，本义为谈论使用弓箭，即交流打猎、打仗的经验。人类的思维活动多来自于交流的目的，思维活动的成果逐渐成为思想。刚从树上下来的时候，人类的思想远没有今天这样复杂，我们的祖先在那个时候只求食能果腹，生存为本，所以，不会打猎的族人都不是好伙伴，擅长打猎摘果子的族人才是好兄弟好姐妹，他们的经验教训不断沉淀下来，可以指导整个部落重复使用的时候，就形成最早的“知识”。汉语里，知识的“知”总和智慧的“智”有着紧密联系，甚至很多时候语义相通。庄子说“心澈为知”，其实说的是“智”。唯有心底清澈，观外物、识外物、见本心、安本心，才会融会贯通，与天地有和，智慧顿生。知识，原本就是破解世界、理解世界的密码，是人类认识世界、再与世界友好相处的桥梁。","body":["聪明的，愿我们都能以知得智。"],"sum":"知，《说文解字》曰：詞也。从口，从矢。用白话说，就是表达意思的措辞。"},{"n":134,"c":"晨","d":"2017.3.12","lead":"晨，《说文解字》曰：曟（上晶下辰），房星，為民田時者。从晶，辰聲。晨，曟或省。翻译成白话，意思是：晨，指房宿星，是农民早起耕作的时间参考。字形采用“晶”作边旁，“辰”作声旁。晨，是“曟”的异体字，省略了两个“日”字。晨字的甲骨原形并无“日”字，原本是上为“林”（林野、田野）；下为“辰”，其形为“手持石锄”之意。造字本义是，荷锄出工，日出而作、日落而息。至金文，添加“日”形，强调入林野、入田野开工干活的时间段。晨，渐渐演变为对早上的时间段的特定指代。古人云，一年之计在于春，一日之计在于晨，既是对劳动实践的总结，更是借着对春天、对早晨的珍惜，告诫后人，要珍惜时间，早谋布局。","body":["聪明的，在这春天的早晨，愿你我都能找到未来的方向，一起出发。","P.S.特别说明：本期主题，送给一位可敬又可爱的老头儿，他就是数字出版圈内知名的“孙长老”，祝贺孙老师喜获双胞胎孙女，祝福晨曦、晨曜两个小美女，聪明的，愿你们永远健康快乐。"],"sum":"晨，《说文解字》曰：曟（上晶下辰），房星，為民田時者。从晶，辰聲。晨"},{"n":135,"c":"行","d":"2017.3.20","lead":"在甲骨文中，行，原本是十字路口的象形字，至今，行（hang）为直排，列为横排，仍然保留着道路之意；演变出表示人的动作之意时，读音为行（xing）。《说文解字》曰：行，人之步趨（趋）也。从彳，从亍。凡行之属皆从行；白话语义：行，人们在路上行走或小跑。字形采用“彳、亍”会义。所有与行相关的字，都采用“行”作边旁。古人云，“知易行难”，又云，要追求“知行合一”，道理是这个道理，怕是最难实现的吧。想得到、想得通，不一定做得到、做得成。从思想到行动，从理论到实践，仍有千山万水。在前行的道路上，还会有各种意想不到的障碍，让我们不断怀疑，对于未来，我们是否真的知之。然而，我们今天的世界，一直是由各种坚持、甚至是执着推动形成的。坐而论道，莫若起身求道；临渊羡鱼，莫若退而结网。一天一小步，积跬步致千里。行，才有机会遇见未来。","body":["今日春分，聪明的，莫负了春光。"],"sum":"在甲骨文中，行，原本是十字路口的象形字，至今，行（hang）为直排，"},{"n":136,"c":"倦","d":"2017.5.7","lead":"倦，《说文解字》曰：倦，罷也。从人，卷聲。白话语义：倦，力量用尽。字形采用“人”作边旁，采用“卷”作声旁。从字形看，一个人把自己卷起来，通常是疲惫时缩起身子的姿态；但是换个角度看，这也会是一个人志得意满后真正放松的姿态。聪明的，看到倦字，你会想到什么？是日晚倦梳头的慵懒，还是倦鸟归林的意懒，抑或枕厌长夜的心懒；是教导他人的诲人不倦，还是坚持学习的笃学不倦，抑或孜孜不倦的勤勉？在路上，难免偶尔倦怠，那就短暂休息一下吧。然而，每个人的生命里，都要不停地提交答卷，这是“倦”字的另一种解读吗？生命的旅程中，面对写满各种问题的卷子，你在今天写下的答案，都会在未来得到评判。聪明的，你可以选择不同的回答，但是千万别交白卷哦。聪明的，立夏已过，秋天就不远了吧。祝你我好运，愿你我的回答，你我的选择，都在时间里被证明是对的。","body":["P.S.停更了一个月，是为了集中精力做另外几件事。还是不得不承认，老了，精力很难分散开。而心懒，也许是另一个原因。倦怠，像一个影子，寻一道缝隙悄悄爬进心里，在你不提防的时候，忽然在心里跺一下脚，还在疾行的双脚，忽然就沉重如铅。这情景，得催动法咒，唤醒心里住着的那个年轻人，把倦怠的影子好好收拾一顿，让他老实一阵子。嗯，等等，让我先唤醒那个年轻人吧。"],"sum":"倦，《说文解字》曰：倦，罷也。从人，卷聲。白话语义：倦，力量用尽。字"},{"n":137,"c":"森","d":"2017.6.4","lead":"《说文解字》曰：森，木多皃（mào），从林从木。白话的语义：森，树木极多的样子，字形采用“林、木”会义。先人造字，代表了对自然对世界的认知，也隐含着最早的、朴素的哲学思想。双木成林，丛生的树木构成林；三木成森，多片林地连成森。这里的“双”与“三”都是一种比喻用法，都是形容多。双木当然不是就两棵树，三木也当然不是就三棵树。不过，“双”这个字，倒是多数时候都老老实实限定在“两个”的量级上；而“三”这个字，则经常伴随着量级的跳跃，最少也是三三见九，最大的跳跃是老子那句：三生万物。","body":["造字背后的含义，穿越几千年后，仍然是很多事物运行的基本原理。莱布尼兹明确承认其以0和1构建的二进制，是源于中国易经的思想，而易经的“阴阳双叉树”的推演，也正是“双木成林”的衍生；在今天的信息森林里，互联网是人类智慧集大成的成果，而三木成林的原理仍然存在。针对各种信息消费需求，信息技术、信息内容、信息服务，成为构建起互联网的三个最基础元素；再看一个具体的规则，RDF(Resource Description Framework)是一种用于描述Web资源的标记语言，其核心价值在于，定义了一种通用的框架，即“资源——属性——值”的三元组，以不变应万变，来描述网络上的各种资源，这还是三生万物、三木成森。","所以，在面对互联网森林时，既要钻进信息技术这棵老树的每一片叶子里，去研究具体的技术，更要时不时跳出来，从更加宏观的高度上，让视野更加辽阔，看到森林里“信息内容、信息服务”这另外两棵树，才能真正理解和认知互联网。","聪明的，愿你在互联网的森林里，不要迷路。"],"sum":"《说文解字》曰：森，木多皃（mào），从林从木。白话的语义：森，树木"},{"n":138,"c":"试","d":"2017.6.11","lead":"《说文解字》曰：試，用也。从言，式聲。白话语义：试，人员任用的步骤。“式”字可以再拆出“工”与“戈（弋）”，意思是“工具、武器的使用套路”。试，也就是“说一说工具和武器的使用套路”，这大概是最早的考试内容吧。在那个遥远的年代，部落里“组织部门”对部落干部的考核，对后备人才的考核关注点，应该就是会不会熟练使用工具来确保整个部落的生存吧。在今天，特别是互联网的环境下，人类有了更多的工具。那么，考试的内容就该更加复杂了。","body":["聪明的，努力学习吧，祝你早日学会使用各种工具。"],"sum":"《说文解字》曰：試，用也。从言，式聲。白话语义：试，人员任用的步骤。"},{"n":139,"c":"梯","d":"2017.7.9","lead":"《说文解字》曰：木階也。从木，弟聲。白话语义：梯，木阶。梯子的发明，对于人类文明的进步其实意义十分重大。梯子，是人类增加高度的工具，扩展了受身体构造所限、四肢无法触及与控制的范围。梯子，从生产工具成为战争工具后，从简单的登墙梯到与城墙等高的梯楼，是攻城略地之必备装备。在工业革命的背景下，机器时代的梯子开始有了更多的变化，从消防云梯到电梯。以上，只是对梯子的直接应用，受梯子的启发，人类在思维方式上有了突破，从形象化的梯子及其具象化的功能中，提取出抽象的、逻辑上的概念，比如数学领域向量微积分理论中的“梯度”，以及经济学理论中的“梯度”开发。当然我更喜欢的，是大刘在《三体》里提到的“太空电梯计划”，充满了有着硬科幻独特魅力的想象力。在《圣经.创世纪》里，雅各布在梦中登上云梯，取回“天火”，雅各布的梯子，便成为人类梦想的象征。","body":["聪明的，愿能与你一起搭建起梦想的梯子，通往美好的未来。"],"sum":"《说文解字》曰：木階也。从木，弟聲。白话语义：梯，木阶。梯子的发明，"},{"n":140,"c":"潜","d":"2017.7.19","lead":"《说文解字》曰：潛，涉水也。一曰藏也。一曰漢水爲潛。从水朁聲。白话意为：潜，徒步过河。一种说法认为，“潜”是藏身水底。另一说法认为，汉水被称为“潜”。字形采用“水”作边旁，“朁”是声旁。《说文》还是比较严谨慎重，各种字源、语义都做了收集。从字形上看，“潜”字中的“替”并不是今天的“替”，在金文中上为“欠”下为“曰”，表示吸足气、吐空气，深呼吸后跳入水里，很形象的一个字。","body":["除了潜水之意，潜字的引申用法，更多代表一种人生态度和人生状态。源自《周易》那句“潜龙勿用”，“勿用”，是为“隐”也。孔子的解释是：“潜龙勿用，何谓也 ? 龙德而隐者也。不易乎世，不成乎名，遯世无闷，不见世而无闷，乐则行之，忧则违之，确乎其不可拔也，潜龙也。”不可为时而不为，潜于世，隐于世，遁于世，虽安然处之，非颓废也，是以潜世之时做厚积，以待他日见龙在田、飞龙在天，得以薄发。","嗯哼，聪明的，你说的没错，的确是有降龙十八掌的味道，因为金庸老先生的创作灵感，本就是取自于此。"],"sum":"《说文解字》曰：潛，涉水也。一曰藏也。一曰漢水爲潛。从水朁聲。白话意"},{"n":141,"c":"渡","d":"2017.9.3","lead":"《说文解字》曰：渡，濟也。从水度聲。白话意为：渡，济，过河。字形采用“水”作边旁，“度”是声旁。渡，随着字的演变，除了原有含义的“过河”，更多成为一种比拟，是人类“历经劫难、完成一种升级”的比拟。我曾经说过最喜欢的寓言故事，是《小马过河》。终此一生，我们有无数的河要渡过，水深水浅，观望、打听，都无意义。所有横在我们生命里的河，最终都要靠我们自己去渡。没有先验的经验，没有普适的经验，一切，都要靠我们自己去尝试。最终你会发现，所有的河，其实考验的都是一种品质：勇敢。至于过河的技巧，从来都是重要的、但绝不是最重要的。","body":["聪明的，可愿一起，随我渡河？"],"sum":"《说文解字》曰：渡，濟也。从水度聲。白话意为：渡，济，过河。字形采用"},{"n":142,"c":"忘","d":"2017.9.15","lead":"《説文解字》曰：忘，不識也。从心，从亡，亡亦聲。白话意为，忘，不记得。“忘”字，字形采用“心、亡”会义，“亡”，既是声旁也是形旁，表示不存在、已消失。“心”，表示记忆。现代的知识告诉我们，其实记忆不是藏在心脏，而是藏在大脑里。记忆又是什么？是我们的经历。记忆的本相可能是碎片的，但我们的大脑总会不由自主地把记忆碎片串连起来，甚至加上一些后来的主观意志，去弥补和填平碎片之间的沟壑。所以我们的记忆，多数时候都是一部电影。人脑是复杂的“机器”，偶尔，它的转动也会有错漏，于是我们都会失去一些记忆。也许未来的人类可以实现，把记忆的脑电波读取出来，及时进行存储，这样，我们似乎就不会再忘记。然而，那时我们也许会发现，有时候，忘记，未尝不是一种幸福。","body":["聪明的，那些想忘记的过去，你忘了吗？"],"sum":"《説文解字》曰：忘，不識也。从心，从亡，亡亦聲。白话意为，忘，不记得"},{"n":143,"c":"愁","d":"2017.9.17","lead":"《説文解字》曰：愁，憂也。从心，秋聲。白话意为，愁，忧心忡忡。字形以“心”作形旁，以“秋”作声旁。秋风起，黄昏登高处，远望秋色暮，凉意格外入心。怕是要想起太白诗句：暝色入高楼，有人楼上愁。直白浅显，却直指心底挥之不去的凉愁。当然，诗词中并不只有悲秋，也有温馨，“待到重阳节，还来就桑麻”，有空灵禅意，“空山新雨后，天气晚来秋。明月松间照，清泉石上流”，还有诗意豪情，“自古逢秋悲寂寥，我言秋日胜春朝。晴空一鹤排云上，便引诗情到碧霄”。其实，愁与不愁，在心不在秋。心若不伤，观秋，是秋，入眼时便多的是春夏两季在这一季的沉淀、在这一季的收获。若想秋不愁，春夏勤耕耘。","body":["切莫听信那些充斥机场书店的成功之说。世上哪有那么多投机取巧的成功之道，“勤、快”二字足矣。很多事，来不得偷懒也等不及空想，最“笨”的方法，最“苦”的过程，是最好的方法，是最快的路径。","比如出版人，想明白了要做知识服务，就赶紧老老实实先把主题词表做好，把本体库建好，把知识体系搭建好，让知识元各自归位，只要这种针对知识内容的“操作系统”在手，还不是随便一出手就可以调动局部知识元形成一款新的知识产品？是为勤；想明白了要做知识服务，就别犹豫不决，动手便是，把渠道和平台建好，把知识之城的大门建好并广而告之，让用户可以快速找到各自关心的知识之城的入口，再把街道的建筑物门牌号编好，让居民不迷路，还可以随时从此楼及彼楼，把知识元的编码做好，把楼与楼之间的关联通道挖好，把仓库里的知识元做好编号、和街道的门牌号对应好，就可以随时开城了，是为快。知识元的积累当然不是一朝一夕之功，须形成累进制度，才能川流不息。","聪明的，你看，要做的事那么多，哪有时间发愁啊。","去吧去吧。咱们说好了，我在春天，与你，一起等。","面朝大海，等着真正的春暖花开。"],"sum":"《説文解字》曰：愁，憂也。从心，秋聲。白话意为，愁，忧心忡忡。字形以"},{"n":144,"c":"清","d":"2017.9.23","lead":"《説文解字》曰：清，朗也。澂水之皃。从水靑聲。白话意为：清，水净透明，水澄澈的样子。以水作边旁，青，既是声旁也是形旁，是“倩”的省略，表示美丽、漂亮。古人对水的喜爱尤甚，以水之特性入字、进而表意的情形也多。“清”字，以水之透明特性形容事与人。事之清者，大道至简，其理通透；人之清者，形影端正，纯洁透明。然而，世界纷纷扰扰，万象繁杂，至简之理实在不易看透；众生虚言委辞，异面同相，无垢本性实在难以看破。只有先自清心清脑，方可清目，观天下、察众生，才有机会悟真理、得大道。","body":["秋分已过，风起时天高云淡，聪明的，可愿一起，把酒共话夜雨，听涛拍岸清心。"],"sum":"《説文解字》曰：清，朗也。澂水之皃。从水靑聲。白话意为：清，水净透明"},{"n":145,"c":"懂","d":"2017.10.8","lead":"“懂”这个字，今意是“了解、明白”。说文中未见这个字。康熙字典收字时，将懂的另一个字形“”（憧这个字，在童上面加草字头）从省，只留下这一个字形。“懂”这个字，其中的“董”，原义是重要的边邑城镇。所以我们不妨这样理解，一件事、一个人，只有真正进入我们的内心时，我们才能说真的对它/他/她了解和明白，才是真的“懂”了。而这个入心的过程，是如此艰难，却又如此简单。你苦苦思索，苦苦猜测，苦苦追求，百思不得其解，一忽儿觉得很近，就要触摸到答案，一忽儿觉得很远，更似有万丈深渊相隔，百爪挠心。你起身想要休息甚至是放弃的一刹那，千丝万缕的一堆乱麻般的头绪里，突然有一根线，发出亮光，成为一根主干，其他的线索成为这干上的枝枝叶叶，然后便层次分明，脉络清晰，你顿时觉得醍醐灌顶，通体舒泰，欣喜若狂，手舞足蹈，疯疯癫癫。到了这个时候，恭喜你，聪明的，你懂了。","body":[],"sum":"“懂”这个字，今意是“了解、明白”。说文中未见这个字。康熙字典收字时"},{"n":146,"c":"流","d":"2017.11.12","lead":"“流”字，《説文解字》曰：流，水行也，从沝，从巟（也读作liu），突忽也；流，篆文从水。白话版《说文解字》：流，水上旅行,字形采用“沝、巟”会义，巟，表示突忽意外；流，篆文简化字形，采用“水”作边旁。巟的起始之意，是坏了的胎儿随羊水排出。加了水做边旁的“流”字，本意是河水向低处运动，再进化为水上旅行，演变出“不受约束、自由”之意，进而引申出“传播、风行”之意。杜甫说：尔曹身与名俱灭，不废江河万古流。说的是王杨卢骆“初唐四杰”开创的诗词风格与体裁，在当时的文坛场景引起过一些争议，但杜甫对四杰的创新，是绝对支持的态度，他认为时间会证明一切。看来，厚古薄今，是中国古已有之的毛病。我们必须明白，传承，并不是一味地继承，传承，是要开创性地升华传统，这才是传承的应有之意。聪明的，如何让优秀的传统文化流芳百世，这是时代给我们的题目。千古风流人物，还看今朝。","body":["聪明的，在互联网越来越发达的今天里，愿你我一起，逆流逆行溯源而上，去寻找流传千载的文明密码，再把这些密码重新装入新的封装，让曾经辉煌的文明，重现光芒。"],"sum":"“流”字，《説文解字》曰：流，水行也，从沝，从巟（也读作liu），突"},{"n":147,"c":"停","d":"2017.12.8","lead":"“停”字，《説文解字》曰：停，止也。从人，亭聲。白话版《说文解字》：停，止步。字形采用“人”作边旁，采用“亭”作声旁。亭，既是声旁也是形旁，表示供旅人暂歇的小型开放性建筑。停字从字形上很好理解：旅人在路边的亭子里休息。","body":["人生如行路，总有累的时候，那就找个路边的亭子坐下来，歇一歇吧。不过，你看这个“停”字，古人是很讲究的，休息，也要找个合适的地方，找个亭子。最起码，要找一棵树——这是“休”字的含义。总之，都是要找一个可挡风遮雨、可避暑乘凉的所在。","也许我们都需要找到一个亭子。","这亭子，可能是独自停进地下车库的车里，可能是午后独处的书房，可能是夜半空无一人的小酒馆，可能是已经没有了电话机的破旧电话亭，可能是周末空空荡荡的办公室，可能是山里简陋客栈的小木屋，可能是热闹的景区里一个人坐的索道车厢，可能是只有一条流浪狗陪伴的山间茅屋。","这亭子，可能是一本买了好久一直没拆封的书，可能是一张都快找不到地方播放的音碟，可能是没画完的一幅画，可能是写了三五行诗就一直找不到以为丢了的本子，可能是一袋就快过期的牛肉干，可能是忽然发现瓶底还剩了二两多的酒瓶，可能是忽然在视频网站上被推荐的一部老电影。","或者，这亭子，可能是深夜手机上接到的一条骂你怎么还不睡然后叫你一起去喝酒的微信，可能是在电话里抢来抢去跟你絮絮叨叨的那两个苍老的声音，可能是站在阳台上冲着低头走路的你大声喊着爸爸的小调皮，可能是走进书房把你的电脑关上把你的烟掐掉然后抱着你的她……","聪明的，愿你，总能找到你的亭子。"],"sum":"“停”字，《説文解字》曰：停，止也。从人，亭聲。白话版《说文解字》："},{"n":148,"c":"元","d":"2018.1.1","lead":"“元”字，《説文解字》曰：元，始也。从一从兀。白话版《说文解字》：元，起始。字形采用“一、兀”会义。元，天地之初，混沌太初。《易经·乾》曰：“大哉乾元，万物资始”；《春秋繁露·重政》曰：“元为万物之本”。元，是世界的起源，在演变后，也被用来指向多世界的维度。","body":["小宝一直希望可以遇见外星人，这和我小时候很像——其实我现在也是这样认为，所以每次说起，其他次元的世界该是怎样的，父子俩就很有得聊。世界，应该是多次元的吧。寥廓的宇宙是这样，我们生存的这个小小星球也该如此。即使在同一个次元世界里，分久必合，合久必分，多元化才是恒久的。而每一个可能的存在，都会有一个超越所有之上、直指这一个“存在”的本源的“元”。","而人类智慧的终极目标，就是要乘着思想的方舟，行驶在世界的每一条河流里，逆流而上，追本溯源，抵达万物之“元”。","新的一年，万物复始。聪明的，愿与君携手共乘思想之舟，去寻找藏在世界角落里的每一个起始之“元”。"],"sum":"“元”字，《説文解字》曰：元，始也。从一从兀。白话版《说文解字》：元"},{"n":149,"c":"望","d":"2018.1.28","lead":"《説文解字》曰：望，出亡在外，望其還也。从亡，朢省聲。白话意为：望，对外出流亡的亲人，期望他们返回家乡。“望”字的字形采用“亡”作边旁，用有所省略的“朢”作声旁。造字本义：月夜远眺，寄托思念。所谓“举头望明月，低头思故乡”即是“望”字本意。漫长的岁月里，“望”字的本意越来越淡。正如今天的我们，视线很少再回望过去，只顾得远望未来。然而，世界上有很多东西，其实一直未变。要想抵达未来，最近的路程反而是回到过去，回归初心。所有今天的故事和未来的故事，都已经被讲过。而我们要做的，是把这些故事从头来过，用今天的语言和今天的方式，再讲一遍。","body":["聪明的，让我们一起，回到曾经的未来，去寻找明天的希望。"],"sum":"《説文解字》曰：望，出亡在外，望其還也。从亡，朢省聲。白话意为：望，"},{"n":150,"c":"闯","d":"2018.2.14","lead":"《説文解字》曰：闖，馬出門皃（mao），从馬在門中。白话意为：闯，像马冲出门的样子。字形采用“马”作边旁，像马在门中。马儿自然不能久居厩内，总要到广阔天地肆意奔跑，经历风雨，磨练意志，才能成为宝马良驹。而闯出那道门，是第一步。","body":["至于这“门”，不一定是有形的，更多时候是无形的。终此一生，我们总要不断冲出一道道束缚自己的门，才能不断成长。而最难冲破的门，是我们在潜意识里自己给自己设立的门：这件事我也许不该做吧，那件事我可能做不来吧，这件事留给爱冒险的人去做吧，那件事留给爱出风头的人去做吧……。于是，我们躲在马厩里，似乎不愁吃喝，日复一日，却渐渐丧失了奔跑的能力。然后有一天，门从外面打开的时候，别说驰骋疆场，就连走出这道门，都已寸步难行。","所以，总要冲破一道道门，才能闯出一个未来。","聪明的，一起来吧？"],"sum":"《説文解字》曰：闖，馬出門皃（mao），从馬在門中。白话意为：闯，像"},{"n":151,"c":"空","d":"2018.2.19","lead":"《説文解字》曰：空，竅也。从穴，工聲。白话意为：空，孔穴。字形采用“穴”作边旁，采用“工”作声旁。造字本义，是人工开凿或修建的居穴。古时设“司空”一职，基本相当于同时兼任住房建设部、水利部、交通部三部的部长，位高权重，“金印紫绶，禄比丞相”。而后，“空”的字义演变得越来越深沉、深刻。一直到那句著名的“色不异空，空不异色，色即是空，空即是色”。佛教认为，观察万物、体验世界，各“色”之下，最终都能找到看不见的真相，即是“空”。而所有的规律，所有的“空”，最后还要回到具体的事物中、在各“色”中体现出来。而在色与空的论述之前，是不是可以上溯至“道与名”呢？万物皆由人名之，但名又非常名；道，如果说出来，也就陷入非常境地，而不可道的“道”，也许才是真的道。就像无色之空最接近真的“空”。从今天对互联网的观察看，这句话仍然适用对互联网的新解。互联网是一个新“世界”，会有新的“色”，但基本规律的“空”仍在。所以，新“色”与旧“色”，其实看穿了都一样离不开本来的“空”，所谓色不异空。","body":["聪明的，愿你练就一双慧眼，透过所有的“色”，找到互联网不变的“空”，阿弥陀佛。"],"sum":"《説文解字》曰：空，竅也。从穴，工聲。白话意为：空，孔穴。字形采用“"},{"n":152,"c":"真","d":"2018.4.6","lead":"《説文解字》曰：真（眞），僊人變形而登天也。从匕，从目，从乚，八所乘载也。白话意为：真，长生不死的人变形升天。字形采用“匕、目、乚、八”会义，“八”表示仙人升天所乘坐的东西。又有一些观点称，“真”字与“贞”字同源，表示的是占卜灵验的看相算卦高手。","body":["我在很长一段时间里一直没想明白这个“真”字，它明明说的是不存在的得道成仙或者占卜算卦，怎么后来却引申到“与客观事实相符、确定、清楚”的意思？其实，人类一直以来的终极命题，不过是要探究这世界。当然，要探究的这个世界是包括了人类自身在内的。人类探究世界的欲望之强烈，以及由此产生的探究能力，是其他生物不可比拟的。人类会借助工具去探究世界，所谓“君子性非异也，善假于物”，而这个“物”是广义的工具。形而下时，物是技术与工具；形而上时，物是思想与知识。在形而下的工具强大时，世界在人类面前暴露得相对清晰，我们称之为科学的胜利，此时的技术与工具可以借助形而上的通道，成为稳定的思想与知识；在工具还不足以让我们剥开表象、看清世界时，我们转而依赖于想象，用神话、神学，创造宗教这一类假设的思想与知识，来形成一个逻辑的闭环，解释看不清原理的现象。","人类通过各种路径，在不停地追寻这世界的答案。久而久之，“真”这个字的含义，就从“追求真的人”，演化出“追求真的过程”，再逐渐演化出“代表真的结果”。真理就像吊在大象前面的香蕉，总是看起来无限接近却一直难以到达。然而，在追求真理的路上，哪怕是酷暑寒冬，甚或似近日这般冷暖错乱，人类，何曾有过一丝一毫的停留。","聪明的，再怎样季节错乱，春天总还是会来的。"],"sum":"《説文解字》曰：真（眞），僊人變形而登天也。从匕，从目，从乚，八所乘"},{"n":153,"c":"闲","d":"2018.5.1","lead":"闲与閒为异体字。《説文解字》曰：閑，闌也。从門中有木。白话意为：闲，木欄。字形采用“门、木”会义，表示门中有木。《説文解字》曰：閒，隟也。从門，从月。白话意为：閒，空隙。字形采用“门、月”会义。两种写法都古意昂然。门内有树，入夜有月，树影婆娑，月华满庭。这场景须有美酒，或有佳人起舞，或有知己吟啸，暂忘白日劳作之苦，暂别世俗蝇营狗苟，风月相和，夜虫共鸣。这才是闲的最高境界。从字形看“闲”字，门在开着的时候，各种人和事才有机会进到庭院中，才会遇见各种可能，见识多了，朋友多了，如此，才能真正进入闲庭信步的意境吧。然则，门若关上，封闭起来，闲字就会变成困字，再怎样郁郁葱葱的树，都会慢慢凋零，庭中无木，徒留人居，庭中人最终只能则画地为牢，成为自己的囚徒。","body":["这庭院之门开或闭，或广至一国，或微至一心，道理是一样的。为国，闭关锁国来不得，为人，固步自封同样不可取。思想的封闭僵化，同样会让人困入绝境。","聪明的，愿你我都能心门常开，愿思想之树常青。"],"sum":"闲与閒为异体字。《説文解字》曰：閑，闌也。从門中有木。白话意为：闲，"},{"n":154,"c":"离","d":"2018.5.12","lead":"《説文解字》曰：離，黃倉庚也。鳴則蠶生。从隹离聲。白话意为：离，就是离黃，仓庚鸟。仓庚鸟鸣噪的季节，蠢虫（蚕）就四处繁生了。字形采用“隹”作边旁，“离”是声旁。说文对“离”字的释义，似乎指向了具体的一种鸟：仓庚，即黄鹂。惊蛰节气有三候：一候桃始华、二候仓庚鸣、三候鹰化为鸠，说的全都是春天的景象。汉字的演化，一直有很多不可思议的地方。从甲骨文的“离”字看，一鸟、一网，字形字义看，“离”的表面意思是“鸟被网住”。到金文、篆文的字形仍是此意。在《诗经·兔爰》中有句：“有兔爰爰，雉离于罗”，说的也是“落网”之意。有说，“离”字在金文时期开始分化、演化出“罹”字（一罩、一鸟），是“鸟被罩住”之意，引申意指“人陷入危难”。至后世，“离”字更多为“分别”之意，《康熙字典》：离，散也，远也。世事无常，悲欢离合向来见。古人讲有离有合，总还是想让人心有希望，即使离别，也能静待他日重逢。但若是生死相离呢，又该是怎样的绝望。","body":["十年之前的今天，蜀地蒙难，多少离别再无相见相合之可能。然而，逝者逝矣，生者在悼念之际，当何以自强、何以自处，才是这场灾难十年纪时更该所思所问。虽有万语千言，不知从何说起……。","聪明的，天助自助者，天佑自强者。愿天佑中华，更愿每个人都自强、勤勉、自助、助他。让你我都尽力做好份内事，汇万千众力，得渡万千劫难。"],"sum":"《説文解字》曰：離，黃倉庚也。鳴則蠶生。从隹离聲。白话意为：离，就是"},{"n":155,"c":"忙","d":"2018.6.18","lead":"忙，在《说文解字》中未收入这个字。按照说文的写作惯例，有人将其解为：从心、从亡，亡声。白话意为：忙，本义作“心迫”解，乃形容心中急促紧张而言行匆迫之状，故从心；又以亡本做”失”解，心中忙乱则神智难定，以致如有所失而缺乏主张。这期的《忙》字，是小宝同学亲自出的题目。据说是为了纪念这个忙碌无比的学期。的确，这个学期的小宝同学，除了日常繁忙的学习外，增加了很多社会活动，担任学校电台的编辑和主播，参加北京市的辩论赛，参加各种演讲比赛——甚至还包括一场纯英文的朗诵比赛，小宝以一篇英文《出师表》惊艳全场。直到这个月，各类活动陆续告一段落，小宝终于可以幸福地回到日常状态，每天下学迅速搞定作业，然后以各种悠闲的姿势开始读课外书。和小宝比起来，小宝爸已经闲了很久，上上期的《闲》就是他近期的日常状态。可是，小宝和爸爸聊天时，说起来，爸爸竟然说很羡慕小宝的忙，还说，小宝得长大后才能理解关于“闲的发慌”这种感觉。不过，小宝爸对小宝说，反思这段时间的闲啊，也是有所收获的。为什么呢？因为小宝爸做到了：闲的，是行动；忙的，是思考。","body":["聪明的，祝你也能享受忙碌，但又不困于忙碌，可以做到“人虽忙”而“心不亡”，永远记得我们从哪里出发，为什么出发，牢记初心。"],"sum":"忙，在《说文解字》中未收入这个字。按照说文的写作惯例，有人将其解为："},{"n":156,"c":"玩","d":"2018.6.30","lead":"《说文解字》说：玩，弄也。从玉元聲。貦，玩或从貝。白话意为：玩，摩弄玉石。字形采用“玉”作边旁，“元”作声旁。“貦”是“玩”的异体字，字形采用“貝”作边旁。这期的“玩”字，仍然是小宝同学出的题目，而且“梦到在月亮上玩”的这个桥段也是小宝同学出的思路，以此来表达他热切盼望假期的心情，同时也是要提醒他的同学们，别着急别着急，再忍忍再忍忍吧，只有安心复习，有个不错的成绩，才能在暑假玩儿的尽兴啊。好吧好吧，亲爱的小宝，爸爸还是很开心你能这样想的。你和你的小伙伴们得知道，爱玩，是人的天性；爱玩，不是件坏事儿啊，我会支持你们继续玩的。你们先去好好学习，等到下周考完试，就开始一起好好玩儿吧。","body":["聪明的，愿你永远有一颗爱玩的童心。"],"sum":"《说文解字》说：玩，弄也。从玉元聲。貦，玩或从貝。白话意为：玩，摩弄"},{"n":157,"c":"封","d":"2018.9.8","lead":"《说文解字》说：封，爵諸矦之土也。从之，从土，从寸，守其制度也。公侯，百里；伯，七十里；子男，五十里。 白话意为：封，伯爵诸侯的封地。字形采用“之、土、寸”会义，“寸”表示遵守封建制度。公侯，封地百里；伯爵，封地七十里；子男，封地五十里。封字本义，是在土地四周种植草木以标识地界，这一标识动作的本义，自然是为了确立分封土地的边界，便于主张自身权利。所以封字本身所指向的内涵，恰恰是建设性的而非破坏性的。而经过演变之后，今人所用“封”字多是强调“闭合、围堵”之意，衍生出封闭、封锁等含义。在科技不断进步的今天，技术正在推动商业模式的创新，进而推动人类社会的不断演进。在这样的时代，实在是容不得我们故步自封，容不得我们停滞不前。而最大的懒惰是思维上的懒惰。","body":["聪明的，愿你我都能打破思维上的封锁，不断突破，一起寻找更加光明的未来。"],"sum":"《说文解字》说：封，爵諸矦之土也。从之，从土，从寸，守其制度也。公侯"},{"n":158,"c":"破","d":"2018.10.2","lead":"《说文解字》说：破，石碎也。从石皮聲。白话意为：破，石头碎裂。字形采用“石”作边旁，“皮”是声旁。关于“破”字，有说，是用石块割开兽皮，做成最早的遮体衣服；也有说，是自然之力使得石头风化碎裂，像动物蜕皮一样；还有说，是用人工将石块弄碎，成为可用之石材。一块石头安静地躺在地上，被一个原始人偶然拾起，又偶然被投掷出去，击中猎物。这个原始人兴奋地飞奔过去，重新拾起石头，小心翼翼地珍藏起来。于是，看不见的经验被封存在石头里，这块石头被知识赋能，和其他的石头兄弟区分开来，成为存储知识、应用知识的一块非凡的石头。然而，人类没有止步于此。过于笨重的石头扔起来不够远，杀伤力也有不足。人类想尽办法把这块石头弄碎，在碎裂一地的小石块中，人类取出其中一块轻薄尖锐的石片，再进行细致的打磨，一件新的利器就此被创造出来。后来，这碎裂出来的石片变成青铜器，变成铁器，变成工业时代的机械，变成信息时代的电脑，变成智能时代的智能体（agent）。石头就是用来被打破的；就像，已有的知识终将被不断突破。人类，不断打破一层又一层“认知的茧”，进化出更为宽大的翅膀。人类的进化史，大抵就是这样一部不断打破原有认知束缚、创造新知识的历史。","body":["聪明的，一起学会用思想的力量破除认知之茧，可好？"],"sum":"《说文解字》说：破，石碎也。从石皮聲。白话意为：破，石头碎裂。字形采"},{"n":159,"c":"等","d":"2018.12.8","lead":"《说文解字》说：齊簡也，从竹从寺。寺，官曹之等平也。白话意为：等，顿齐书简，从竹（字头）从寺。寺，官曹的法度等级平级。等字的本义，是将书简（物）取一端等齐，则高下（等级）立现。等字的篆体，仍然可以看出这层意思，一只手端着书架，在台子上顿一顿，底部取齐，于是书籍高低就清楚可见，会意为，等级高下，再进一步引申出等待的含义。表达等待之意的中文古诗句很多，但是“等”这个字本身很少直接出现，是因为中国古人追求含蓄美，并且更重要的，是有足够的智慧去含蓄表达。于是，便有了“衣带渐宽终不悔，为伊消得人憔悴”，也有“似此星辰非昨夜，为谁风露立中宵”这样的佳句流传。","body":["等的滋味并不好受，坚持等，是心里仍存希望；敢于等，是心里仍有勇气；甘于等，是心里始终有爱吧……。","聪明的，愿您，总能等到你想要的；更祝你，此生总有可等。"],"sum":"《说文解字》说：齊簡也，从竹从寺。寺，官曹之等平也。白话意为：等，顿"},{"n":160,"c":"凡","d":"2018.12.16","lead":"《说文解字》说：凡，最括也。从二。二，偶也。从及。白话意为：凡，最大限度地囊括，全部，一切。字形采用“二、及”会义，二，代表偶数，及，代表到达。","body":["可见，“凡”字的本义是指全部，是包含了所有个体的总体。在演变的过程中，由于“凡”字强调同一类事物集合中个体会具备“普遍的、无差异性、类似或近似”的特性，衍生出普通、平平无奇的“平凡”的意思；再后来，又被当做对俗世（与神界及魔界对应）的指称。","按照今天互联网环境下的理解，凡，是包含、囊括所有小数据之后的数据集，凡，才是真正的“大数据”。大数据之下，每个原本低价值甚至无价值的小数据在这样的集合中，才会具有价值。这其中的关键是集合过程的“规则”、以及集合状态的“秩序”，而个体如何按照最有利于总体价值发挥而排列、存在，这是要去不断寻找的规律。","我一直认为，互联网是对人类社会的仿生。人类建设互联网的过程，也是对人类自身的反观与反思。这看不见的规律是：每个人的平凡，汇聚起来，才能成就人类的伟大；每个在不同历史阶段闪耀伟大光芒的人，也都不过是凡人；而每个平凡之人，其实也都有会有闪耀光芒的时刻。最终，超越时空的局限，我们可以看到的，是世界的秩序与规律。","愿你我都能此生安然，","愿你终能找到释放光芒的机会。","聪明的，愿你我，平凡而又不凡。"],"sum":"《说文解字》说：凡，最括也。从二。二，偶也。从及。白话意为：凡，最大"},{"n":161,"c":"祈","d":"2018.12.31","lead":"《说文解字》说：祈，求福也。从示斤聲。白话意为：向神灵求福。字形采用“示”作边旁，“斤”作声旁。“祈”字，最早的含义是出征作战前举行的祭祀仪式，用来求得神灵护佑得以胜利。","body":["2018年最后一天在天坛跑步，再次去看祈年殿。祈年殿，又名祈谷殿。殿内柱子的数目是按照天象建立起来的。内围的四根“龙井柱”象征一年四季春夏秋冬；中围的12根“金柱”象征一年12个月；外围的12根“檐柱”象征一天12个时辰；中层和外层相加的24根，象征一年24个节气。三层总共28根象征天上的28星宿。再加上柱顶端的8根铜柱，总共36根，象征36天罡。","可见，在古人那里，祈福的前提是要讲究人与自然的调和。如果人类不能顺应天道，仅靠祈福是求不来福气的。所以，纵观中外古人的智慧，虽然东方走的是向内参悟之路，西方走的是向外物化之路，但其最底层的逻辑都是一样的。人类的确可以在一定程度上改造自然，但这种改造绝不能是破坏性的，不是逆天而行，而是顺势而为。中国古人的智慧总会给人深奥玄乎的印象，殊不知，大道既是无形，大道亦是至简。","所以，祈福祈福，神灵的能量所系，无外乎是规律。而我们要做的，是探寻这世界的规律，进而将其转化为指导人类活动的规则，再以对自然的各种仿造，具化为各种具象的技术和法律，并支持开展商业活动——所谓的工业、农业、服务业等等最终都可以归结为更广义概念的商业之中。哲学在顶层维度，法律、技术支撑完整的商业环境，沉淀下来横向维度的信息，人类世界就在这样的架构里沧海桑田。","属于2018年的终归要留在2018年。","聪明的，祈祷我们的2019年，一切变得更好。"],"sum":"《说文解字》说：祈，求福也。从示斤聲。白话意为：向神灵求福。字形采用"},{"n":162,"c":"别","d":"2019.6.26","lead":"《说文解字》说：別，分解也。从冎，从刀。白话意为：屠夫用屠刀将动物的骨与肉分离。听上去就觉得十分疼，是不是？古人造字，用意真是直接。","body":["人生总有很多的离别。中国文人擅长将离别入诗入词，风格也是各异。有“多情自古伤离别，更那堪冷落清秋节”的凄冷，有“一别都门三改火，天涯踏尽红尘”的洒脱，也有“仰天大笑出门去，我辈岂是蓬蒿人”的傲然，更有“醉卧沙场君莫笑，古来征战几人回”的英雄气。","朋友之间，有“莫愁前路无知己，天下谁人不识君”的宽慰，有“劝君更尽一杯酒，西出阳关无故人”的唏嘘，有“执手相看泪眼，竟无语凝噎”的不舍，也有“桃花潭水深千尺，不及汪伦送我情”的深情厚谊，更有“相逢一醉是前缘，风雨散、飘然何处”的豪放。","人生就是如此，走走停停，一路风景无限。","聪明的，多年以后再相逢，愿你我，别后无恙。","[end]"],"sum":"《说文解字》说：別，分解也。从冎，从刀。白话意为：屠夫用屠刀将动物的"}];

const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pad = n => String(n).padStart(3,'0');

const grid = $('#grid');
const cardHTML = a => `<a class="scard" href="#s${pad(a.n)}">
  <div class="scard-no">${pad(a.n)}</div>
  <div class="scard-ch"${a.c.length > 2 ? ' style="font-size:26px"' : ''}>${esc(a.c)}</div>
  <div class="scard-sum">${esc(a.sum)}…</div>
</a>`;
function renderList(kw){
  kw = (kw || '').trim();
  const rows = kw ? D.filter(a => a.c.includes(kw) || a.lead.includes(kw) || a.body.join('').includes(kw)) : D;
  grid.innerHTML = rows.length ? rows.map(cardHTML).join('')
    : '<div class="empty" style="grid-column:1/-1">这片叶子上还没有这个字，换一个字试试。</div>';
}
renderList();
$('#q').addEventListener('input', e => renderList(e.target.value));

function renderDetail(n){
  const a = D.find(x => x.n === n); if(!a) return;
  const pre = D.find(x => x.n === n - 1), nxt = D.find(x => x.n === n + 1);
  const body = a.body.map((p, i) =>
    `<p class="${i === a.body.length - 1 && /^聪明的/.test(p) ? 'last' : ''}">${esc(p)}</p>`).join('');
  $('#dbody').innerHTML = `
    <div class="dhead">
      <div class="dhead-no">第 ${pad(a.n)} 个字</div>
      <div class="dhead-ch">${esc(a.c)}</div>
      <div class="dhead-date">初稿 ${esc(a.d)}</div>
    </div>
    <div class="prose">
      <p class="lead">${esc(a.lead)}</p>
      ${body}
    </div>
    <div class="dfoot">
      ${pre ? `<a href="#s${pad(pre.n)}">← ${esc(pre.c)}</a>` : '<a class="ghost">←</a>'}
      <a class="mid" href="tonghua.html#p${pad(a.n)}">读这个字的童话诗 →</a>
      <a class="mid" href="shuqian.html#q${pad(a.n)}">看这个字的书签诗 →</a>
      ${nxt ? `<a href="#s${pad(nxt.n)}">${esc(nxt.c)} →</a>` : '<a class="ghost">→</a>'}
    </div>`;
}
function route(){
  const m = location.hash.match(/^#s(\d{1,3})$/);
  if(m){
    document.body.classList.add('in-detail');
    renderDetail(parseInt(m[1], 10));
  } else {
    document.body.classList.remove('in-detail');
  }
  window.scrollTo(0, 0);
}
function back(e){ if(e) e.preventDefault(); location.hash = ''; }
window.addEventListener('hashchange', route);
route();
document.addEventListener('keydown', e => {
  const m = location.hash.match(/^#s(\d{1,3})$/); if(!m) return;
  const n = parseInt(m[1], 10);
  if(e.key === 'ArrowLeft' && n > 1) location.hash = '#s' + pad(n - 1);
  if(e.key === 'ArrowRight' && n < 162) location.hash = '#s' + pad(n + 1);
});

</script>
</body>
</html>
