<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>auth probe</title></head>
<body style="font-family:monospace;white-space:pre;padding:16px"><div id="out">probing…</div>
<script src="sdk/workbuddy-cloud-sdk.js"></script>
<script>
var FC = { endpoint: "https://wbapp-eq8akyv0azugdhn1phnulk.app.workbuddy.host", pk: "wbpk_eq8AkyV0azugdhn1pHNuLK_zN0XPa8NArBP8KeLvgz30qQmiZTDrzh0" };
var out = document.getElementById("out"), L = [];
function log(s){ L.push(s); out.textContent = L.join("\n"); }
(async function(){
  try {
    var cloud = WorkBuddyCloud.createWorkBuddyCloud({endpoint: FC.endpoint, publishableKey: FC.pk});
    log("SDK ok");
    try { var s = await cloud.auth.getSession(); log("getSession: " + JSON.stringify(s).slice(0,200)); }
    catch(e){ log("getSession ERR: " + ((e.error&&e.error.code)||"") + " " + ((e.error&&e.error.message)||e.message)); }
    try { var u = await cloud.auth.getUser(); log("getUser: " + JSON.stringify(u).slice(0,200)); }
    catch(e){ log("getUser ERR: " + ((e.error&&e.error.code)||"") + " " + ((e.error&&e.error.message)||e.message)); }
    // 一次最小 LLM 调用
    try {
      var t = "";
      for await (var ch of cloud.llm.chat.completions.create({model:"hy4std", messages:[{role:"user",content:"说：在"}], stream:true})) {
        var d = ch.choices[0] && ch.choices[0].delta; if (d && d.content) t += d.content;
      }
      log("LLM OK: " + t.slice(0,30));
    } catch(e){ log("LLM ERR: " + ((e.error&&e.error.code)||"") + " " + ((e.error&&e.error.message)||e.message)); }
    log("=== done");
  } catch(e){ log("FATAL " + e.message); }
})();
</script></body></html>
