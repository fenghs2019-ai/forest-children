const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const idx = id => D.findIndex(x => x.i === id);
const go = id => { location.hash = '#p' + id; };
function pad(n){ return String(n).padStart(3,'0'); }
function applyFilter(kw){
  kw = (kw||'').trim();
  let shown = 0;
  document.querySelectorAll('[data-char]').forEach(el => {
    const hit = !kw || el.dataset.char.includes(kw) || (el.dataset.kw||'').includes(kw);
    el.style.display = hit ? '' : 'none';
    if (hit) shown++;
  });
  const em = $('#empty'); if (em) em.style.display = shown ? 'none' : 'block';
}
function route(){
  const m = location.hash.match(/^#p(\d+)/);
  if (m && idx(m[1]) >= 0) { showDetail(m[1]); }
  else { showList(); }
}
window.addEventListener('hashchange', route);
window.addEventListener('DOMContentLoaded', () => { renderGrid(); route(); });
document.addEventListener('keydown', e => {
  if (!document.body.classList.contains('in-detail')) return;
  const cur = (location.hash.match(/^#p(\d+)/) || [])[1];
  if (!cur) return;
  const k = idx(cur);
  if (e.key === 'ArrowLeft' && k > 0) go(D[k-1].i);
  if (e.key === 'ArrowRight' && k < D.length-1) go(D[k+1].i);
});

function renderGrid(){
  $('#grid').innerHTML = D.map(x => `
    <a class="bm" href="#p${x.i}" data-char="${esc(x.c)}">
      <div class="bm-txt">${x.ex.map(l => esc(l)).join('<br>')}</div>
      <div class="bm-ft"><span>第 ${x.i} 张</span><span class="bm-ch">${esc(x.c)}</span></div>
    </a>`).join('');
  $('#q').addEventListener('input', e => applyFilter(e.target.value));
}
function showList(){
  document.body.classList.remove('in-detail');
  $('#detail').innerHTML = '';
  window.scrollTo({top:0, behavior:'instant'});
  document.title = '书签小诗 · 森林的孩子';
}
function showDetail(id){
  const k = idx(id), x = D[k];
  document.body.classList.add('in-detail');
  $('#detail').innerHTML = `
  <div class="b-wrap">
    <a class="d-back" href="#" onclick="history.pushState('','',location.pathname);showList();return false;">← 返回书签小诗</a>
    <div class="b-big">
      <div class="b-big-txt">${x.ex.map(l => esc(l)).join('<br>')}</div>
      <div class="b-big-ft">第 ${x.i} 张 · ${esc(x.c)}</div>
    </div>
    <div class="b-acts">
      <a class="primary" href="tonghua.html#p${x.i}">读这首完整的童话 →</a>
      <a class="ghost" href="shuowen.html#p${x.i}">看这个字的一字一解</a>
    </div>
    <div class="d-nav">
      ${k > 0 ? `<a href="#p${D[k-1].i}">← 上一张</a>` : '<span class="sp"></span>'}
      ${k < D.length-1 ? `<a href="#p${D[k+1].i}">下一张 →</a>` : '<span class="sp"></span>'}
    </div>
  </div>`;
  window.scrollTo({top:0, behavior:'instant'});
  document.title = x.c + ' · 书签小诗 · 森林的孩子';
}

</script>
