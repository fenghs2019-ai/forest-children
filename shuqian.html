<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>书签小诗 | 森林的孩子</title>
<link rel="stylesheet" href="forest.css">
<style>
#detail{display:none}
body.in-detail #listView{display:none}
body.in-detail #detail{display:block}
body.in-detail .phead,body.in-detail .tbar{display:none}
.dwrap{max-width:760px;margin:0 auto;padding:0 40px 100px}
.back{display:inline-flex;align-items:center;gap:6px;margin:26px 0 0;font-size:12.5px;color:var(--ink3);text-decoration:none;font-family:var(--sans);letter-spacing:1px;transition:color .2s}
.back:hover{color:var(--forest)}
.dhead{text-align:center;padding:8px 0 34px;border-bottom:1px solid var(--p3);margin-bottom:44px}
.dhead-no{font-size:11px;letter-spacing:4px;color:var(--gold);font-family:Georgia,serif;margin-bottom:10px}
.dhead-ch{font-family:var(--kai);font-size:clamp(84px,13vw,132px);line-height:1.05;color:var(--forest);letter-spacing:4px}
.dhead-date{font-size:11.5px;color:var(--ink3);letter-spacing:1px;font-family:var(--sans);margin-top:14px}
.prose{font-family:var(--song);font-size:16.5px;line-height:2.15;color:var(--ink);letter-spacing:.3px}
.prose p{text-indent:2em;margin-bottom:22px;text-align:justify}
.prose p.lead{text-indent:0;background:var(--p2);border-left:3px solid var(--gold);border-radius:0 12px 12px 0;padding:22px 26px;color:var(--ink2);font-size:15.5px;line-height:2.05;margin-bottom:32px}
.prose p.last{color:var(--forest)}
.dfoot{margin-top:56px;padding-top:30px;border-top:1px solid var(--p3);display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
.dfoot a{font-size:13px;color:var(--ink2);text-decoration:none;font-family:var(--sans);padding:9px 16px;border:1px solid var(--p3);border-radius:10px;transition:all .2s;background:#fff}
.dfoot a:hover{border-color:var(--forest);color:var(--forest)}
.dfoot .mid{color:var(--gold);border-color:transparent;background:transparent}
.dfoot .mid:hover{background:var(--p2);color:var(--gold)}
.dfoot .ghost{opacity:.3;pointer-events:none}
@media(max-width:600px){
  .dwrap{padding:0 22px 76px}
  .prose{font-size:16px;line-height:2.05}
  .prose p.lead{padding:18px 20px;font-size:15px}
  .nav{padding:0 12px}
  .nav-links{gap:0}
  .nav-link{padding:6px 7px;font-size:11.5px}
  .nav-logo-en{display:none}
  .nav-cta{display:none}
  .dfoot{justify-content:center}
}


.tabs{display:flex;gap:8px;background:var(--p2);padding:5px;border-radius:13px}
.tab{border:0;background:transparent;padding:9px 18px;border-radius:9px;font-size:13px;color:var(--ink2);font-family:var(--sans);cursor:pointer;letter-spacing:1px;transition:all .22s}
.tab.on{background:#fff;color:var(--forest);box-shadow:0 1px 6px rgba(42,33,24,.09);font-weight:600}
.sqgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:14px}
@media(max-width:960px){.sqgrid{grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:11px}}
@media(max-width:600px){.sqgrid{grid-template-columns:repeat(4,1fr);gap:9px}}
.bm{position:relative;background:#fff;border:1px solid var(--p3);border-radius:12px;aspect-ratio:1;display:flex;align-items:center;justify-content:center;text-decoration:none;color:inherit;transition:transform .25s,box-shadow .25s,border-color .25s;overflow:hidden}
.bm:hover{transform:translateY(-3px);box-shadow:var(--sh2);border-color:var(--f3)}
.bm-ch{font-family:var(--kai);font-size:40px;line-height:1;color:var(--forest);letter-spacing:0}
@media(max-width:600px){.bm-ch{font-size:29px}}
.bm:nth-child(4n+2) .bm-ch{color:var(--gold)}
.bm:nth-child(4n+3) .bm-ch{color:var(--sky)}
.bm:nth-child(4n+4) .bm-ch{color:var(--rust)}
.bm-no{position:absolute;right:8px;bottom:5px;font-size:9px;color:var(--ink3);letter-spacing:1px;font-family:Georgia,serif;opacity:.55}
.bm::after{content:'';position:absolute;left:50%;bottom:0;transform:translateX(-50%);width:0;height:0;border-left:9px solid transparent;border-right:9px solid transparent;border-bottom:9px solid var(--p)}
.tggrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:22px}
.tg{background:#fff;border:1px solid var(--p3);border-radius:16px;padding:26px 24px;text-decoration:none;color:inherit;display:block;transition:transform .28s,box-shadow .28s;position:relative;overflow:hidden}
.tg:hover{transform:translateY(-3px);box-shadow:var(--sh2)}
.tg-ch{font-family:var(--kai);font-size:40px;color:var(--forest);line-height:1;margin-bottom:12px}
.tg-sub{font-family:var(--kai);font-size:14.5px;color:var(--gold);letter-spacing:2px;margin-bottom:10px}
.tg-dsc{font-family:var(--song);font-size:12.5px;line-height:1.95;color:var(--ink3);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tg-meta{margin-top:16px;font-size:10.5px;color:var(--ink3);letter-spacing:1px;font-family:var(--sans)}
.bmd{background:#fff;border:1px solid var(--p3);border-radius:4px 4px 20px 20px;overflow:hidden;margin-top:26px}
.bmd-top{height:7px;background:linear-gradient(90deg,var(--f3),var(--forest))}
.bmd-in{padding:48px 40px 40px;text-align:center}
.bmd-ch{font-family:var(--kai);font-size:19px;color:var(--gold);letter-spacing:6px;margin-bottom:26px}
.bmd-txt{font-family:var(--kai);font-size:clamp(19px,2.6vw,24px);line-height:2.35;color:var(--ink);letter-spacing:2px;white-space:pre-line}
.bmd-no{margin-top:34px;font-size:10.5px;color:var(--ink3);letter-spacing:3px;font-family:Georgia,serif}
.twd-title{text-align:center;padding:6px 0 26px;border-bottom:1px solid var(--p3);margin-bottom:38px}
.twd-ch{font-family:var(--kai);font-size:clamp(52px,8vw,76px);color:var(--forest);line-height:1.1;letter-spacing:4px}
.twd-sub{font-family:var(--kai);font-size:16px;color:var(--gold);letter-spacing:3px;margin-top:14px}
.twd-tag{font-size:10.5px;color:var(--ink3);letter-spacing:2px;font-family:var(--sans);margin-top:12px}
.d-audio{margin:-18px 0 34px;background:#fff;border:1px solid var(--p3);border-radius:14px;padding:14px 18px}
.d-audio-l{font-size:10.5px;letter-spacing:2px;color:var(--gold);font-family:var(--sans);margin-bottom:8px;display:flex;align-items:center;gap:6px}
.d-audio-l::before{content:'';width:12px;height:1px;background:var(--gold)}
.d-audio audio{width:100%;height:38px;accent-color:var(--forest)}
.sec-no{font-family:Georgia,serif;font-size:13px;color:var(--gold);letter-spacing:3px;margin:38px 0 16px;text-align:center}
.vline{font-family:var(--kai);font-size:16.5px;line-height:2.05;margin-bottom:7px;color:var(--ink);letter-spacing:.5px}
@media(max-width:600px){
  .tggrid{grid-template-columns:1fr}
  .bmd-in{padding:32px 20px 28px}
  .bmd-txt{line-height:2.2}
  .bm-no{font-size:8px;right:6px;bottom:4px}
  .vline{font-size:15.5px;line-height:2}
}
</style>
</head>

const W = [{"n":84,"c":"湖","series":"","lines":["天鹅","千年之前的故事","被写进经典","千年之后的故事","还在继续","1","天鹅。","一直以为只是自己前生曾经魂牵梦系的一个单词。","惊叹于天鹅的美丽。","惊叹于天鹅的宿命——","注定从至丑而化来，炼化的痛苦终于——","羽化为圣洁的美丽。","2","她爱极了美丽的天鹅，","但只有在离开皇宫很远的一个小芦苇塘里，","偶尔可以看见。“偶尔”，不是因为天鹅少见，","是她很少会得到父王的准许可以离开皇宫到那里去。","看见美丽时，人们都会想到占有。","即使是象她这般纯洁的小女孩也不例外。","于是她让人在皇宫的园子里挖了好大的一个池塘。","——以至于都不可以再称它做池塘。","那是一面湖。","静寂的湖。","她想尽办法将天鹅们引到这里，她不会强迫天鹅们。","几乎是哀求天鹅的到来。","然后这湖的静寂被吸引来的天鹅打破。","3","设计这湖的是王国里很有才华的一个年轻人。","他并不英俊。","他甚至说话时还有些结巴。","但是她发现——也只有她发现了：","他的眼睛里闪着幽蓝色！","父王派人把他叫到她面前。","她说要建一个从来没有过的大池塘，","好让她心爱的天鹅可以在这里栖息。","听到天鹅时，他的身子有了一丝颤抖。","沉思了很久，他说：“不如建一个湖吧。象我家乡的湖。”","说这话时，他抬起头来，于是她看见，","他的眼睛里是一片蓝色，蓝的象后来建起来的湖。","“那好吧，就建一个湖。”","“谢谢你。”","于是她看见他眼底的蓝色涌动起来，并且象光一样闪烁着，闪烁着令人心疼的伤感。","然而满足与感激却写在他有点过于硬朗的脸上。","他近乎无礼地凝视着她很久，她眨着眼睛躲避那深邃的目光。","因为她发现这样的凝视让她不由的想去抚摩那张脸上的棱角。","4","湖的工程很浩大。","她总是每天来看她的湖，她很担心湖不够大。","她甚至想让湖大得足以让全世界的鸟儿都可以到这里来栖息。","看见鸟儿飞翔的翅膀划过天空留下的痕迹，","是对自己心灵的一种慰籍。","——她总是觉得自己心上有好多的纹路，","好多在深夜里刺痛自己的纹路，","需要一些别的什么东西来熨烫平整。","年轻人从自己的家乡找来好多工人，","每天与他们在一起为这湖的工程而忙碌。","工人们对国王并没有什么好与不好的印象，","对于离乡好远来到皇城里工作也没有兴趣。","他们为能自由地活着而骄傲。","年轻人对他们说：公主要建一个湖，","一个很大的湖，象我们家乡的那个湖。","可以让无家可归的天鹅来这里栖息。","于是很多人默默地收拾了行装跟着他来了这里。","王国里有两条大河：日河、夜河。","年轻人打算将日河的水引进来，再让水流进夜河，","而这水在湖里一定要平静。","水只能在湖底流动。","工程进行了两个年头。","5","夜晚如期来临，无法阻挡。","就象一种叫做爱的东西，来了，就没有办法送回去。","她听见他的同乡亲切地叫他笛子。","她想：笛子？那该是一种乐器呀。","他听见她的母后慈祥地叫她丝莞。","他想：丝莞？那是家乡天鹅的名字呀。","那是怎样的一个夜晚？！","公主无法忘记。","入夜许久了，却仍然睡不着，想着她的湖，就兴奋不已。","起身推开窗，就看见了月亮下的湖。","这湖一直延伸到我的窗下呀！","月色淡淡的，象一团纱，包着这美丽的湖。","湖边有几点灯火，推开窗子，还似乎听见了一种飘渺的乐声。","丝莞睡不下，便干脆披上披肩走出来，","循着那点点灯火，循着歌声而去。","越来越近了，音乐声也越来越响。","欢快的音乐，夹杂着工人们的笑声，","间或一些酒肉的香气。","丝莞的心开始随着这音乐砰然起来。","她提起宽大的裙的裙边，两只小脚踮起来跑着，","脚下是凉冰冰的鹅卵石，被湖水洗过了，","丝丝柔柔的象绒布一样却又比绒布光滑了许多。","终于看见了这篝火。","丝莞不禁叫了出来：好呀！！……","篝火边的音乐突然静了下来。","人们停止了舞蹈，饮酒，唱歌……","这些人静静地看着公主，楞在那里。","太美了！","笛子轻轻笑了笑，慢慢站起来，走到公主面前，","“这么晚了，还……还不睡？”","“我听见你们在唱歌呀！”","笑起来的时候鼻子就很好看地皱起来几个褶。","“对不起，我……我们，太吵了。”","“没有呀，我很喜欢听呀！”","“是吗？”","“刚才的笛子是你吹的吗？”","“……”","“比宫里的乐师吹的好听多了，你在那里学的，可以教我吗？","“你们跳的舞蹈可以教我吗？那个大婶抱的孩子好漂亮呀！","“哎，大叔，你喝的是什么呀？”","“我……”","终于有人忍不住乐出了声，","“笛子，我们老看见这小女孩在湖边晃来晃去的，","“敢情是你认识的呀！”","“对呀，笛子，她是谁呀？”","“小妹妹，你叫什么呀？”","“小姑娘，你可真漂亮，你就住在这皇宫里吗？”","“…… …… ……”","“好了，好了，都……都别吵了！”","笛子急红了脸。“她，她是，公主……”","“对呀，我是公主身边的侍女丝莞呀！”","“哦，你叫丝莞，那不就是天鹅吗？”","“哎，长的可真有天鹅那么漂亮呀！”","“来，到大婶这里来，别让这些家伙的酒气熏臭了我们的小姑娘。”","“大婶，你是怕我们跟你家笛子抢这姑娘吧，","“别担心，我们那里比得上笛子呀！是吧？”","“对呀，哈哈哈哈哈哈……”","笛子指着丝莞跟大家说：","“不是，她，她，她不是……”","“你就承认了吧，还说不是你的情人，不是，人家天天跑过来看你？！”","“我，我我，她，是……”","丝莞忽然就挽住了笛子，","“你们不要欺负他！”","“瞧吧，小比得，人家笛子可是有人护着的，","“今后你可不要欺负笛子了。”","“我那里敢呀，我也去找个姑娘来陪我，来呀，姑娘们！”","几个姑娘跑上去，几下就把比得弄倒在地上，","开始将酒撒在他身上，欢笑又开始了。","“来吧，孩子们，给我们的丝莞姑娘露几手！”","音乐又开始了。","笛子挠挠头，“好吧，随你！”","笛声加入了喧闹里，立刻使音乐更加动听起来。","丝莞忽然就觉得心底的纹路开始被轻轻地很舒服地熨平了。","美丽的夜晚……","6","早上，丝莞起来的时候，头还有一点沉。","“你，你是……，头一次，喝酒呀？”","笛子端着母亲做的早餐到帐篷里看她。","目光就那样地对着，凝视。","于是微笑泛在嘴角，在整张脸上荡漾起来。","这晚以后，丝莞就天天到笛子他们的宿营地来。","与他们一起唱歌跳舞喝酒，有时干脆就住下了。","好在她的寝宫离父母的寝宫都很远，","父母对她也从来都是听之任之，溺爱的很。","终于有一天，笛子结结巴巴地对她说出了她等待已久的话：","“我，我要向你父王求婚。”","丝莞整个人便倒在了湖边的草地上。","7","丝莞原以为此事会被父母大力反对，","并且作好了抗争的准备，包括偷偷藏了好多吃的，","准备在宣布绝食抗议时偷偷享用。","出乎意料，很顺利。","她的父王母后对笛子这个年轻人很放心，","也很喜欢这个不会夸夸其谈、却会用音乐打动人心的小伙子，","而且他们从来不认为身份有什么贵贱之分。","婚礼定在下个月，与天鹅湖竣工典礼一起举行。","8","战争突然爆发。","邻国对这片富饶的土地垂涎已久，终于找了个借口，发兵了。","首当其冲的，是笛子的家乡小镇。","乡亲们纷纷收拾行装，准备回去保卫家园。","国王下令，婚礼暂时取消，一切平息后再说。","国王把笛子叫到面前：","“我的孩子，你不必回去了，留在宫里陪你未来的妻子。","“你的母亲也一起留下。”","然而笛子很倔强地，象是受到了莫大的侮辱似地站起来说：","“不，决不！”","“什么？”","“我，我也要回去战斗，我要象个男子汉一样，","“绝对不会胆小地在敌人面前退缩。”","“不，这是我的命令！是我作为国王的旨意！”","“那我只好违抗您的命令，我尊敬的国王陛下！”","“可你的妻子怎么办？你就这样扔下她？”","“……”","“父王，您让他自己决定吧，我，我不会阻拦他！”","丝莞从后殿跑了出来。","老国王黯然许久。","清晨。","一队士兵已经集合好，带队的是笛子。","目的地是王国边上的小镇。","队伍走了。","留在原地的是公主。","流在公主脸上的是泪。","泪光折射的是初升的阳光，与希望。","9","夏天转眼过去了，令人觉得它好短暂——象短暂的幸福一样。","秋天来了。","湖水渐渐变冷，变的浅浅的。","湖边被笛子安排种上的芦苇开始泛出黄色来，","草地的绿色还在坚强地绿着，却明显地力不从心，","无法逃脱秋风的侵蚀，令人心碎地露出草皮下的土地，","班驳的象生了某种病。","丝莞仍然每天都到湖边来，看她的湖，她的天鹅。","她已经将这里的几十头天鹅都起了名字。","母后很奇怪她是如何将长得都一样的天鹅分辨得那么清楚的。","然而丝莞从来不会认错。","天鹅们开始迁徙了。","成群的天鹅结成队伍，向天空飞去，向南方飞去。","秋天特有的湛蓝色天空被成群的白色的天使般的天鹅点缀着。","飞得太高了。","丝莞站在地面上扬起头盯着看时，","会觉得那些白色的点是凝在空中的。","天鹅都离开了，除了两只。","那是一对。","丝莞发现湖边的芦苇塘里有白色的影子在晃动，走进去看。","刚走近就有一只雌天鹅扑拉拉地飞起来，","很凶的样子，拦着去路。","丝莞被吓了一跳。","天鹅认出丝莞后平静下来，带着丝莞走进芦苇荡深处。","在破草堆上丝莞看见了一只受伤的雄天鹅。","雄天鹅的翅膀受了伤，留下来，雌的一只也不肯离开。","天气冷了起来。","丝莞把他们带回了宫里。","可是雄天鹅的伤太重了，也太久了。","他一天天地憔悴下去，丝莞也跟着憔悴。","终于在一天早上，当丝莞醒来的时候……","天鹅被葬在湖边。","埋葬的时候，另外的那只雌天鹅默默地象雕像一样,","站在那里看着土洒在爱侣的身上，直到看不见。","丝莞转过身，招呼天鹅，我们走吧。","雌天鹅还是一动不动。","丝莞半转着身子站着，看着雌天鹅的样子，","眼中就流出泪来。","为什么偏偏死的是这一只？","丝莞没有对人说过，她给这一对天鹅起的名字是什么。","是笛子与丝莞。","从葬了天鹅之后，丝莞就每天抱着雌天鹅在湖边走来走去。","象是在等待着什么。","国王忙于应战，只有皇后每天都到丝莞这里来照看她。","丝莞每天都在不停地瘦下去。","每天都在流泪。","一天早上醒来时，丝莞发现天是黑色的。","她很快明白了一件事。","“我再也见不到笛子的模样了。”","10","战争的规模扩大了。","王国动用了所有可以调动的军队与人民来抵抗侵略。","前线传来的消息却令人担忧。","王国和平了太多的年头，人们已经快忘记了战争。","而敌国却一直在处心积虑地窥视着这个美丽的国度。","战争残酷的很。","好多年轻人倒在了自己的国土上，","他们的尸体堆在夕阳下的山坡上，","山坡下是王国的边界。","敌人始终没能突破防线。","笛子在战场上迅速成长为一名勇士。","已经用钝了14把剑，用破了8面盾牌，","换来的是士兵们对他的信任与尊敬。","笛子用自己的智慧指挥着战斗。","前线激烈的战争使笛子的智慧得以无限发挥，","各种武器与各种战斗方法层出不穷。","到了夜晚，笛子会拿出自己心爱的竹笛来，","于是悠扬的笛声便会在军营里响起。","笛子每天在战斗间歇不停地写。","写两样东西。","一种是作战的笔记，记录了他的作战思想、武器发明、阵法……","一种是写给丝莞的情书。","11","又一个春天来了。","天鹅成群地飞了回来。","勇士们带着身上的伤痕与未干的鲜血与骄傲回到了家乡。","敌国终于在顽强的抵抗面前认输了，","或者说是因为笛子安排的刺杀敌国国王的行动的成功。","笛子通过探子的线报知道了敌国国王的行踪。","他安排了一次绝美的刺杀。","当剑从那个暴君的脖子贯穿过去时，","笛子仿佛看见了自己美好的未来，王国美好的明天。","刺杀行动成功。只是——笛子在撤退时失散了。","当将军跪在皇宫的大殿上说出这个消息时，","丝莞从椅子上滑了下去，昏倒在地上。","12","丝莞变得更加沉默。","每天在湖边坐着，抚摩每一只天鹅。","春天的湖好美！","清澈的湖水，青青的草地。","13","丝莞死了。","14","宫女们在湖边发现了丝莞。","她静静地躺在那里，安详地，象睡去了一样。","在丝莞身边的是那只雌天鹅——也叫丝莞。","雌天鹅扬了扬翅膀，飞到空中，收起来，就那么直坠下来。","落在丝莞的旁边，一样地美丽。","丝莞的葬礼上有好多人主动来参加。","丝莞躺在人们用手编织的花架上，","洁白的婚纱是皇后为女儿出嫁准备了许久的。","送葬的队伍好长。人们在湖边不停地绕。","当队伍绕到第10圈的时候，","有人拦住了队伍。","是笛子！","满身的血迹，疲惫的身形。","却是明亮的眸子。","有晶莹的闪光。","笛子坚决不相信丝莞已经走了。","他坚持认为丝莞不过是在睡觉。就那么抱着丝莞。","坐在湖边，不停地说。","坐到天黑，天又明。","笛子在一个深夜消失了。","留给国王一封信，谢绝了继承王国的好意。","一起带走的是丝莞。","15","后来，人们在很远的地方的一个大湖，","经常看见一个吹笛子的人，与天鹅为伴。","再后来，有一天，","皇宫的湖里从很远的地方飞来两只天鹅。","非常的美丽。","大家都说，那就是笛子与丝莞。","END"],"aud":"","len":4706},{"n":125,"c":"城","series":"看不见的城市","lines":["看不见的城市 | 城市与海洋","——伊丝里城","向伟大的卡尔维诺致敬","源自于他那天马行空的思维","我们才得以","在蓝色的海洋里","找到绿色的伊丝里城","所有现存的地图里都找不到伊丝里城的具体坐标，人们甚至怀疑她是否存在。但是，所有的资深游者都知道她的存在。他们还知道该在哪个特殊的季节、特殊的日子，顺着哪一条洋流航行，在蓝色的海洋里找到那一片绿色的漩涡，然后收锚、降帆，停下所有的动力，让船顺着漩涡落进伊丝里城。","伊丝里城的房子都是用贝壳建造的，那贝壳又是活的树叶。伊丝里城有一片森林，居民们会在秋天摘下树叶，树叶离开树枝的时候会变成贝壳蜷缩起来，包裹着的空间很大，足够住下一家人。伊丝里城的居民会在春天给每片新长出的树叶编号，用一长串咒语般的符号记录在长长的卷轴上。谁也不知道，那么多的树叶他们是如何辨识和标识的。所有的树叶在变成贝壳后，会仍然带着那个编码，稍稍变形后，成为伊丝里城的街道门牌号；每个伊丝里城的居民都会选择自己喜欢的方式，把自己家的编码编进自己的草帽里，或者缝在衣服边上，还有人会编成一个花环，一直漂浮在自己的头顶上。","伊丝里城的森林深处，有一座用无数苍老的贝壳建造的高塔，藏着所有的卷轴。伊丝里城最老的长老和最年轻的孩子一起守护这些卷轴，他们俩每天都在把长长的卷轴抄一遍，长老看不清的地方，会让孩子给他念出来。他们会在夏天抬着装满原始卷轴的箱子走到河边，去清洗那些卷轴；他们会在冬天抬着装满抄写卷轴的箱子走进山洞，埋起来。","游者和他雇佣的水手们，总是浑身湿漉漉地从天上掉下来，他们的船只能在天上停泊。伊丝里城的居民熟稔外来游者的各种语言，主要是用来讨价还价。伊丝里城的贝壳比所有的黄金都贵重、比所有的珍珠都贵重。但是那些贝壳，在离开伊丝里城的时候，就会彻底睡去，再也变不回树叶。所以，伊丝里城的树叶才是最珍贵的。","海洋里的城市越来越多，人们渐渐喜欢上海洋，开始遗忘那些陆地上的城市。","游者眼含热泪，高声赞美伊丝里城的美丽和奇幻。然而他们不知道，伊丝里城的高塔里藏着一条小路，可以一直通往陆地上那些被遗忘的城市。当然了，伊丝里城的居民们，从来不会说破这一点。"],"aud":"audio/tw125.mp3","len":870},{"n":126,"c":"雾","series":"看不见的城市","lines":["看不见的城市 | 城市与海洋","——欧尼克斯","向伟大的卡尔维诺致敬","源自于他那天马行空的思维","我们才得以","在蓝色的海洋里","找到紫色的欧尼克斯城","欧尼克斯城是漂浮在海上的紫色城市。","欧尼克斯城的动力，来自于城市中心一个巨大的杂货铺：迭塔铺。欧尼克斯城中心广场的正中间有一根石柱，上面刻着：众神眷爱欧尼克斯。迭塔铺就在这根石柱的南面。没有人知道现任的主人是迭塔家族的第几代传人。老迭塔有着长长的花白胡子，晴天的时候，老迭塔会坐在门口的躺椅上，有十二个小小姑娘围着他，给他一根一根地梳理胡子、编成辫子。老迭塔还雇了十二个小伙子做帮手，他们每天都扛着各种大小不等的箱子，出出进进，箱子都上着锁，谁也不知道箱子里装的是什么，即使是市长欧尼克斯先生也没有权力去打开那些箱子。每个箱子都配有一把独特的钥匙，那些钥匙就挂在老迭塔的胡子上。","迭塔铺的地下有四通八达的管道，从迭塔铺的地下室穿过城市的底部，深深插入海水里。谁也不知道那些管道会通往哪里，谁也没有看到过那些管道的尽头。","每天晚上，迭塔铺都紧闭大门，灯火通明。老迭塔会启动那台古老而巨大的蒸汽机，十二个小伙子赤着上身，奋力把燃料添进炉子里。蒸汽机开始工作时，老迭塔会打开账本，高声指挥所有的孩子们干活。十二个小小姑娘用灵巧的手指从老迭塔的胡子辫上摘下那些钥匙，把铺子里的那些箱子一个一个地打开，那些箱子和钥匙上并没有编号，可是小小姑娘们从来没有拿错过钥匙。十二个小小姑娘再把箱子里的货物一件一件地放进管道里，那些管道上也没有编号，可是小小姑娘们也从来没有送错过货物。","蒸汽机的燃料是老迭塔家族用一种独特的方法制作的。老迭塔每年春天都会乘着自己的飞艇，带着十二个小伙子到天上去，钻进云彩里。七天以后，欧尼克斯城上空的云彩快全部消失的时候，飞艇降落在迭塔铺的屋顶，十二个小伙子会扛着酒桶一样的木桶，从飞艇上下来走进地下室。谁也不知道老迭塔是如何把云彩变成燃料的。每天清晨，蒸汽会从城市角落里的喷气孔喷出来，变成欧尼克斯城独有的紫色的雾。","有了迭塔铺的蒸汽机，欧尼克斯城就可以在海上任意航行。欧尼克斯城的居民们喜欢驾驶着城市去周游世界，他们按照自己喜欢的方式制作年历，每一个欧尼克斯年都划分成三个季节：趴泊季、船行季、雷雨季。趴泊季的时候，欧尼克斯城会找到鱼群聚集的地方停下来，居民们会在城市边上放下各自家里的小船，出海打渔；船行季的时候，欧尼克斯城会顺着风向穿行在洋流中，居民们会登上各个大陆去其他的城市游玩；雷雨季的时候，欧尼克斯城会冒着雷雨在海洋上航行，寻找并解救那些被困在雷雨里的船只。","那些真正的资深游者，会在地图上标出一条紫色的线，用来标注欧尼克斯城的航行路线，因为他们知道，欧尼克斯城会为所有的海上游者提供庇护。"],"aud":"audio/tw126.mp3","len":1117},{"n":109,"c":"归","series":"归去来兮","lines":["归去来兮-归","夕阳拖长的影子，在石板路上蜿蜒。","像黑色的蛇，爬过记忆的角落。","从走进镇子开始，她就在不停吟唱一段歌谣。","归去来兮","田园将芜胡不归","归去来兮","息交绝游随我归","青衣过处，街道两旁的人群，四散奔逃。","一路追杀而至的道士，御气甩动拂尘，丝丝如针。","她丝毫不理，随手化解，一双明眸只盯住前方。","路中一把藤椅，白衣散发，兀自手执酒囊痛饮。","被击退的拂尘尚未散尽，一根禅杖破空而至，直刺她身后。","你终于起身，怒喝：何至于此！","罡气鼓荡，将青衣罩入。","禅杖碰壁，落地叮当作响。","——我已寻你三载，半月前回此地等你，怎么才来？","——为何寻我？为何等我？","自然是为不再负你，何必明言……","伊人伸手，你递过空酒囊，默念一诀，九天之上有云凝结。","五洋之水千年陈酿，自云端倾泻如雨。","你低声轻和同律歌谣。","归去来兮","忽觉今是昨非","归去来兮","且随你归","酒雨如注，众人皆醉，昏卧。醒着的两人相视一笑。","酒囊已满，樱口轻启仰头畅饮，你痴痴笑道：","——忽然想吃黄瓜，不知云山旧屋，菜园苗圃一向安好？","——已别千年，我亦不知。不如，随我归去，看看可好？","既然世间，与你我相遗，不如，归去。","——当然好……"],"aud":"","len":461},{"n":111,"c":"生","series":"归去来兮","lines":["归去来兮-生","那日，我人形初成，双眸初睁。","目之所及，见一老者，含泪欢笑。","一片混沌，意识初醒。","见天地万物，听天地万籁，","皆无比新奇欣喜。","风来，十指屈伸，五感渐生。","甫有识，辨分外物、自身；","即有思，辨分外感、内知。","忽忽月过，脑中日渐清朗。","舌下莲花生，出口成人语。","一日，轻抬食指，划过天上地下、四方六合八荒，","起一念：“我”。","百思不解，即问：","——老头，我是谁？","稚嫩之音，老头闻之，却宛若惊闻天雷。原本安然盘坐蒲团之上的老头，忽然单手撑地，飞身起，长袖飘飘，如蝶舞花间，甚是好看。老头在空中兜兜转转，门窗随之而闭，劈掌、风过几案，上百张符骤起，空中，刺鼻的硝黄味道弥漫，门窗缝隙被符咒塞的密不透光。双指并，口中轻喝：“封！”。一道怪符直奔我脑门，“啪”，牢牢贴上似再也取不下。一口气做完这一连串动作，老头缓缓降身形，蹲我面前，似乎担心我会“哇”的哭出来，轻抚我头：小青乖，不怕不怕啊。","我竟扑哧一笑，拍手叫好：","好玩，好玩，再来一次！","老头脸上似有黑线密布。","我这是没心没肺到了极点吗？","——抑或是忘得如此彻底……","嫌脑门上这符碍眼，阻我看杂耍，随手揭下，扔在一旁。这一小小动作，竟骇得老头跌坐在地上，凝望着我，神情味道复杂之极。惊恐、慌乱、哀伤、同情、愤怒、悔恨、怜爱、悲悯、骄傲、欣慰、期许、欢喜……。然而，彼时之我，竟然一味也不曾读出。之后很久，下山入世修，忆起，回望，才会慢慢品出诸多杂味。","老头深呼吸，恢复庄严法相：","小青，这些把戏，","你若喜欢、你若想学，又有何难？","今日起，你我师徒相称吧。","山中岁月长，闲来无事，","师尊便教你这些。可好？","自然是很好喽！","如此，一千年。"],"aud":"","len":669},{"n":123,"c":"落","series":"归去来兮","lines":["归去来兮-落","千年修行已毕，日出露散，昨夜昙花瓣落离枝，见之，不觉悲喜。晨起，随手抓取一团朝霞，幻化腰间彩带，蹦跳着叩响柴门。师尊似已候我多时，眼角皱纹更深，貌似一夜未眠？我递上腰带，兀自嬉笑打趣师尊垂眉，缘何一夜暴涨三寸？","师尊笑意盈目，一瞬，似有一抹黯然划过，任我如何愚钝，也感心神一摇。师尊十指轻叩，一段卦谱新成，仰天默然半晌，长叹。转身命我，离此云山入世，做俗世修，再修三千年。","自我成人形，寸步未曾离山，山下于我，新奇无比。想到离开，竟全无不舍亦无忧，甚或难掩雀跃。师尊嘱我，须守三训；又言，我将遇三劫，赐锦囊三计以对。我全然听不懂，只好囫囵记下，却不知是何真意。","我独自上路，伪装尚好，无人识我是谁。任道行精深法师，抑或手持宝器和尚，甚或已开天眼灵童，我与其擦肩而过，间或浅笑妍妍颌首示意，一副了然于胸之神情。或回我礼貌一笑拱手作揖、或面露疑窦驻足不言，却终看不破我真身。","一路人间行走，看尽风景，阅遍百态。或有心血来潮，幻形男子，悄然入世，或高中状元登庙堂，暗暗周旋宵小，鼎助转世星才，惠济苍生；或入江湖，磊落青衫玉笛，捻竹枝三尺，飞叶十步取恶人首；或居陋巷，手卷诗书典文，收七巷八街顽童入室，日日书声朗朗、夜夜醉卧书床。","我谨遵师训，一身一世，待身边人老，便悄然转入他乡；遵师训，不与人结连理，千年间，仍是孑然一身对影成双；遵师训，不以山中所学示人。","千年倏忽千春秋。","师尊特意嘱我，莫付情凡人，坚守三千载，历遍六十身世，即可回云山，即可入天道。——但师尊未言，若云山已毁，又如何回得去呢？","我自认此身当入天道。况，何者为情，我既不知，何谈付之。且以我眼观，凡人多憨呆，懵然无趣，有目不察，勘不破形相所障，我只哀之怜之；或有地狱之徒漏网轮回转世，肆意为恶，蝇营狗苟，我便尽力毙之；间或有天人转世，记忆被封，可怜多不自知，暴殄天物，我试与之语，每每黯然而散。依师尊所述，若情之本意，可解为喜欢至深爱，以我之傲，对凡人，不厌已是难得，实难“日久生情”。","如此，我与俗世相安无事。平静度过第一个千年。","任皮囊百变，名字百变，总须带个青字。","而我自称，只是小青。","云山之别，我心若孩童。彼时，哪里会知，别即永别；彼时，哪里会知，此后还会有更多相离相别，及至心伤；彼时，以为来去自如，今日虽离，他日转身可循来路归，何须悲之。彼时，哪里会知，别即启程；彼时，哪里会知，此后将一路常寻；彼时，以为所寻尽在远方，又怎知，所寻，原在离开之处。","自下山，我遵师嘱，一路东向，未有回头。","一世行过百里，不觉，已远云山两千里。","这日，结束又一身世，悄然收拾停当，拟再上路。算来，云山之别恰已千年，忽然想回我茅屋，看看当年花草，哦对，顺便看看师尊。师尊知我，我是任性惯了的，老老实实听话一千年，已属不易。抖缰绳调转马头，往来路去。","老马识途，即回头，自然想要回我此世旧家。我呵呵一笑，錦裘不卸皮囊悄换，仍扮男儿身。痴马，今夜随我越江踏浪，先往江南行。各自半斤绿蚁入腹，一人一马皆微醺。","月升中天，坦然入歧路。彼时，天阶月染，我信马松缰，醉卧马上枕臂观月，诸多千年诗文脱口而出。人间纵有万般无趣，但有诗文传世，便值回味。","行至虎丘，忽闻笛声如诉。山间华亭，一影独立。玉笛横唇，清音婉转。一曲终了，忽闻一叹。观你眉间，暗藏寂寥。","我竟痴痴望着你，彻底醉了。许是真的醉了，我缘何想要伸手抹平你紧皱双眉？甩头按下痴想，飞身直上，落于亭前。","——良辰美景，更有兄台雅音，当浮一大白。我双手抱拳，月下朗声。","——相逢天涯，知音何妨一醉？只是在下酒囊已空，若君有酒，愿与君醉卧虎丘！","相遇是命，抑或是劫。","入世千载，至此，方落人间。"],"aud":"","len":1480},{"n":122,"c":"尘","series":"归去来兮","lines":["归去来兮-尘","云小青双手负后，嘴角上扬。","站在树顶的一片叶子上，与叶子一起，随风而摆。","林子里已然乱做一团。","大呼小叫的一群明显不适应陆战的海贼，","从海边一路追杀到内陆，恼羞成怒却无可奈何。","陆小青的功夫，白白顶了江南陆家庄三少爷的名头。","云小青一直猜测他那个师父，是否就是个街头卖艺的师傅。","倒是陆家庄的老管家何叔的确是个高手。","想起初见。","&&&&&&&&&&     &&&&&&&&&&","冬夜无风，却有雪落。","夜半幻出火炉，随手摘下梅枝在炉膛里噼啪作响，似在诉说为梅一生的冷艳故事。几片水嫩的梅花瓣掉入火中，带起一小团雾气升腾，迷住我眼。陆小青睡觉颇不安稳，眉头紧锁，怒意四散，含混不清的呓语，时不时双手挥舞，似要赶走什么。他睁开双眼，见我端坐一旁，抬手伸指轻轻戳着额头，一脸无奈，似在努力回忆。","——青弟，你这酒……","——叫我小青，不加那个弟字！","——哦哦，是了，昨夜你说过。你这酒……","——此酒，谷自千里昆仑，水自万里云上；酿术，独家秘制。","——怪不得，这酒劲可真够劲儿……","——放心，不上头，不伤身。","陆小青仰天，开怀大笑：着实好酒啊！","忽地双手撑地，整个人平平飞起。","在空中打了个旋，落地时变作盘腿坐下。","——小青，接下来如何打算？","——我？四海云游，漫无目的。原拟望西而去，但……","——西边苦寒之地，无趣无趣！","——哼……，眼看冬尽春将至，想去观东海春潮。","——若无要紧事，到陆家庄逗留几日可好？约莫再过半月，我与你一起动身向东，一个月后刚好至东海之滨。","算你乖巧，竟似猜中我想。","——也好，左右无事，那就叨扰兄台去！","——求之不得，哈哈！","白天的陆小青、或者说清醒的陆小青也忒地爱笑，夜晚入睡时的愁苦似一扫而空。我却时时想起他的睡态，不禁恍惚。","即起身，将往陆家庄去。","我原本还愁，两人一马，如何是好？难不成要与他共骑？入世千年还从未与人如此相近呢。却见陆小青口含双指打了个哨，少顷，一人两马施施然从亭后山包转过来。","——何叔，这是我新识的兄弟云小青；","——小青，这是陆家庄何叔。","——何叔早！","——云公子早。","陆小青转头以手掩口低声道：这老家伙快六十岁了，已在我家庄上四十年，是我爹派来专门收拾我的，管了我二十多年。凭我陆小青一身本事，却总“逃”不出他手，从来都是一呼即现。唉，命中注定是我的克星啊。我无语静观，看到陆小青看老何的眼里，分明只有亲情、欢喜，哪有他嘴上说的厌恶。","我侧首看这何叔，一惊。","六十岁？！骗鬼啊！","——这小妖怪起码六百岁。","&&&&&&&&&&     &&&&&&&&&&","有何叔在侧，陆小青占尽上风。","——当然，主要是骂战占了上风。","三十几个海贼，虽被何叔制住大半，且同时以如影随形的无形罡气罩住陆小青，但仍是有七八个眼尖的海贼看出陆小青是个弱鸡，于是撇下何叔直奔陆小青杀来，试图趁何叔换气之机偷袭。不过，他们很快发现，这陆小青的轻身功夫实在了得，各种长长短短的刀剑，根本近不了身。这云小青还一直得空讨尽口头便宜：“哎呀！这位大哥眼神好差，怎么专门砍树啊！我在这儿，我在这儿……哎哎哎，你别砍自己人啊，你看你看，这位小弟弟的大腿流血了，他生你气了！哎哎，我不是故意踢你的啊，你挡我道了！”","小青摘下一片叶子叼在嘴里，抬头看了看天。嗯，应该来点雨才更好玩。袖中手指暗暗捻动，牵动原本零散的几片云彩凑在一起，慢慢遮住当空晴日。轻轻吐出一口气，被吸干水分的叶子化作绿色清尘，消散而去。云端有雨滴落，敲在小青伸出的手指的指甲上，竟似有叮当声响。","——陆兄，何叔！下雨了！快找地方避雨啊！","——小青，待我这就打发了这些毛贼，与你雨中品酒吟诗！","小青自树顶向前虚踏一步，不见身形如何晃动，已迈入林中路边茅亭。以袖裹手，轻抚石桌，三坛绿蚁酒已开封，酒香四溢。陆小青不再戏谑玩闹，忽然出手如电，夺了几把刀剑反手掷出，插入泥地，竟直没至柄。何叔那边已打完收工，安坐亭中，笑看众海贼相互搀扶着逃去。","陆小青独立雨中，故作深沉：","晴雨浥轻尘，","青青柳色新。","与君尽杯酒……","云小青一笑，随手扔过去一坛酒。","陆小青并不回头，轻轻接住，仰头便饮。","驻马江潮前。","何叔拍开一坛酒，小口入嘴，仔细咂摸，神态享受。","不知是享受美酒，还是乐见这两人。","云小青缓缓走出茅亭，索性飞至亭顶，张开双手，仰面淋雨。","——两千年后，我终踏尘归来。","陆小青抹了把脸，痴痴笑着，心中默念：","——可知我愿做一粒尘，且随你行。明知有劫，又何妨？"],"aud":"","len":1760},{"n":117,"c":"信","series":"归去来兮","lines":["归去来兮-信","四月十四，午时。","东海之滨，有潮如龙，一路呼啸而至。","江边十层高楼，观潮者，早已挤作一团。","楼顶上却是只有一人，身姿绰约，青衣长发，慵懒仰卧。","身边有酒三坛，菜却只有两样，一碟花生，一碟黄瓜。","酌一口酒，高高抛起一粒花生米，张口去接。","姿态曼妙无比，只是……","那粒花生却并未入口，而是砸中额头。","云小青悻悻然盘腿坐起，揉着并不疼痛的额头。","恶狠狠地抓了一把花生入口，啃上一口黄瓜。","下意识地左右看看，旋即自嘲：","——他又不在，没人会嘲笑与你，干嘛这么紧张。","偏记忆里的坏笑似乎就在耳边响起：","——哈哈，枉你自吹活过两千年，吃个花生米都不会。","哼！小青随手弹出一粒花生。","刺破潮头，明明是剑气如虹。","观潮楼，九层以上已非寻常人可入。","刚刚还在闭目养神，听潮悟道的书生，忽然睁眼。","——何来此剑气！","手指微曲，虚空一抓，身后小童手捧剑匣骤开。","书生身形不动，仗剑，连人带椅迅速贴至身旁老人。","——护驾！","楼顶，小青咧嘴冷笑：","大惊小怪，谁稀罕你家皇帝老儿。","今日做得，明日做得，又有几年做得？","云小青心中盘点着大潮变迁，算着时年。","一千年前，初下山，看潮，还要北上齐鲁青州岸；","五百年前，须入广陵道；","如今，则要跑到钱塘府来，方能一见大潮。","——再过千年，何处观潮？","——再过千年，你可还会陪我观潮……","日已居中，心下开始烦躁。","这厮，难道又跟去年一样，言而无信？","心里想着，嘴里不由骂出声来：","——臭鹿肉，再不来，我就独饮完这三坛酒！","忽然挺身站起，望向深海：","——哼，真是天生贱骨，不骂你，你就不出现！","嘴角眼角，却不由弯起。","远处一线潮头，隐约有巨鼋稳稳游来。","鼋背之上，有白衣人立。","近岸边时，纵身跃至楼顶：","——留两坛给我！","江海一遇春潮起","东风约定年年信","陆小青盘腿坐下，如山江潮竟丝毫未沾湿衣襟。","从腰间摸出一封信来，随手拍开一坛酒仰头灌下半坛。","——怎么才来？","——我本在南海捉鬼，接到你信，便昼夜兼程而来。","——馋酒了，便承认馋酒，哪来那么多闲话！","——也对，你这独家绿蚁，世人不得见，唯我独享！","——算你有信，管你喝饱！","远处，潮水一线。","素练横江，平沙起白虹！"],"aud":"","len":843},{"n":156,"c":"玩","series":"","lines":["出版应该是很好玩儿的事","出版，应该是很好玩很好玩的一件事才对。","人类历史上很多伟大的发明其实都是为了“更好玩儿”，夸张地说，人类的文明进步，是一路“玩”过来的。在很多关于科学家的报道或者故事里，总是强调他们经历了怎样的艰难困苦，但是我以为，也许他们根本没有觉得很辛苦，反而应该很开心，他们是在“玩”中寻找世界的规律，寻找有价值的知识，用“玩儿”的心态对待一座座未知的思想高峰、一片片未知的知识海洋，乐在其中、流连忘返。所以，他们会足够认真、足够投入、足够“较真儿”地玩，甚至在大家习以为常的现象面前，他们以一种“这事儿真好玩儿”的好奇心，和一定要“玩个明白”的钻研精神，破解了苹果为什么会掉在地上，火药为什么会爆炸，人和猴子为什么有点儿像，风啊云啊雨啊都是从哪里来的……。我们这个国度，似乎就缺了这样一种用玩儿的心态去“较真儿”的精神，缺乏这种“知其然更要知其所以然”的钻研精神。或者说，玩，也是有级别的，玩成大咖、大神级的时候，玩家就会成为专家。众多的科学发现和发明，都是从游戏开始的，就像图灵玩的“猜猜对面是谁”的游戏，打开了通往人工智能的那扇门。","此外，还有一批被称作专业人士的人，他们的乐趣在于，把所有的知识用玩儿的方式做给大家看、传递给更多人。嗯哼，这就是历史上的出版人啊。为什么说是历史上的出版人？因为今天的出版人开始犯懒了，忘记了出版最初的使命，忘记了出版人的初心。","人类总是不断提出一个个的具体问题，比如“地球是圆的吗”，然后呢？从古至今，一群人在想尽办法找到答案，否定答案，否定再否定答案，各种办法去验证答案。而另一群人，不断把各个阶段得到的答案记录下来，描述出来，传播出去。他们发明了语言，口口相传；他们发明了文字，在石板上刻下来，用笔和纸记录下来；他们发明了图画，用各种笔和各种颜料努力还原看得见的世界和看不见的想象；他们发明了电台和无线电传播，记录下伟大的声音去传播答案；他们发明了摄影技术，用机器的“眼睛”把看得见的和看不见的世界的运转录下来，再用机器放给其他人看……。这一群人，爱玩的不得了。","你看看搞出各种符号、各种技术发明的这些家伙，他们都是想着，如何更好玩儿地把知识传播出去、传承下去，他们很认真很严肃地努力让知识变得“好玩儿”，让更多的人热爱上学习，更多的人能够掌握更多知识。为了表示对这些同样伟大的人的尊重，人们专门发明了一个词儿，用来称呼他们的行为，这就是“出版”。","然而，我们今天说到出版，虽然还是沿用了历史上的称谓，但是这个词在实践中的含义范围已经越来越小。我们不再关注“符号”，所以和文字、图画一样地位的，各种计算机语言符号、各种新的音视频符号，都被我们放弃了；我们不再关心“复制技术”，所以和印刷机一样功能的数字内容制作软件被我们漠视了；我们不再关心“传播”，所以和书店一样功能的互联网，被我们看错了；我们甚至不再关心“内容的表现”，所以和立体书、电台、电视台一样功能的AR技术工具和发布平台、音频制作工具和发布平台、大小视频制作工具和发布平台被我们忽视了。我们看不清这个行业变化了的外衣，忘记了我们的使命里包括——要具备对这些工具和平台的运用能力。","在忘记“生产加工、表现和传播内容”这个使命的同时，我们甚至还忘了出版行业这个“知识传播者”的初心，看不透这个行业变化过程中没有变的核心：知识，忘记了做好知识的组织与表达，做好知识的服务，是我们应该肩负的责任。","当然，我们更忘了，出版应该是一件好玩儿的事儿。所以，好玩儿的外衣我们不关注甚至嗤之以鼻：那么花哨给谁看啊？所以，好玩儿的内核我们不关注甚至傲气十足：知识就应该是高高在上不应该那么下里巴人。然而我们忘了，印刷时代的出版人，是那个年代最时髦最时尚的知识传播者，印刷时代的出版物，是让知识变得可以被大众接受的最好玩儿的东西。","聪明的，可不可以停一下匆匆行走的茫然的脚步，在岁月的河里逆流而上，和童年的自己聊聊天，找回心底的那片童话森林，让自己重新变成那个爱玩儿的孩子，和知识做朋友，认认真真地玩起来，用一颗爱玩的心，做出让用户觉得好玩儿的内容产品，让知识更好玩儿、更亲切，和知识一起，去改变世界。"],"aud":"","len":1691}];

function renderPoem(n){
  const a = Q.find(x => x.n === n); if(!a) return;
  const pre = Q.find(x => x.n === n - 1), nxt = Q.find(x => x.n === n + 1);
  $('#dbody').innerHTML = `
    <div class="bmd">
      <div class="bmd-top"></div>
      <div class="bmd-in">
        <div class="bmd-ch">${esc(a.c)}</div>
        <div class="bmd-txt">${esc(a.l.join('\n'))}</div>
        <div class="bmd-no">第 ${pad(a.n)} 张 · 森林的孩子</div>
      </div>
    </div>
    <div class="dfoot">
      ${pre ? `<a href="#q${pad(pre.n)}">← ${esc(pre.c)}</a>` : '<a class="ghost">←</a>'}
      <a class="mid" href="tonghua.html#p${pad(a.n)}">读这首完整的童话 →</a>
      <a class="mid" href="shuowen.html#s${pad(a.n)}">看这个字的一字一解 →</a>
      ${nxt ? `<a href="#q${pad(nxt.n)}">${esc(nxt.c)} →</a>` : '<a class="ghost">→</a>'}
    </div>`;
}

function taleParts(a){
  let lines = a.lines.slice(), sub = '';
  if(lines.length && (lines[0].includes('-') || lines[0].includes('|'))){
    const p = lines.shift().split(/[-|]/).map(s => s.trim()).filter(Boolean);
    sub = p.slice(1).filter(s => s !== a.c).join(' · ');
  } else if(lines.length && lines[0].length <= 20){
    sub = lines.shift().trim();
  }
  return {sub: sub, lines: lines};
}
function renderTale(n){
  const a = W.find(x => x.n === n); if(!a) return;
  const t = taleParts(a);
  const body = t.lines.map(x => {
    if(/^\d{1,2}$/.test(x)) return `<div class="sec-no">${esc(x)}</div>`;
    if(x.length <= 34) return `<div class="vline">${esc(x)}</div>`;
    return `<p>${esc(x)}</p>`;
  }).join('');
  $('#dbody').innerHTML = `
    <div class="twd-title">
      <div class="twd-ch">${esc(a.c)}</div>
      ${t.sub ? `<div class="twd-sub">${esc(t.sub)}</div>` : ''}
      <div class="twd-tag">${a.series ? esc(a.series) + ' · ' : ''}森林边上 · 对应第 ${a.n} 个字</div>
    </div>
    ${a.aud ? `<div class="d-audio">
      <div class="d-audio-l">题外篇 · 朗读</div>
      <audio controls preload="none" src="${esc(a.aud)}"></audio>
    </div>` : ''}
    <div class="prose">${body}</div>
    <div class="dfoot">
      <a href="shuowen.html#s${pad(a.n)}">看「${esc(a.c)}」的一字一解 →</a>
      <a class="mid" href="tonghua.html#p${pad(a.n)}">读「${esc(a.c)}」的童话诗 →</a>
      <a href="#" onclick="back(event)">回到题外篇</a>
    </div>`;
}

function route(){
  const h = location.hash;
  let m;
  if((m = h.match(/^#q(\d{1,3})$/))){
    document.body.classList.add('in-detail'); renderPoem(parseInt(m[1], 10));
  } else if((m = h.match(/^#t(\d{1,3})$/))){
    document.body.classList.add('in-detail'); renderTale(parseInt(m[1], 10));
  } else {
    document.body.classList.remove('in-detail');
  }
  window.scrollTo(0, 0);
}
function back(e){ if(e) e.preventDefault(); location.hash = ''; }
window.addEventListener('hashchange', route);
route();
document.addEventListener('keydown', e => {
  const m = location.hash.match(/^#q(\d{1,3})$/); if(!m) return;
  const n = parseInt(m[1], 10);
  if(e.key === 'ArrowLeft' && n > 1) location.hash = '#q' + pad(n - 1);
  if(e.key === 'ArrowRight' && n < 162) location.hash = '#q' + pad(n + 1);
});

</script>
</body>
</html>
